name: Morning Brief
on:
  schedule:
    - cron: "0 22 * * *"   # 03:30 IST (22:00 UTC); GitHub may start it up to ~30 min late
  workflow_dispatch:
permissions:
  contents: write
concurrency: morning-brief
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and deliver the edition
        env:
          BRIEF_OUT: "."          # episode folders live at the repo root, served by Pages
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}          # optional free-tier keys; the first one set is used
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PYTHONUTF8: "1"
        run: python -m src.main --quiet
      - name: Publish podcast (audio as a release, last 14 kept)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(date -u -d "+5 hours 30 minutes" +%F)
          if [ -f "$D/brief.mp3" ]; then
            gh release create "ed-$D" "$D/brief.mp3" --title "Edition $D" --notes "Audio for The Morning Brief, $D" || gh release upload "ed-$D" "$D/brief.mp3" --clobber
          fi
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^ed-' | sort -r | tail -n +15 | xargs -r -I{} gh release delete {} --cleanup-tag -y
          ls -d 20??-??-?? 2>/dev/null | sort | head -n -30 | xargs -r rm -rf
          git config user.name "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Edition $D" && git pull -q --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
          retention-days: 7
