name: Morning Brief
on:
  schedule:
    # GitHub starts scheduled runs hours late at busy minutes, so: odd minutes, two slots (02:37 and 04:07 IST).
    # The later slot is only a backup: the gate below skips it when today's edition already exists.
    - cron: "7 21 * * *"
    - cron: "37 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: morning-brief
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Skip a scheduled run if today's edition already exists
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(date -u -d "+5 hours 30 minutes" +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "ed-$D" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "edition ed-$D already published: skipping"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != 'true'
      - name: Build and deliver the edition
        if: steps.gate.outputs.skip != 'true'
        env:
          BRIEF_OUT: "."          # episode folders live at the repo root, served by Pages
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}          # optional free-tier keys; the first one set is used
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: python -m src.main --quiet
      - name: Publish podcast (audio as a release, last 14 kept)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(date -u -d "+5 hours 30 minutes" +%F)
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^ed-' | sort -r | tail -n +15 | xargs -r -I{} gh release delete {} --cleanup-tag -y
          ls -d 20??-??-?? 2>/dev/null | sort | head -n -30 | xargs -r rm -rf
          for d in pdf study; do ls $d/*.pdf 2>/dev/null | sort | head -n -30 | xargs -r rm -f; done
          git config user.name "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Edition $D" && git pull -q --rebase && git push)
      - name: Alert me if the run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Morning Brief FAILED" -H "Priority: high" -H "Tags: warning"             -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"             -d "Tonight's run failed. Tap to open the logs." "https://ntfy.sh/$NTFY_TOPIC"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
          retention-days: 7
