name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import traceback, collections
          from src.sources import livelaw as L
          cands, pos = L._collect_candidates(None)
          errs = collections.Counter(); ok = 0
          for c in list(cands.values())[:14]:
              c["_position"] = pos.get(c["url"])
              try:
                  it = L._build_item(c, None, c["_position"])
                  ok += 1 if it else 0
                  if not it: errs["returned None"] += 1
              except Exception as e:
                  errs[f"{type(e).__name__}: {str(e)[:110]}"] += 1
          print("RESULT ok", ok, dict(errs))
          PY
