name: Probe
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "CATALOG: $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://models.github.ai/catalog/models | python3 -c 'import sys,json;d=json.load(sys.stdin);print([m["id"] for m in d][:40])' 2>&1 | head -c 1500)"
          for m in openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-4.1; do
            echo "MODEL $m -> $(curl -s -D /tmp/h -o /tmp/b -w '%{http_code}' -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"In one sentence, what is the doctrine of basic structure?\"}],\"max_tokens\":80}") $(grep -i 'x-ratelimit' /tmp/h | tr -d '\r' | tr '\n' ' ') $(head -c 160 /tmp/b | tr '\n' ' ')"
          done
