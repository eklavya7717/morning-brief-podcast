name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import logging, json
          from src.sources import livelaw as L
          from src.core.fetch import now_ist
          print("now_ist", now_ist())
          cands, pos = L._collect_candidates(None)
          print("candidates", len(cands), "positions", len(pos))
          pub = [c.get("published") for c in cands.values()][:5]
          print("sample published", pub)
          fresh = [c for c in cands.values() if L._candidate_fresh(c, 30)]
          print("fresh", len(fresh))
          items = L.fetch(n=18, config={})
          print("items", len(items))
          for i in items[:6]: print(i["priority"], i["title"][:70])
          PY
