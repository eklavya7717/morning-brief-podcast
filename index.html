cfac84feb67", "source": "thehindu", "category": "editorial", "title": "AI and the consciousness illusion", "court": null, "case_name": null, "ratio": null, "summary": "Explores AI’s illusion of consciousness, debunking myths, and urging regulation amid powerful, language-driven intelligence.", "url": "https://www.thehindu.com/opinion/op-ed/ai-and-the-consciousness-illusion/article71704748.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-16"}, {"id": "95b33229fc64", "source": "livelaw", "category": "high-court", "title": "Mere Abusive Expressions Do Not Constitute Offence U/S 299 BNS Unless Intended To Outrage Religious Feelings: Bombay High Court", "court": "Bombay High Court", "case_name": "Mohammad Hisham Osmani Mohammad Yusuf Osmani v. State of Maharashtra", "ratio": null, "summary": "The Bombay High Court has quashed criminal proceedings under Section 299 of the Bharatiya Nyaya Sanhita (BNS), 2023, observing that merely using insulting or abusive expressions against certain.", "url": "https://www.livelaw.in/high-court/bombay-high-court/mere-use-insulting-abusive-expressions-not-constitute-offence-section-299-bns-558452", "priority": 80, "topics": ["BNS / IPC"], "note": {"Facts": "The applicant was alleged to have posted an objectionable message on Facebook; an FIR was filed under Section 299 of the Bharatiya Nyaya Sanhita, 2023, and the applicant sought quashing of the criminal proceedings.", "Issue": "Whether the Facebook post, consisting of insulting or abusive expressions, amounts to an offence under Section 299 BNS requiring deliberate and malicious intent to outrage the religious feelings of a particular class.", "Held": "The Bombay High Court quashed the FIR, holding that the post did not satisfy the essential ingredients of Section 299 and therefore did not constitute an offence.", "Principle": "Mere use of insulting or abusive expressions, without a deliberate and malicious intention to outrage the religious feelings of a specific class, does not attract liability under Section 299 of the Bharatiya Nyaya Sanhita.", "Provisions": "Section 299, Bharatiya Nyaya Sanhita, 2023; no other statutes or cases cited.", "Exam angle": "Bharatiya Nyaya Sanhita – focus on the ingredients of the offence under Section 299 (deliberate, malicious intent to outrage religious feelings of a class); could be asked to differentiate between general insult and punishable religious outrage."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC"], "landmark": false, "boost": 12}, "date": "2026-11-15"}, {"id": "94cd0ea37537", "source": "livelaw", "category": "high-court", "title": "Rape Victim Need Not Resist By Biting Or Kicking Accused For Her Testimony To Be Believed: Gauhati High Court", "court": "Gauhati High Court", "case_name": "Damba Rabidas v. State of Assam & Anr", "ratio": "Different victims react differently to sexual assault and that the absence of active physical resistance cannot by itself be a ground to discard the survivor…", "summary": "The Gauhati High Court has held that there is no hard and fast rule requiring a rape survivor to physically resist an assault by biting, kicking or pushing the accused for her testimony to be.", "url": "https://www.livelaw.in/high-court/gauhati-high-court/gauhati-high-court-upholds-20year-pocso-sentence-558447", "priority": 80, "topics": ["BNSS / CrPC", "Probation / JJ / POCSO / DV"], "note": {"Facts": "The accused was convicted under the POCSO Act for sexually assaulting a 14-year-old girl; the victim did not physically resist by biting, kicking or pushing, and there were alleged contradictions with her sister’s testimony.", "Issue": "Whether the absence of active physical resistance by a rape survivor bars acceptance of her testimony.", "Held": "The High Court dismissed the appeal, upheld the conviction and ruled that lack of violent resistance is not a ground to discard the survivor’s testimony.", "Principle": "A survivor’s testimony cannot be rejected merely because she did not physically resist the assault; reactions vary with age, personality and circumstances, and no hard-and-fast rule mandates active resistance.", "Provisions": "not stated.", "Exam angle": "POCSO Act – could be asked on the evidentiary test for survivor testimony, focusing on the principle that physical resistance is not essential for conviction."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts"], "acts": ["BNSS / CrPC", "Probation / JJ / POCSO / DV"], "landmark": false, "boost": 13}, "date": "2026-11-15"}, {"id": "d5c61be30eb9", "source": "livelaw", "category": "high-court", "title": "Travel Time To Reach Magistrate Court Excluded From 24-Hour Detention Period Before Arrestee's Production: Telangana High Court", "court": "Telangana High Court", "case_name": "Ummidi Samuel v. State of Telangana and Others", "ratio": null, "summary": "Notably the Supreme Court had also ruled against the artificial distinction between 'arrest' and 'detention' and held that the 24-hour period for production before the Magistrate, in terms of Article 22(2) of the Constitution, will run from the period of 'detention' and not just from the time of formal arrest.", "url": "https://www.livelaw.in/high-court/telangana-high-court/telangana-high-court-dismisses-habeas-corpus-plea-ndps-case-holds-detention-limit-558446", "priority": 79, "topics": ["BNSS / CrPC", "Constitution", "NDPS / SC-ST / PC / others"], "note": {"Facts": "Two persons arrested under the NDPS Act were apprehended at 11:30 a.m. on 3 Sept 2026, formally arrested at 4 p.m., and left the police station at 11:00 a.m. on 4 Sept 2026; they were produced before the Judicial Magistrate at 1:42 p.m. on the same day, totalling 23 hours 45 minutes of detention after excluding travel time.", "Issue": "Whether the detention exceeded the 24-hour limit prescribed by Article 22(2) of the Constitution and Section 58 of the BNSS, considering the time required for travel from the police station to the Magistrate’s Court.", "Held": "The High Court dismissed the habeas corpus petition, holding that the detention was within the permissible period because the 24-hour limit is computed from the time of apprehension up to the commencement of the journey, and travel time is excluded.", "Principle": "The 24-hour period for producing an arrested person before a Magistrate runs from the moment of apprehension (detention) to the start of the journey to the Court; the time taken for travel is not counted toward the statutory/constitutional limit.", "Provisions": "Article 22(2) Constitution; Section 58, BNSS; Directorate of Enforcement v. Deepak Mahajan (1994); Sujit Das v. Union of India (2026).", "Exam angle": "Application of Article 22(2) and Section 58 BNSS on the “24-hour production” rule; could be asked to frame the issue of “when does the 24-hour clock start and does travel time count?” or to list the ingredients for compliance with the constitutional and statutory mandate."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional", "Special criminal Acts"], "acts": ["BNSS / CrPC", "Constitution", "NDPS / SC-ST / PC / others"], "landmark": false, "boost": 14}, "date": "2026-11-15"}, {"id": "a29d12ba2a3d", "source": "livelaw", "category": "high-court", "title": "Country-Made Pistol Cannot Be Classified As 'Prohibited Arm' U/S 7 Arms Act Merely Because It Is Dangerous Or Unlicensed: Bombay High Court", "court": "Bombay High Court", "case_name": "Vikas Kamal Yadav v. State of Maharashtra", "ratio": null, "summary": "The Court noted that the prosecution need not establish that the weapon was actually fired before an accusation of unlawful possession can be considered. The absence of firing or injury was held to be relevant to the circumstances of this occurrence, but did not render unlawful possession innocuous.", "url": "https://www.livelaw.in/high-court/bombay-high-court/country-made-pistol-cannot-be-classified-prohibited-arm-under-arms-act-merely-because-dangerous-unlicensed-558455", "priority": 78, "topics": ["BNSS / CrPC", "NDPS / SC-ST / PC / others"], "note": {"Facts": "The applicant was arrested with a country-made pistol, live cartridges and a mobile phone; a co-accused was found with additional cartridges and a phone. He claimed the weapon was not fired and that a country-made pistol does not automatically fall within the definition of “prohibited arm” under the Arms Act.", "Issue": "Whether a country-made pistol can be classified as a “prohibited arm” under Section 7 of the Arms Act, 1959 merely because it is dangerous or unlicensed.", "Held": "The Bombay High Court held that such a pistol cannot be deemed a prohibited arm solely on the basis of danger or lack of licence; the statutory definition requires specific characteristics or a Central Government notification. Bail was granted.", "Principle": "A weapon is a “prohibited arm” under Section 7 only if it possesses the characteristics enumerated in Section 2(1)(i) or is listed in a notification by the Central Government; mere danger or unlicensed status is insufficient.", "Provisions": "Sections 2(1)(i), 3, 5, 7, 25(1), 25(1B)(a), 25(1) of the Arms Act, 1959; Section 483 of the Bharatiya Nagarik Suraksha Sanhita, 2023; case cited – *Sunderlal Tuhiram Parashar v. National Investigation Agency & Anr.", "Exam angle": "Arms Act – interpretation of “prohibited arm” under Section 7; could be asked to frame the issue of statutory definition versus factual danger, or to list the ingredients (characteristics/notification) required for classification as a prohibited arm."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts"], "acts": ["BNSS / CrPC", "NDPS / SC-ST / PC / others"], "landmark": false, "boost": 13}, "date": "2026-11-15"}, {"id": "1dc8e464b0f9", "source": "livelaw", "category": "high-court", "title": "HP High Court Acquits Postmaster In Misappropriation Case, Finds Audit Records Insufficient To Prove Depositors' Money Was Entrusted To Him", "court": "Himachal Pradesh High Court", "case_name": null, "ratio": "Audit reports and entries in account books alone cannot establish entrustment of money in the absence of independent evidence", "summary": "The Himachal Pradesh High Court has acquitted a former Extra Departmental Branch Postmaster accused of misappropriating depositors' money, holding that audit reports and entries in account books.", "url": "https://www.livelaw.in/high-court/himachal-pradesh-high-court/hp-high-court-acquits-postmaster-finding-audit-records-account-books-insufficient-558462", "priority": 78, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The former Extra Departmental Branch Postmaster was alleged to have received depositors’ money, recorded entries in passbooks, forged signatures and withdrawn amounts, leading to conviction under Sections 409 and 420 IPC.", "Issue": "Whether the prosecution proved the essential element of entrustment and dishonest misappropriation required for criminal breach of trust under Section 409 IPC.", "Held": "The High Court acquitted the petitioner, holding that audit reports, account-book entries and the statement of a witness, without any depositor testimony, do not establish entrustment; thus the ingredients of Section 409 IPC were not proved.", "Principle": "Entrustment of property must be proved by independent evidence; mere documentary records cannot alone establish criminal breach of trust.", "Provisions": "Sections 409 and 420 IPC; audit report (Ex.PW-2/A) and witness statement (PW-2) cited.", "Exam angle": "IPC – Section 409 (criminal breach of trust); could be asked on the requirement of entrustment and the need for corroborative evidence beyond official records."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-15"}, {"id": "af0189135dc3", "source": "livelaw", "category": "high-court", "title": "LiveLaw Himachal Pradesh High Court Monthly Digest : October 2026", "court": null, "case_name": null, "ratio": null, "summary": "Cheque Bounce Complaint Filed Before Deemed Service & Expiry Of 15-Day Payment Period Is Premature: HP High Court Case Name: Basant v/s Virender Singh Citation:2026 LiveLaw (HP) 128The Himachal Pradesh High Court has held that a complaint under Section 138 of the Negotiable Instruments Act, 1881filed before the drawer is deemed to have received the.", "url": "https://www.livelaw.in/high-court/himachal-pradesh-high-court/himachal-pradesh-high-court-monthly-digest-october2026-557874", "priority": 76, "topics": ["NI Act s.138"], "note": {"Facts": "The complainant filed a criminal complaint under Section 138 of the Negotiable Instruments Act, 1881 before the drawer had received the statutory notice and before the expiry of the 15-day period prescribed for payment.", "Issue": "Whether a complaint under Section 138 filed before the deemed service of notice and before the 15-day payment period lapses is maintainable, i.e., can the Magistrate take cognizance of such a premature complaint?", "Held": "The High Court held the complaint premature and said the Magistrate lacked jurisdiction to take cognizance because the statutory notice had not been deemed served and the 15-day period had not expired.", "Principle": "A complaint under Section 138 of the Negotiable Instruments Act is barred if filed before the drawer is deemed to have received the notice and before the completion of the 15-day payment period; such a complaint cannot confer jurisdiction on the Magistrate.", "Provisions": "Section 138, Negotiable Instruments Act, 1881 (no other statutes or cases cited).", "Exam angle": "Negotiable Instruments Act – test the requirement of deemed service of notice and the 15-day period as a jurisdictional prerequisite for filing a Section 138 complaint."}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NI Act s.138"], "landmark": false, "boost": 8}, "date": "2026-11-15"}, {"id": "827d64ddb7c2", "source": "livelaw", "category": "high-court", "title": "Encrypted App, VPN Use Cannot By Themselves Justify Preventive Detention Without Supporting Material: J&K&L High Court", "court": "Jammu & Kashmir and Ladakh High Court", "case_name": null, "ratio": "Serious allegations cannot substitute for specific particulars and supporting material when personal liberty is sought to be curtailed", "summary": "The Jammu and Kashmir and Ladakh High Court has quashed the preventive detention of a man accused of maintaining contact with a Pakistan-based terrorist handler through an encrypted application and providing logistical support to active terrorists, holding that serious allegations cannot substitute for specific particulars and supporting material when personal liberty is sought to be curtailed.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/encrypted-app-vpn-use-cannot-by-themselves-justify-preventive-detention-without-supporting-material-jk-high-court-558453", "priority": 76, "topics": ["Constitution"], "note": {"Facts": "Ajaz Ahmad Seh was detained under Section 8 of the Jammu & Kashmir Public Safety Act, 1978 on grounds that he allegedly used the encrypted app Zangi via a VPN to contact a Pakistan-based terrorist handler and acted as an over-ground worker for terrorists, but the detention order contained no specific dates, content of communications or concrete acts.", "Issue": "Whether an order of preventive detention can be sustained on vague, unspecific allegations of terrorist contact and logistical support without supporting material and independent judicial satisfaction.", "Held": "The High Court quashed the detention order, holding that the grounds were materially deficient and the detaining authority had not exercised an independent mind; mere assertions about encrypted-app or VPN use cannot by themselves justify preventive detention.", "Principle": "Preventive detention is an extraordinary measure that requires specific, intelligible grounds and supporting material; general or speculative allegations, even if serious, cannot replace the need for particular facts and independent assessment by the authority.", "Provisions": "Section 8, Jammu & Kashmir Public Safety Act 1978; Sections 126 & 170, Bharatiya Nagarik Suraksha Sanhita 2023; cited cases: *Rekha v. State of Tamil Nadu* (2011) 5 SCC 244, *Vijay Narain Singh v. State of Bihar* (1984) 3 SCC 14, *Noor-ud-Din Shah v. State of J&K & Ors.* (1989 SLJ 1).", "Exam angle": "Questions may test the J&K Public Safety Act’s preventive-detention clause, focusing on the requirement of particularised grounds and the distinction between ordinary criminal prosecution (e.g., under UAPA 1967) and preventive detention."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-15"}, {"id": "b557c1c8f178", "source": "livelaw", "category": "high-court", "title": "HP High Court Upholds Acquittal In 2 Kg Charas Case, Cites Discrepancy In Colour Of Tape Used During Seizure & Produced In Court", "court": "Himachal Pradesh High Court", "case_name": null, "ratio": null, "summary": "The Himachal Pradesh High Court has upheld the acquittal of three accused persons in a case involving the alleged recovery of 2.002 kg of charas under the NDPS Act, observing that a discrepancy in the colour of the tape used to seal the seized contraband raised doubts regarding the identity and safe custody of the case property.", "url": "https://www.livelaw.in/high-court/himachal-pradesh-high-court/hp-high-court-yellow-tape-seizure-records-brown-tape-court-558464", "priority": 76, "topics": ["BNSS / CrPC", "NDPS / SC-ST / PC / others"], "note": {"Facts": "The police seized 2.002 kg of charas from a backpack on a Mahindra XYLO vehicle on 26 December 2016 and sealed it with yellow tape; when opened in court it was found in brown-taped packets, leading to doubts about identity and custody. The accused were charged under Sections 20 and 29 of the NDPS Act, but the Special Judge acquitted them on grounds of inconsistencies; the State appealed.", "Issue": "Whether the prosecution proved recovery of the charas from the accused’s conscious possession despite the discrepancies in the sealing tape and other material contradictions.", "Held": "The Himachal Pradesh High Court dismissed the appeal, upheld the acquittal and held that the prosecution failed to establish recovery from conscious possession.", "Principle": "A discrepancy in the sealing/taping of seized narcotics that creates doubt about the identity or safe custody of the property defeats the prosecution’s burden to prove recovery from the accused’s conscious possession.", "Provisions": "Sections 20, 29 and 42(2) of the NDPS Act; no other statutes or cases cited.", "Exam angle": "NDPS Act – focus on Sections 20, 29 (offences) and 42(2) (reasons of belief) – could be asked on the evidentiary requirement of “conscious possession” and the importance of proper sealing/custody of seized narcotics."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts"], "acts": ["BNSS / CrPC", "NDPS / SC-ST / PC / others"], "landmark": false, "boost": 13}, "date": "2026-11-15"}, {"id": "0fd5e6a2ce41", "source": "livelaw", "category": "high-court", "title": "Plea Moved Before Kerala High Court Challenging Clean Chit To Chief Minister VD Satheesan In Punarjani-FCRA Case", "court": "Kerala High Court", "case_name": "Adv. K.M. Shajahan v. State of Kerala and Ors", "ratio": null, "summary": "The plea states that Satheesan took a private trip to the UK in October 2018 to actively solicit foreign funds of £22,500. It is stated that then Vigilance and Anti-Corruption Bureau (VACB) Director recommended for a CBI enquiry after noting suspicious financial movements totalling over ₹1.22 crore distributed across the FCRA, current, and personal bank accounts of Ahammed. However, he was replaced and the preliminary report was closed claiming “no vigilance angle”. It is further stated that the corruption charges against Satheesan were dropped shortly after the 2026 Legislative Assembly election results were declared.", "url": "https://www.livelaw.in/high-court/kerala-high-court/kerala-high-court-vd-satheesan-punarjani-fcra-vigilance-case-558437", "priority": 73, "topics": ["NDPS / SC-ST / PC / others"], "note": {"Facts": "The petition challenges the clean chit given to Kerala CM V.D. Satheesan and Manappat Foundation Chairman Ameer Ahamed in the Punarjani-FCRA vigilance case, alleging that Satheesan solicited foreign funds for a flood-rehabilitation scheme in violation of the FCRA and that a preliminary vigilance report recommending a CBI enquiry was improperly closed.", "Issue": "Whether the Kerala High Court can set aside the vigilance department’s closure of the preliminary report and direct enforcement of the recommendation for a CBI inquiry on the ground of abuse of power and violation of FCRA provisions.", "Held": "(Not stated in the source – the matter is listed for hearing; no decision yet).", "Principle": "(Not stated in the source – the petition relies on the proposition that a vigilance authority’s closure of a report recommending CBI investigation, despite clear evidence of wrongdoing, constitutes an abuse of administrative power and may be reviewed by the High Court under its inherent jurisdiction).", "Provisions": "Section 3(2)(a) of the Foreign Contribution (Regulation) Act, 2010; Rules of Procedure and Conduct of Business of the Kerala Legislative Assembly (as mentioned); no case law cited.", "Exam angle": "Questions may be framed on the FCRA (especially Section 3(2)(a) prohibiting MLAs from soliciting foreign contributions) and the scope of vigilance/anti-corruption authority powers versus judicial review under inherent jurisdiction of the High Court."}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NDPS / SC-ST / PC / others"], "landmark": false, "boost": 8}, "date": "2026-11-15"}, {"id": "19f59f6e4782", "source": "livelaw", "category": "high-court", "title": "Allahabad High Court Upholds Dismissal Of Court Employee For Manipulating Convict's Age In Records To Make Him Eligible For Release", "court": "Allahabad High Court", "case_name": null, "ratio": null, "summary": "The Allahabad High Court recently upheld the dismissal of a court employee who was found guilty of manipulating the age of a convicted prisoner in the judicial record to enable him to claim the benefit of a government scheme for the release of elderly prisoners.", "url": "https://www.livelaw.in/high-court/allahabad-high-court/allahabad-hc-court-employee-dismissal-convict-age-manipulation-558471", "priority": 71, "topics": ["Constitution"], "note": {"Facts": "A court employee, Seema Sharma, altered the age of a convicted prisoner in a 1977 Sessions record from 19 years to 38 years to make him eligible for a 2000 government scheme releasing prisoners over 60 years.", "Issue": "Whether the dismissal of the employee for manipulating a judicial record constitutes a valid disciplinary action under service rules and is maintainable on a writ petition under Article 226.", "Held": "The Allahabad High Court upheld the dismissal, finding the manipulation a serious misconduct amounting to direct interference with the administration of justice and refusing to interfere with the departmental findings.", "Principle": "Manipulation of a judicial record is a grave misconduct that justifies dismissal; courts will not substitute their view for factual findings of departmental inquiries when those findings are affirmed by disciplinary authorities.", "Provisions": "Section 313 CrPC (age recorded in statement); Rule 4(d) U.P. Subordinate Court Staff Punishment and Appeal Rules, 1976 (punishment provision); Article 226 Constitution (judicial review).", "Exam angle": "Service law – disciplinary action under the U.P. Subordinate Court Staff Rules; could be asked on the scope of judicial review of departmental inquiries (Article 226) and the test for “serious misconduct” warranting dismissal."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-15"}, {"id": "4b13e87f5c13", "source": "sccblog", "category": "legislation", "title": "Centre notifies Fourth Amendment to Gold Hallmarking Order, 2020; expands district-wise coverage to 398 in 26 States and UTs", "court": null, "case_name": null, "ratio": null, "summary": "On 2 Nov 2026, the Ministry of Consumer Affairs, Food and Public Distribution (Department of Consumer Affairs) notified the Hallmarking of Gold Jewellery and Gold Artefacts (Fourth Amendment) Order, 2026 . Issued in consultation with the Bureau of Indian Standards (BIS) under the BIS Act, 2016 , the order amends the Hallmarking of Gold Jewellery.", "url": "https://www.scconline.com/blog/post/2026/11/14/gold-hallmarking-district-list-fourth-amendment-order-2026/", "priority": 64, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "2c3b82adbb30", "source": "livelaw", "category": "high-court", "title": "Jammu & Kashmir And Ladakh High Court Monthly Digest: October 2026", "court": null, "case_name": null, "ratio": null, "summary": "Nominal Index:Tabinda Nazir v. Union Territory through Police Station Baramulla 2026 LiveLaw (JKL) 423Nusrat Jan And Another v. Union Territory of J&K (Home) And Others 2026 LiveLaw (JKL) 424Ali Hussain Shah v.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/jammu-kashmir-and-ladakh-high-court-monthly-digest-october-2026-557285", "priority": 58, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "f98ece59ec4f", "source": "livelaw", "category": "high-court", "title": "Assistant Professors Absorbed Into Cadre Entitled To Same Advance Increments As Direct Recruits: Tripura High Court", "court": "Tripura High Court", "case_name": "Dr. Tripti Saha & Ors. v. State of Tripura & Ors", "ratio": "Assistant Professors absorbed into the cadre are entitled to the same advance increments as directly recruited Assistant Professors and cannot be discriminated against merely because…", "summary": "Division Bench: Justice M.S. Ramachandra Rao, Justice S. Datta Purkayastha", "url": "https://www.livelaw.in/high-court/tripura-high-court/tripura-high-court-assistant-professors-absorbed-cadre-entitled-same-advance-increments-direct-recruits-558444", "priority": 57, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "d91b418b855e", "source": "livelaw", "category": "high-court", "title": "'Very Grim Picture': Gauhati High Court Expresses Concern Over 1.16 Lakh Declared Foreigners Yet To Be Apprehended In Assam", "court": "Gauhati High Court", "case_name": "Smt. Hamida Begum v. Union of India & Ors", "ratio": "The Central and State Governments have a duty to preserve the country's unity and integrity", "summary": "The Gauhati High Court has expressed concern over the failure to apprehend and expel 1,16,946 declared foreign nationals across Assam's 36 districts describing the situation as a “very grim picture” and observing that the Central and State Governments have a duty to preserve the country's unity and integrity.", "url": "https://www.livelaw.in/high-court/gauhati-high-court/gauhati-high-court-upholds-detention-pending-expulsion-558445", "priority": 57, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "2427cf5f63b7", "source": "livelaw", "category": "high-court", "title": "National Highways Act | Landowners Entitled To Interest For Delay In Deposit Of Compensation: HP High Court", "court": "Himachal Pradesh High Court", "case_name": null, "ratio": "Landowners are entitled to interest on compensation for the period during which the authorities delayed depositing the awarded amount…", "summary": "The Himachal Pradesh High Court has held that landowners are entitled to interest on compensation for the period during which the authorities delayed depositing the awarded amount, observing that compensation cannot be withheld in the absence of a stay order by a competent court.", "url": "https://www.livelaw.in/high-court/himachal-pradesh-high-court/hp-high-court-landowners-entitled-interest-delay-deposit-compensation-558459", "priority": 57, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "22714ddba018", "source": "livelaw", "category": "high-court", "title": "'Individual Member Of Minorities Commission Has No Authority To Issue Orders On Behalf Of Commission': Patna High Court", "court": "Patna High Court", "case_name": "Bihar Public Service Commission v. Bihar State Minorities Commission and Ors", "ratio": null, "summary": "The Court set aside an order issued by a member of the Commission directing the Bihar Public Service Commission (BPSC) to consider recommending a candidate for appointment as Assistant Professor (Physics).", "url": "https://www.livelaw.in/high-court/patna-high-court/patna-high-court-individual-member-minorities-commission-authority-issue-orders-558460", "priority": 55, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "568417e3ec5c", "source": "livelaw", "category": "high-court", "title": "Waiting-List Appointee Cannot Claim Seniority From Date Of Original Select List: J&K&L High Court", "court": "Jammu & Kashmir and Ladakh High Court", "case_name": null, "ratio": "A candidate appointed against a vacancy arising due to the non-joining of a selected candidate cannot claim seniority from the date on which candidates from…", "summary": "The Court clarified that the merit-based principle under the proviso to Rule 24(1) applies to candidates appointed simultaneously. It cannot be invoked by a candidate whose appointment takes place subsequently against a vacancy that becomes available after the original selection process has concluded.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/jkl-high-court-holds-waiting-list-appointee-cannot-claim-seniority-from-date-of-original-select-list-says-merit-alone-does-not-determine-inter-se-seniority-558454", "priority": 55, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "c4778a67ff12", "source": "livelaw", "category": "high-court", "title": "Anganwadi Centres Are Educational Institutions Under Excise Rules, Liquor Shops Cannot Be Within 1000 Feet: Calcutta High Court", "court": "Calcutta High Court", "case_name": null, "ratio": null, "summary": "The Calcutta High Court has held that Anganwadi centres qualify as recognised educational institutions for the purpose of Rule 8 of the West Bengal Excise (New Sites and Grant of Licence) Rules.", "url": "https://www.livelaw.in/high-court/calcutta-high-court/anganwadi-centres-are-educational-institutions-under-excise-rules-liquor-shops-cannot-be-within-1000-feet-calcutta-high-court-558485", "priority": 55, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-15"}, {"id": "301b7ca5a8c8", "source": "indianexpress", "category": "national", "title": "Centre asks states to fix officers to track pollution curbs, seals 191 units", "court": null, "case_name": null, "ratio": null, "summary": "Following a hearing on November 3, the CAQM had earlier this month directed the MCG Commissioner to file a complaint against the engineer before the Judicial Magistrate.", "url": "http , "syllabus": null, "date": "2026-11-15"}, {"id": "a41b9e8e59a2", "source": "thehindu", "category": "editorial", "title": "Strong sense of smell", "court": null, "case_name": null, "ratio": null, "summary": "Dogs chase vehicles in a small town due to strong scent cues, territorial behavior, and a truck hauling dead carcasses triggering ferocity.", "url": "https://www.thehindu.com/opinion/open-page/strong-sense-of-smell/article71694193.ece/", "priority": 72, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-15"}, {"id": "2ba5ba940f42", "source": "indianexpress", "category": "editorial", "title": "As Jensen Huang leaves Nvidia, what really is the threat to the AI economy?", "court": null, "case_name": null, "ratio": null, "summary": "Jensen Huang didn’t invent artificial intelligence, but few people have done more to translate its scientific promise into a global technological and industrial revolution. By advancing GPU computing, creating CUDA (Compute Unified Device Architecture) and building an ecosystem of chips, software, developers and infrastructure, he helped provide the computational foundations on which modern AI has scaled.", "url": "https://indianexpress.com/article/opinion/columns/jensen-huang-leaves-nvidia-threat-to-ai-circular-economy-10963063/", "priority": 70, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-15"}, {"id": "214a055eb5ce", "source": "scobserver", "category": "supreme-court", "title": "Learning and unlearning - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "The Supreme Court’s latest report on gender asks a question that appeals rarely do: how do judges learn to write? One of the first briefs I worked on as an Advocate at the Calcutta High Court was a matrimonial dispute. The counsel for the husband had argued that the wife did not deserve maintenance as.", "url": "https://www.scobserver.in/journal/learning-and-unlearning/", "priority": 98, "topics": ["BNS / IPC", "Hindu / Muslim law", "Constitution"], "note": {"Facts": "A Calcutta High Court judge dismissed a wife’s maintenance claim on the basis that drinking and smoking were “not part of our culture,” and an Allahabad High Court held that a minor girl’s breast-grabbing was merely “preparation” to rape, not an “attempt.”", "Issue": "Whether judicial language that reflects gender stereotypes should be curtailed and guided by sensitivity and constitutional dignity.", "Held": "The Supreme Court intervened, observing that efforts to sensitize judges had “not borne the fruit that was expected” and directed the National Judicial Academy to recommend changes, emphasizing compassionate, gender-sensitive writing.", "Principle": "Judgments must be free of stereotypical, pejorative language and should reflect compassion, humanity, and respect for bodily autonomy and constitutional dignity; judges should limit descriptions to facts necessary for decision-making.", "Provisions": "Not stated (the source references the 2023 Handbook on Combating Gender Stereotypes, the 2023 Supreme Court judgment in *Joseph Shine v. Union of India*, *Bharwada Bhoginbhai Hirjibhai v. State of Gujarat* (1983), *Lillu @ Rajesh v. State of Haryana* (2013), and *Aparna Bhat v. State of Madhya Pradesh* (2021) but gives no specific statutory sections).", "Exam angle": "Criminal Procedure Code / IPC – gender-sensitisation of judicial officers; could be asked as an issue-framing question on how the Supreme Court’s directives on language affect the interpretation of offences like rape and dowry death."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNS / IPC", "Hindu / Muslim law", "Constitution"], "landmark": false, "boost": 14}, "date": "2026-11-14"}, {"id": "63a0017e009d", "source": "scobserver", "category": "supreme-court", "title": "Tejpal returns to the Supreme Court - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scobserver.in/journal/tejpal-returns-to-the-supreme-court/", "priority": 96, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Tarun Tejpal, former editor-in-chief of *Tehelka*, was arrested in November 2013 for alleged rape of a 27-year-old employee; after a trial, acquittal (May 2021) and later conviction by the Bombay High Court, he appealed to the Supreme Court, which dismissed his interim-bail plea and agreed to hear the appeal.", "Issue": "Whether the conviction (and sentencing) of Tejpal can stand in view of the evidentiary standards for complainant testimony, the admissibility of extensive digital data from the complainant’s phone, and the applicability of the amended 2013 rape law.", "Held": "The Supreme Court dismissed Tejpal’s interim-bail application, granted leave to the State of Goa to seek enhancement of the sentence, and issued notice to hear the appeal against the High Court’s conviction.", "Principle": "A conviction for rape may rest on “unshaken” testimony of the prosecutrix, provided the court follows the standards articulated in *Aparna Bhat v State of Madhya Pradesh* that exclude consideration of the survivor’s sexual history; digital evidence must be relevant to the incident and its surrounding circumstances, and its extraction must respect the right to privacy under Article 21.", "Provisions": "- Article 21, Constitution of India (right to a fair trial). - Section 376, IPC (punishment for rape). - *Aparna Bhat v State of Madhya Pradesh* (Supreme Court precedent on survivor testimony). - No other statutes or sections are expressly cited in the source.", "Exam angle": "Questions may test the **Criminal Law – IPC** (Section 376) and **Constitutional Law** (Article 21) by asking: (i) how the Supreme Court’s standards for survivor testimony and exclusion of sexual-history evidence affect the conviction; (ii) the limits on admissibility of digital evidence in rape trials; or (iii) the sentencing discretion under Section 376 in light of mitigating/aggravating factors."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-14"}, {"id": "365a2d34dee1", "source": "livelaw", "category": "high-court", "title": "Deity's Status As 'Perpetual Minor' Doesn't Bar Adverse Possession Claims Over Its Property: Orissa High Court", "court": "Orissa High Court", "case_name": "LRs v. Commissioner of Endowments", "ratio": null, "summary": "The Orissa High Court has reiterated that a deity, despite being a perpetual minor in the eyes of law, is neither exempted from the application of the periods of limitation, nor from the claims of adverse possession against its properties.", "url": "https://www.livelaw.in/high-court/orissa-high-court/orissa-high-court-deity-status-perpetual-minor-exemption-adverse-possession-claims-558423", "priority": 94, "topics": ["CPC", "Contract / Specific Relief", "Transfer of Property"], "note": {"Facts": "The suit land belongs to the deity Maa Sureswari Devi; the plaintiff’s father possessed it for over fifty years and the plaintiff continued possession, seeking settlement which was refused, and then filed suit for adverse possession.", "Issue": "Whether a deity, deemed a perpetual minor, is exempt from the operation of limitation periods and thus from an adverse-possession claim over its property.", "Held": "The Orissa High Court held that a deity is not exempt from limitation; however, the appellant’s claim failed because his long possession was permissive, not hostile, and therefore did not satisfy the requirements for adverse possession.", "Principle": "A deity’s status as a perpetual minor does not create an exemption from the law of limitation; adverse possession can be invoked against deity-owned property only if the possession is hostile and continuous, not merely permissive or under lease.", "Provisions": "not stated.", "Exam angle": "Limitation Act (periods of limitation) and the doctrine of adverse possession – could be asked on whether the minority of a deity bars limitation or on the ingredients of hostile, continuous possession for adverse possession."}, "syllabus": {"clusters": ["Civil procedure", "Obligations", "Property", "Personal, local and constitutional"], "acts": ["CPC", "Contract / Specific Relief", "Transfer of Property", "Limitation / Registration", "Constitution"], "landmark": true, "boost": 24}, "date": "2026-11-14"}, {"id": "6bd0d6b20d4e", "source": "barandbench", "category": "judiciary", "title": "Decorum and protocol in virtual proceedings", "court": null, "case_name": null, "ratio": null, "summary": "Virtual hearings are fast becoming a norm in the Indian judicial system and became routine during the covid pandemic. It has not only given Advocates the freedom and flexibility to appear in various courts and expand their practice without having to travel long distances, the litigants have been provided greater access to courts with the.", "url": "https://www.barandbench.com/law-firms/view-point/decorum-and-protocol-in-virtual-proceedings", "priority": 85, "topics": ["BSA / Evidence", "Constitution"], "note": null, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BSA / Evidence", "Constitution"], "landmark": true, "boost": 22}, "date": "2026-11-14"}, {"id": "980cf50d902c", "source": "livelaw", "category": "supreme-court", "title": "LiveLaw Bharatiya Nagarik Suraksha Sanhita (BNSS) And Bharatiya Nyaya Sanhita (BNS) Monthly Digest: October 2026", "court": null, "case_name": null, "ratio": null, "summary": "SUPREME COURT Delhi Protest | Supreme Court Refuses To Examine Challenge To Section 163 BNSS, Issues Notice On Plea Challenging S. 172 BNSS Case Title: Samriddhi Das v. Union of India and Ors.", "url": "https://www.livelaw.in/digests/monthly-digests/bnss-bns-monthly-digest-october-2026-557861", "priority": 82, "topics": ["BNS / IPC", "BNSS / CrPC", "Constitution"], "note": {"Facts": "Petitioners challenged the constitutional validity of Section 163 BNSS, which authorises executive magistrates to issue prohibitory orders, and also sought relief against Section 172 BNSS, which permits police to detain persons who resist or disregard police directions, arising from the Delhi protests.", "Issue": "Whether the Supreme Court will examine the constitutional validity of Section 163 BNSS and the challenge to Section 172 BNSS.", "Held": "The Court declined to examine the validity of Section 163 BNSS, relying on its earlier upholding of the analogous Section 144 CrPC in *Babulal Parate v. State of Maharashtra* (1961). The Court issued a notice on the challenge to Section 172 BNSS and directed the Union Government to file a reply within two weeks.", "Principle": "The validity of a provision analogous to an earlier upheld provision (Section 144 CrPC) need not be re-examined, but a fresh challenge to a distinct provision (Section 172 BNSS) must be entertained, with the Union required to respond.", "Provisions": "Section 163 BNSS; Section 172 BNSS; *Babulal Parate v. State of Maharashtra* (1961) 3 SCR 423."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNS / IPC", "BNSS / CrPC", "Constitution"], "landmark": false, "boost": 14}, "date": "2026-11-14"}, {"id": "8cd002bc6b0a", "source": "sccblog", "category": "high-court", "title": "“Review petition cannot become an appeal in disguise”; Delhi HC reiterates scope of review under Order 47 Rule 1 CPC", "court": null, "case_name": null, "ratio": null, "summary": "Delhi High Court: While examining a review petition, a Division Bench comprising Vivek Chaudhary and Tejas Karia * , JJ., reiterated that review under Order 47 Rule 1 , Civil Procedure Code (CPC), 1908 is limited to examining any error apparent on the face of record or upon discovery of new and important matter or.", "url": "https://www.scconline.com/blog/post/2026/11/13/delhi-hc-scope-of-review-order-47-rule-1-cpc/", "priority": 82, "topics": ["CPC", "Constitution"], "note": {"Facts": "A review petition was filed in the Delhi High Court challenging a suspension order and seeking enhancement of subsistence allowance, which had not been specifically pleaded in the original writ petition.", "Issue": "Whether a review under Order 47 Rule 1 CPC can be used to reassess the merits of the case or to serve as an appeal in disguise.", "Held": "The Division Bench dismissed the review petition, holding that no error apparent on the face of the record existed and that the review could not be employed to re-examine the merits or act as an appeal.", "Principle": "Review under Order 47 Rule 1 CPC is confined to correcting errors apparent on the face of the record or considering newly discovered, important evidence; it cannot be used to re-try the case or to convert a review into an appeal.", "Provisions": "Order 47 Rule 1, Civil Procedure Code, 1908; no other statutes, articles or cases cited.", "Exam angle": "CPC – Order 47 Rule 1 review; could be asked to frame the scope of review (error apparent on record / new evidence) versus an appeal, focusing on the limited ingredients for a valid review."}, "syllabus": {"clusters": ["Civil procedure", "Personal, local and constitutional"], "acts": ["CPC", "Constitution"], "landmark": false, "boost": 14}, "date": "2026-11-14"}, {"id": "922d4bd5c039", "source": "sccblog", "category": "high-court", "title": "Unauthorised use of Amitabh Bachchan’s name and photographs infringes publicity rights: Inside Delhi HC ruling", "court": null, "case_name": null, "ratio": null, "summary": "Delhi High Court: While adjudicating a suit filed by Amitabh Bachchan seeking protection of his personality and publicity rights against unauthorised commercial exploitation of his name, image, voice and likeness, a Single Judge Bench of Purushaindra Kumar Kaurav, J. , decreed the suit against the defendants, including unidentified infringers (John Does). The Court held that.", "url": "https://www.scconline.com/blog/post/2026/11/13/amitabh-bachchan-personality-publicity-rights-delhi-high-court/", "priority": 80, "topics": ["CPC"], "note": {"Facts": "Amitabh Bachchan sued several defendants for unauthorised commercial use of his name, image, voice and likeness in apps, messages, books, T-shirts, posters and domain names.", "Issue": "Whether the defendants’ unauthorised exploitation of the plaintiff’s persona infringes his right of publicity.", "Held": "The Court found infringement of publicity rights and decreed the suit, granting permanent injunctions against all defendants, including the John Does.", "Principle": "Infringement of the right of publicity occurs when (i) the plaintiff has a valid, enforceable right in his identity and (ii) the defendant’s unauthorised use makes the celebrity identifiable, thereby exploiting the identity for commercial gain without consent.", "Provisions": "Order 23 Rule 3 CPC; Order 8 Rule 10 CPC; Rule 27 Delhi High Court Intellectual Property Rights Division Rules, 2022; cited *Titan Industries Ltd. v. Ramkumar Jewellers*.", "Exam angle": "Right-to-publicity under the CPC (Order 23 Rule 3 & Order 8 Rule 10) and IP law; could be asked as “What are the ingredients for establishing infringement of publicity rights and which procedural provisions empower the court to grant injunctions?”"}, "syllabus": {"clusters": ["Civil procedure"], "acts": ["CPC"], "landmark": false, "boost": 12}, "date": "2026-11-14"}, {"id": "8d5ebe576059", "source": "livelaw", "category": "high-court", "title": "Gauhati High Court Criticises Assam Pollution Board For Reviving Long-Expired Environmental Consent Of Petroleum Unit", "court": "Gauhati High Court", "case_name": "NOC Foundation v. State of Assam & Others", "ratio": null, "summary": "The Gauhati High Court has quashed an order of the Pollution Control Board, Assam extending the validity of a provisional consent granted to M/s M M Carbon Products Pvt. Ltd. for establishing a Calcined Petroleum Coke (CPC) unit (petroleum processing facility) at Amingaon.", "url": "https://www.livelaw.in/high-court/gauhati-high-court/gauhati-high-court-quashes-assam-pollution-board-extensioncpc-unit-consent-558373", "priority": 80, "topics": ["CPC"], "note": {"Facts": "The Pollution Control Board, Assam extended a provisional consent (PCTE) granted in Dec 2012 for a calcined petroleum coke unit, even though the consent had expired on 9 Oct 2013; the company applied for fresh consent in 2019 and 2021, which the Board treated as an extension.", "Issue": "Whether a Pollution Control Board can revive or extend a provisional environmental consent that expired six years earlier without any statutory authority.", "Held": "The Gauhati High Court quashed the Board’s order dated 31 Dec 2022 extending the expired consent, holding that the Board acted beyond its power.", "Principle": "An expired provisional consent cannot be revived or extended after a long lapse unless a specific statutory provision authorises such extension; absent such provision, the extension is “bad in law and not sustainable.”", "Provisions": "not stated.", "Exam angle": "Environmental law – applicability of the Water (Prevention and Control of Pollution) Act/Air Act provisions on consent validity; could be asked on the requirement of statutory authority for extending environmental consents and the limits of PCB powers."}, "syllabus": {"clusters": ["Civil procedure"], "acts": ["CPC"], "landmark": false, "boost": 12}, "date": "2026-11-14"}, {"id": "41802c038299", "source": "livelaw", "category": "high-court", "title": "'Permanent Lok Adalat Has No Jurisdiction To Record Compromise In Land Disputes': Patna High Court", "court": "Patna High Court", "case_name": "Bigan Shah v. State of Bihar through the District Collector", "ratio": null, "summary": "Patna High Court judgment in Bigan Shah v. State of Bihar through the District Collector.", "url": "https://www.livelaw.in/high-court/patna-high-court/patna-high-court-permanent-lok-adalat-jurisdiction-record-compromise-land-disputes-558268", "priority": 80, "topics": ["CPC", "Constitution"], "note": {"Facts": "A land partition dispute led the parties to a compromise, and the Permanent Lok Adalat (PLA) in Sasaram passed an award on 7 July 2011, which the petitioner later sought to modify for a typographical omission.", "Issue": "Whether a Permanent Lok Adalat has jurisdiction to record a compromise in a land dispute under the Legal Services Authorities Act, 1987.", "Held": "The award is void ab initio; the PLA had no jurisdiction to record a compromise in a land dispute and the award is set aside.", "Principle": "A Permanent Lok Adalat can adjudicate only disputes concerning public utility services; it cannot record compromises in matters outside that domain, such as land disputes.", "Provisions": "Sections 22-A and 22-B(1) of the Legal Services Authorities Act, 1987; no other statutes or cases cited.", "Exam angle": "Test the scope of Sections 22-A/22-B of the Legal Services Authorities Act – whether a PLA can entertain land-related compromises; focus on statutory jurisdiction versus subject-matter limitation."}, "syllabus": {"clusters": ["Civil procedure", "Personal, local and constitutional"], "acts": ["CPC", "Constitution"], "landmark": false, "boost": 14}, "date": "2026-11-14"}, {"id": "3d433c639929", "source": "livelaw", "category": "high-court", "title": "Surgical Needle Found In Woman's Abdomen 12 Years After Surgery: Madras High Court Orders Probe", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The Madras High Court has directed the Tamil Nadu Medical Council to conduct an enquiry after a woman alleged that a surgical needle was left inside her abdomen in a surgery.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-inquiry-surgical-needle-abdomen-12-years-558425", "priority": 80, "topics": ["BNSS / CrPC"], "note": {"Facts": "A woman underwent LSCS with tubectomy in 2010; 12 years later an X-ray revealed a 5 cm surgical needle left in her abdomen, causing pain, weight loss and requiring another operation.", "Issue": "Whether the delay of 12 years in approaching the court bars an enquiry into alleged medical negligence.", "Held": "The Madras High Court refused to accept the belated-approach argument and directed the Tamil Nadu Medical Council to conduct an enquiry and pass appropriate orders.", "Principle": "Delay in filing a petition does not preclude investigation of alleged medical negligence where the plaintiff’s socioeconomic conditions explain the delay and the injury is evident.", "Provisions": "not stated."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-14"}, {"id": "f7f63a86d16f", "source": "livelaw", "category": "high-court", "title": "Telangana High Court Refuses To Exempt HYDRAA Commissioner From Personal Appearance In Contempt Case, Asks DGP To Ensure Presence", "court": "Telangana High Court", "case_name": "Moinuddin Khan v. Narayan Reddy IAS", "ratio": null, "summary": "The Telangana High Court refused to dispense with the personal appearance of the Commissioner of the Hyderabad Disaster Response and Assets Protection Agency (HYDRAA)- A V Ranganath, in a contempt plea over the alleged forcible dispossession of an individual's property in violation of a 2024 court order.", "url": "https://www.livelaw.in/high-court/telangana-high-court/telangana-high-court-refuses-exempt-hydraa-commissioner-personal-appearance-contempt-plea-558404", "priority": 79, "topics": ["BNSS / CrPC", "Contract / Specific Relief"], "note": {"Facts": "The petitioner alleges that the HYDRAA Commissioner and the Tahsildar forcibly dispossessed his property in violation of a 2024 court order and dismantled structures without prior notice. Both officers were served Form-I notices to appear personally and answer charges of wilful disobedience.", "Issue": "Whether the personal appearance of public officers can be exempted on the ground of official duties in a contempt of court proceeding.", "Held": "The Telangana High Court refused to dispense with personal appearance of the HYDRAA Commissioner and the Tahsildar, directing the DGP and the Hyderabad City Police Commissioner to ensure their presence on the next hearing date.", "Principle": "Officers holding public office must comply with specific directions of the Court and cannot rely on official engagements or pending administrative work as a ground to avoid personal appearance in contempt proceedings.", "Provisions": "not stated."}, "syllabus": {"clusters": ["Evidence and crime", "Obligations"], "acts": ["BNSS / CrPC", "Contract / Specific Relief"], "landmark": false, "boost": 14}, "date": "2026-11-14"}, {"id": "0d5695b6b3d0", "source": "livelaw", "category": "high-court", "title": "Cruel Transportation Of Cattle No Ground To Presume They Were Being Taken For Slaughter: Gujarat High Court", "court": "Gujarat High Court", "case_name": null, "ratio": null, "summary": "The Gujarat High Court granted bail to two men who were booked under Prevention of Cruelty to Animals Act, observing that merely because an animal is found in an inhuman condition would not be a ground to presume that the cattle seized was being transported for slaughtering.", "url": "https://www.livelaw.in/high-court/gujarat-high-court/gujarat-high-court-animal-slaughter-inhuman-condition-558371", "priority": 78, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": null, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-14"}, {"id": "b7d0811ed9b8", "source": "sccblog", "category": "high-court", "title": "Political satire crosses line when it attacks individual dignity: Inside Delhi HC order directing takedown of CM Rekha Gupta’s defamatory AI-generated deepfakes", "court": null, "case_name": null, "ratio": null, "summary": "Disclaimer: This has been reported after the availability of the order of the Court and not on media reports so as to give an accurate report to our readers. Delhi High Court: In a suit instituted by sitting Chief Minister of National Capital Territory of Delhi, Rekha Gupta, seeking permanent injunction restraining the defendants from.", "url": "https://www.scconline.com/blog/post/2026/11/14/del-hc-orders-takedown-cm-rekha-gupta-defamatory-ai-generated-deepfakes/", "priority": 78, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-14"}, {"id": "f01460854171", "source": "livelaw", "category": "high-court", "title": "'High Time For Legislature To Consider Reducing Age Of Juveniles To 16 Years': Kerala High Court", "court": "Kerala High Court", "case_name": "Vinod Vikraman Pillai v. State of Kerala and Ors", "ratio": null, "summary": "Kerala High Court judgment in Vinod Vikraman Pillai v. State of Kerala and Ors.", "url": "https://www.livelaw.in/high-court/kerala-high-court/kerala-high-court-juvenile-justice-age-16-years-558418", "priority": 78, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-14"}, {"id": "a72e9af06a90", "source": "livelaw", "category": "high-court", "title": "Longstanding Practice Of Organising Chhath Puja Can't Justify Use Of Public Green Area: Delhi High Court", "court": "Delhi High Court", "case_name": null, "ratio": "Longstanding practice of organising Chhath Puja at a particular location cannot, by itself…", "summary": "The ruling: Longstanding practice of organising Chhath Puja at a particular location cannot, by itself….", "url": "https://www.livelaw.in/high-court/delhi-high-court/longstanding-practice-of-organising-chhath-puja-cant-justify-use-of-public-green-area-delhi-high-court-558427", "priority": 78, "topics": ["Hindu / Muslim law"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-14"}, {"id": "11fb96a9251b", "source": "livelaw", "category": "high-court", "title": "'Absence Of Weapon, Lack Of Prior Enmity Relevant In Determining Whether Fatal Assault Constitutes Murder': Jharkhand High Court", "court": "Jharkhand High Court", "case_name": "Tasleem Khan v. State of Jharkhand", "ratio": null, "summary": "The Bench discussed the distinction between intention and knowledge under the IPC, observing that knowledge of the possible consequences of an act is not necessarily equivalent to an intention that those consequences should occur. The Court also considered Exception 4 to Section 300 IPC, which concerns sudden fights without premeditation, where the act is committed in the heat of passion without the assailant taking undue advantage or acting cruelly. On examining the prosecution witnesses' testimonies, the Court found that Tasleem Khan was unarmed and that the assault consisted of fist blows and kicks directed towards the deceased's stomach.", "url": "https://www.livelaw.in/high-court/jharkhand-high-court/absence-weapon-prior-enmity-premeditation-relevant-determining-fatal-assault-constitutes-murder-558332", "priority": 77, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": null, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-14"}, {"id": "dfffd9af168b", "source": "livelaw", "category": "high-court", "title": "J&K&L High Court Directs Police To Supply Material Behind 'Militant' Remark Against Complainant In Police Report", "court": "Jammu & Kashmir and Ladakh High Court", "case_name": null, "ratio": "The petitioner must first be supplied the relevant material so that he could examine it and thereafter avail an appropriate remedy under law", "summary": "Justice Shahzad Azeem observed that the petitioner must first be supplied the relevant material so that he could examine it and thereafter avail an appropriate remedy under law. The Court, however, clarified that the direction would not confer immunity upon him if he was found involved in any act warranting prosecution.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/jkl-hc-directs-police-to-supply-material-behind-militant-remarks-against-a-complainant-in-police-report-558337", "priority": 77, "topics": ["BNSS / CrPC"], "note": null, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-14"}, {"id": "0aee9f29a22d", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Quarterly Digest 2026 - Consumer Law [July To September]", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.livelaw.in/supreme-court/supreme-court-quarterly-digest-2026-consumer-law-558316", "priority": 76, "topics": ["Contract / Specific Relief"], "note": null, "syllabus": {"clusters": ["Obligations"], "acts": ["Contract / Specific Relief"], "landmark": false, "boost": 8}, "date": "2026-11-14"}, {"id": "cd34ca374fbf", "source": "livelaw", "category": "high-court", "title": "Calcutta High Court Upholds Life Sentence Of BSF Constable For Killing Colleague Over Relationship With Woman", "court": "Calcutta High Court", "case_name": null, "ratio": null, "summary": "The Court held that the testimony of the sole eyewitness, Dasami Modak, was sufficiently credible to sustain the conviction, particularly as it was supported by the ballistic report, inquest report, forensic evidence and call detail records.", "url": "https://www.livelaw.in/high-court/calcutta-high-court/calcutta-high-court-upholds-life-sentence-of-bsf-constable-for-killing-colleague-over-relationship-with-woman-558385", "priority": 76, "topics": ["BNS / IPC", "BNSS / CrPC"], " ras High Court Directs DVAC To Register FIR, Directs Freezing Of Publishers' Bank Accounts", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The Madras High Court, on Tuesday (November 10), directed the Directorate of Vigilance and Anti-Corruption to register an FIR in connection with the alleged scam in the procurement of books for public libraries. The court has also directed the authorities to take necessary steps to freeze the bank account of alleged fraudulent publishers.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-book-procurement-scam-dvac-directed-register-fir-freeze-bank-account-558026", "priority": 64, "topics": ["Criminal procedure (BNSS)"], "date": "2026-11-11"}, {"id": "3398f32b0c32", "source": "livelaw", "category": "high-court", "title": "Failure To Prove Penetrative Sexual Assault Warrants Modification Of Conviction: Tripura High Court Reduces POCSO Sentence", "court": "Tripura High Court", "case_name": null, "ratio": null, "summary": "The Tripura High Court has held that the prosecution's failure to establish penetrative sexual assault warrants modification of a conviction under Section 6 of the Protection of Children from Sexual Offences (POCSO) Act.", "url": "https://www.livelaw.in/high-court/tripura-high-court/tripura-high-court-reduces-pocso-conviction-aggravated-penetrative-sexual-assault-558000", "priority": 64, "topics": ["General"], "date": "2026-11-11"}, {"id": "f8e8ce644959", "source": "livelaw", "category": "high-court", "title": "RTI | Information Sought To Examine Recruitment Fairness Can't Be Denied For Failure To First Establish Irregularities: P&H High Court", "court": "Punjab & Haryana High Court", "case_name": null, "ratio": null, "summary": "The Punjab and Haryana High Court has set aside an order of the Haryana State Information Commission that refused to give an unsuccessful candidate the videography of the Band Skill Test in a Haryana Police recruitment.", "url": "  became his exclusive property in his individual capacity, and that the grandson has no right by birth in such property.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1148-j-rajesh-minor-thr-his-mother-and-natural-guardian-j-gomathi-v-m-kumaran-dead-thr-lrs-ors-557963", "priority": 100, "topics": ["Civil procedure (CPC)", "Property & land", "Family & succession"], "date": "2026-11-10"}, {"id": "3bc337a154a7", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Directs UP Gov To Identify Undertrials Granted Bail But Haven't Been Released From Jail In 75 Districts", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court has stated that the exercise would cover all undertrial prisoners irrespective of whether they have engaged a private lawyer or have sought assistance of the District Legal Services Authority(DLSA). Further, it must be carried out with the help of the concerned DLSA.", "url": "https://www.livelaw.in/top-stories/supreme-court-directs-up-gov-to-identify-undertrials-granted-bail-but-havent-been-released-from-jail-in-75-districts-557933", "priority": 87, "topics": ["Criminal procedure (BNSS)", "Property & land"], "date": "2026-11-10"}, {"id": "6dde0887ec25", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Directs WhatsApp And Other Intermediaries To Inform Measures To Prevent Digital Arrest Scam & Cybercrimes", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "A bench comprising the Chief Justice of India Surya Kant, Justice Joymalya Bagchi, and Justice V Mohana issued the direction while hearing the suo motu case (In Re: Victims of Digital Arrest Related to Forged Documents) , and matters connected with it.", "url": "https://www.livelaw.in/top-stories/supreme-court-directs-whatsapp-apprise-court-measures-prevent-digital-arrest-scam-cybercrimes-557976", "priority": 86, "topics": ["General"], "date": "2026-11-10"}, {"id": "e90998b70a20", "source": "scobserver", "category": "supreme-court", "title": "Hum Do, Hamare Do? - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "Home > Analysis > Hum Do, Hamare Do? The top court was asked about a birth certificate and has now reopened its 2003 ruling on the two-child rule “Hum Do, Hamare Do” (We two, Our two), the family-planning slogan once made the size of an Indian family a matter of national concern. Two decades after.", "url": "https://www.scobserver.in/journal/hum-do-hamare-do-two-child-policy-supreme-court/", "priority": 82, "topics": ["General"], "date": "2026-11-10"}, {"id": "a87d078be724", "source": "sccblog", "category": "supreme-court", "title": "Supreme Court asks P&H HC to decide PIL petitioner’s locus before examining merits of religious conversion allegations", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: While considering a Special Leave Petition challenging the interim order dated 27 August 2026 passed by the Punjab and Haryana High Court in a Public Interest Litigation (PIL) concerning allegations relating to religious conversions and other activities, the Division Bench of Pamidighantam Sri Narasimha and Alok Aradhe, JJ. , declined to interfere with.", "url": "https://www.scconline.com/blog/post/2026/11/10/supreme-court-on-pil-locus-standi-in-religious-conversion-case/", "priority": 82, "topics": ["General"], "date": "2026-11-10"}, {"id": "6a5a221a20c1", "source": "barandbench", "category": "supreme-court", "title": "Five days for some, five years for others: What the Collegium's own record says", "court": null, "case_name": null, "ratio": null, "summary": "Justice Sanjay Kishan Kaul's memoir, entitled Without Fear or Favour, has started a debate. The former judge said that ex-Chief Justice of India DY Chandrachud was too deferential to the government on appointments . He recalled a Collegium meeting where, he says, the Chief Justice took him aside and wondered whether to phone the government.", "url": "https://www.barandbench.com/columns/five-days-for-some-five-years-for-others-what-the-collegiums-own-record-says-about-the-kaulchandrachud-row", "priority": 82, "topics": ["Judiciary & profession"], "date": "2026-11-10"}, {"id": "6d3a785cb87a", "source": "sccblog", "category": "supreme-court", "title": "Balance sheet entries can acknowledge a debt and renew limitation under Section 18, Limitation Act: SC restores money recovery suit", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: In an appeal concerning rejection of a money recovery suit as barred by limitation, the three-Judge Bench of Vikram Nath* , Augustine George Masih and Sandeep Mehta, JJ., held that entries in the defendant-Society’s balance sheets, read in the context of the surrounding transactions and bank records, could constitute acknowledgement of liability under.", "url": "https://www.scconline.com/blog/post/2026/11/10/supreme-court-section-18-limitation-act-balance-sheet-acknowledgement-debt/", "priority": 82, "topics": ["Civil procedure (CPC)", "Limitation"], "date": "2026-11-10"}, {"id": "31dff0d11626", "source": "sccblog", "category": "legislation", "title": "Delhi notifies Slum and Jhuggi Jhopri Relocation and Rehabilitation Policy, 2026; eligible residents to get 1 BHK housing units", "court": null, "case_name": null, "ratio": null, "summary": "On 4 November 2026, the Government of NCT of Delhi has notified the Delhi Slum and Jhuggi Jhopri Relocation and Rehabilitation Policy, 2026, following its approval by the Delhi Urban Shelter Improvement Board (DUSIB) under Section 10(1) of the Delhi Urban Shelter Improvement Board (DUSIB) Act, 2010. The policy provides a structured mechanism for relocation.", "url": "https://www.scconline.com/blog/post/2026/11/10/delhi-slum-jhuggi-jhopri-relocation-rehabilitation-policy-2026/", "priority": 76, "topics": ["General"], "date": "2026-11-10"}, {"id": "23189d98cc2d", "source": "barandbench", "category": "high-court", "title": "With or without authority? The email controversy at Bombay High Court [Watch Video]", "court": null, "case_name": null, "ratio": null, "summary": "The Bombay High Court on October 29 quashed an administrative directive that froze trustee appointments to the Shree Saptashrungi Niwasini Devi Trust in Nashik, Maharashtra A division bench comprising Justices GS Kulkarni and Neela Gokhale ruled that District Judge Anju Shende, former Special Officer to then-Chief Justice Shree Chandrashekhar, acted with gross impropriety by issuing.", "url": "https://www.barandbench.com/news/with-or-without-authority-the-email-controversy-at-bombay-high-court-watch-video", "priority": 73, "topics": ["Criminal procedure (BNSS)"], "date": "2026-11-10"}, {"id": "72113361df9b", "source": "livelaw", "category": "high-court", "title": "'Compounding Of Companies Act Offence Extinguishes Foundation Of Criminal Prosecution': Patna High Court", "court": "Patna High Court", "case_name": "Subodh Kumar Goel v. State of Bihar and Anr", "ratio": "Once an offence under the Companies Act has been compounded by the competent statutory authority…", "summary": "The Patna HC has held that once an offence under the Companies Act has been compounded by the competent statutory authority, criminal prosecution founded on the same contravention cannot continue.", "url": "https://www.livelaw.in/high-court/patna-high-court/patna-high-court-compounding-companies-act-offence-extinguishes-foundation-criminal-prosecution-557921", "priority": 72, "topics": ["General"], "date": "2026-11-10"}, {"id": "0559fb22850d", "source": "livelaw", "category": "high-court", "title": "PAN Card And Voter ID Alone Cannot Prove Indian Citizenship Without Supporting Records : Gauhati High Court", "court": "Gauhati High Court", "case_name": "Kulchan Begum v. Union of India & Ors", "ratio": "PAN cards and Electoral Photo Identity Cards (EPICs) issued on the basis of self declarations without formal verification cannot by themselves establish Indian citizenship unless…", "summary": "The Gauhati High Court has held that PAN cards and Electoral Photo Identity Cards (EPICs) issued on the basis of self declarations without formal verification cannot by themselves establish Indian.", "url": "https://www.livelaw.in/high-court/gauhati-high-court/gauhati-high-court-pan-card-voter-id-cannot-prove-indian-citizenship-supporting-records-558039", "priority": 72, "topics": ["General"], "date": "2026-11-10"}, {"id": "f9e09d88caa6", "source": "livelaw", "category": "high-court", "title": "Noise Pollution From Mushrooming Construction Sites In Mumbai A Serious Issue Needing Urgent Redressal: Bombay High Court", "court": "Bombay High Court", "case_name": "Ashok Pathare v. State of Maharashtra & Ors", "ratio": "It cannot overlook the fact that pollution in Mumbai is a serious issue", "summary": "The Court noted that it cannot overlook the fact that pollution in Mumbai is a serious issue. It observed that strict noise pollution norms prescribing permissible decibel limits must be followed by all stakeholders.", "url": "https://www.livelaw.in/high-court/bombay-high-court/noise-pollution-construction-sites-mumbai-serious-issue-558011", "priority": 71, "topics": ["Environment"], "date": "2026-11-10"}, {"id": "2fc7c2132d3f", "source": "livelaw", "category": "high-court", "title": "'Mental Illness Cannot Be Ground For Divorce, Refusal To Undergo Treatment Not Automatically Cruelty': Jharkhand High Court", "court": "Jharkhand High Court", "case_name": "Anjali Devi v. Shashi Kumar Pandey and Anr", "ratio": "Mental illness cannot, by itself, be a ground for stigmatising a spouse or dissolving a marriage…", "summary": "The Jharkhand HC has held that mental illness cannot, by itself, be a ground for stigmatising a spouse or dissolving a marriage, and that refusal or inability to undergo medical treatment cannot.", "url": "https://www.livelaw.in/high-court/jharkhand-high-court/jharkhand-high-court-mental-illness-re ence-declaration-conclusive-agricultural-character-sarfaesi-557981", "priority": 70, "topics": ["General"], "date": "2026-11-10"}, {"id": "bdf1054e4c00", "source": "livelaw", "category": "high-court", "title": "Drunk Driving | Authorities Need Not Wait For Criminal Conviction To Suspend Or Revoke Driving Licence: Kerala High Court", "court": "Kerala High Court", "case_name": "Geevarghese K.A. v. State of Kerala", "ratio": null, "summary": "The Kerala High Court recently directed the Transport Commissioner to ensure prompt and effective action is taken to suspend or revoke the licences of persons engaged in drunken driving. Dr. Justice Kauser Edappagath relied on Peethambaran T. R. v. Additional Licensing Authority and Sijo Joseph v. Transport Commissioner and Others and clarified that the Licensing.", "url": "https://www.livelaw.in/high-court/kerala-high-court/kerala-high-court-drunken-driving-suspend-revoke-driving-licence-558029", "priority": 70, "topics": ["General"], "date": "2026-11-10"}, {"id": "9a49620b4fe6", "source": "livelaw", "category": "high-court", "title": "2423 Corruption Cases Pending Throughout TN: Madras High Court Asks State To Examine Setting Up Special Courts", "court": "Madras High Court", "case_name": "Shahul Hameed v. State of Tamil Nadu and Others", "ratio": null, "summary": "The Madras High Court recently flagged the pendency of corruption cases throughout the state of Tamil Nadu and directed the State Government to take appropriate steps for setting up special courts.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-corruption-cases-pending-state-setup-special-courts-558032", "priority": 70, "topics": ["General"], "date": "2026-11-10"}, {"id": "a70c3e3bb151", "source": "livelaw", "category": "high-court", "title": "Manipur High Court Keeps 2027 Census On Hold Till April 30, Directs Centre To Decide Seven Representations", "court": "Manipur High Court", "case_name": "Association & Anr. v. Union of India & Ors
