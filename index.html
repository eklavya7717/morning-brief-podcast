m SIR flaws, restoring some electors but leaving structural problems and limited coverage unresolved.", "url": "https://www.thehindu.com/opinion/editorial/incomplete-remedies-on-special-summary-revision-of-electoral-rolls/article71721539.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "f1c9e89e8fde", "source": "thehindu", "category": "editorial", "title": "The changing dynamic of nationalism in India", "court": null, "case_name": null, "ratio": null, "summary": "Examines civic vs. ethnic nationalism in India, contrasting inclusive freedom-struggle ideals with today’s exclusionary, patriarchal Hindutva and its capitalist ties.", "url": "https://www.thehindu.com/opinion/lead/the-changing-dynamic-of-nationalism-in-india/article71721507.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "b548582ff326", "source": "thehindu", "category": "editorial", "title": "Testing times: On India’s two-Test series against New Zealand", "court": null, "case_name": null, "ratio": null, "summary": "Account subscription benefits alongside Premium Stories, Editorials, Opinions and more. Unlock these with Subscription.", "url": "https://www.thehindu.com/opinion/editorial/testing-times-on-indias-two-test-series-against-new-zealand/article71717329.ece/", "priority": 72, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "555fd90c062e", "source": "livelaw", "category": "supreme-court", "title": "Stay Of Conviction Can't Be Sought Only To Contest Elections : Supreme Court", "court": "Supreme Court", "case_name": "STATE OF U.P v. MOHAMMAD AZAM KHAN AND ORS", "ratio": "Courts cannot permit statutory powers to be leveraged to suit political calendars.", "summary": "The Supreme Court has cautioned that a stay of conviction cannot be sought merely to pursue electoral ambitions or contest upcoming elections, observing that courts cannot permit statutory powers to be leveraged to suit political calendars. At the same time, the Court held that judicial discretion to stay a conviction must be cautiously exercised by balancing the irreversible damage to an individual's personal reputation and dignity against the sanctity of a judicial finding of guilt.", "url": "https://www.livelaw.in/supreme-court/stay-of-conviction-cant-be-sought-only-to-contest-elections-supreme-court-558898", "priority": 100, "topics": ["BNSS / CrPC"], "note": {"Facts": "The Supreme Court entertained appeals by Mohammad Abdullah Azam Khan and Dr Tazeen Fatma, seeking a stay of their convictions in a case alleging use of conflicting birth certificates, and a State of U.P. appeal challenging a High Court stay.", "Issue": "Whether a stay of criminal conviction may be granted solely to enable the petitioner to contest elections or pursue electoral ambitions.", "Held": "The Court allowed the stays of conviction pending revision but categorically held that a stay cannot be granted merely on the ground of political or electoral expediency.", "Principle": "A stay of conviction must be exercised with judicial discretion, balancing the irreversible damage to personal dignity (Article 21) against the sanctity of a conviction, and cannot be used as a tool to suit political calendars.", "Provisions": "Section 389(1), Criminal Procedure Code; Article 21 of the Constitution; reference to *Afjal Ansari v. State of U.P.* (2023).", "Exam angle": "Criminal Procedure Code – application of Section 389(1) in the context of electoral politics; could be asked as an issue-framing question on the limits of seeking stay of conviction under the Representation of the People Act or on the interplay between Article 21 and criminal convictions."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "4d1e81f6d4ba", "source": "livelaw", "category": "high-court", "title": "Whether Magistrate's Order Directing FIR Registration Is Revisable? J&K High Court Refers Legal Question To Larger Bench", "court": "Jammu & Kashmir and Ladakh High Court", "case_name": null, "ratio": null, "summary": "The Jammu & Kashmir and Ladakh High Court has referred to a larger Bench the question whether an order passed by a Magistrate under Section 156(3) CrPC, directing registration of an FIR and police investigation, is an interlocutory order barred from revision or an intermediate order amenable to revisional jurisdiction.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/whether-magistrates-order-directing-fir-registration-is-revisable-jk-high-court-refers-legal-question-to-larger-bench-558974", "priority": 100, "topics": ["BNSS / CrPC", "Constitution"], "note": {"Facts": "Two petitions challenged orders of Judicial Magistrates directing registration of FIRs under Section 156(3) CrPC; the petitioners argued that such orders are interlocutory and not subject to criminal revision, while the respondents contended they are intermediate orders amenable to revision.", "Issue": "Whether an order passed by a Magistrate under Section 156(3) CrPC directing FIR registration and investigation is an interlocutory order barred by Sections 397(2) CrPC and 438(2) BNSS, or an intermediate order subject to criminal revision.", "Held": "The Jammu & Kashmir and Ladakh High Court did not decide the issue but referred six specific questions to a larger Bench for authoritative determination.", "Principle": "The nature of an order (interlocutory vs. intermediate) must be examined by its jurisdiction, issue decided, effect and legal consequences; mere non-determination of guilt does not automatically render it interlocutory, and an order may acquire revisional jurisdiction if it decides a substantial legal right or jurisdictional question.", "Provisions": "State of Haryana*, *Madhu Limaye v. State of Maharashtra*, *Girish Kumar Suneja v. CBI*, *Father Thomas v. State of U.P.* (Allahabad HC), *Arun P. Gidh v. Chandraprakash Singh* (Bombay HC), *Manohar Nath Sher v. State of J&K*, *Satpal Sharma v. Pawan Singh Rathore*, *Anurag Bhatnagar & Anr. v. State (NCT of Delhi)*, *Priyanka Srivastava v. State of Uttar Pradesh*, *Anil Kumar v. M.K. Aiyappa*.", "Exam angle": "Criminal Procedure Code – test the revisional jurisdiction under Section 397 CrPC vis-à-vis orders under Section 156(3) CrPC; focus on distinguishing interlocutory and intermediate orders and the impact of Supreme Court precedents (Amar Nath, Madhu Limaye, Suneja)."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Constitution"], "landmark": true, "boost": 21}, "date": "2026-11-19"}, {"id": "f443be8758a0", "source": "livelaw", "category": "supreme-court", "title": "Constructive Res Judicata | Claim Based On Subsequent Cause Of Action Not Barred By Judgment On Prior Cause Of Action : Supreme Court", "court": "Supreme Court", "case_name": "Ashok Kumar v. Central Bank of India & Ors", "ratio": "The principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings…", "summary": "The Supreme Court on Wednesday (November 18) held that the principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1171-ashok-kumar-v-central-bank-of-india-ors-558998", "priority": 100, "topics": ["CPC"], "note": {"Facts": "The Supreme Court on Wednesday (November 18) held that the principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings.", "Held": "The principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings…", "Principle": "The principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings…", "Provisions": "Held that the principle of constructive res judicata would apply only if the cause of action for claiming interest on delayed payment of salary had existe; Noted that the claim for interest required adjudication of separate factual issues, including entitlement to interest, the period of delay attributable to"}, "syllabus": {"clusters": ["Civil procedure"], "acts": ["CPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "dec9cb89ece5", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Dismisses PIL Seeking Ban On Animal Sacrifices For Religious Rituals", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court today dismissed a public interest litigation seeking a ban on killing of animals in the name of religion. A bench of Justice Vikram Nath, Justice R Mahadevan, and Justice Aparesh.", "url": "https://www.livelaw.in/top-stories/supreme-court-dismisses-pil-seeking-ban-on-animal-sacrifices-for-religious-rituals-558980", "priority": 96, "topics": ["BNS / IPC"], "note": {"Facts": "A public interest litigation was filed by Advocate Shruti Bist seeking a direction to the Ministry of Animal Husbandry to amend Section 28 of the Prevention of Cruelty to Animals Act, 1960, to prohibit killing animals in the name of religion.", "Issue": "Whether the saving clause in Section 28, which exempts animal killing required by any religion, can be struck down or amended to ban animal sacrifice.", "Held": "The Supreme Court, a bench of Justices Vikram Nath, R Mahadevan and Aparesh Singh, dismissed the PIL and did not order any amendment to Section 28.", "Principle": "A statutory saving clause that expressly protects religiously mandated animal killing cannot be overridden by a PIL; the Court will not interfere with a clear legislative provision on religious practice.", "Provisions": "Section 28 of the Prevention of Cruelty to Animals Act, 1960; no other statutes, articles or cases are cited in the source.", "Exam angle": "Questions may test the Prevention of Cruelty to Animals Act, focusing on the interpretation of Section 28’s savings clause and its interaction with constitutional guarantees of religious freedom."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "e5212d5c2327", "source": "livelaw", "category": "supreme-court", "title": "Asset Reconstruction Company Can Step Into Bank's Shoes In Cheque Bounce Case, But Must Prove It Is 'Holder In Due Course': Supreme Court", "court": "Supreme Court", "case_name": "Kishore Avarsekar & Ors. v. Assets Care and Reconstruction Enterprises Ltd & Ors", "ratio": null, "summary": "The Supreme Court held that an Asset Reconstruction Company (ARC) that acquires a bank's financial asset under Section 5 of the Securitisation and Reconstruction of Financial Assets and Enforcement.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1166-kishore-avarsekar-ors-v-assets-care-and-reconstruction-enterprises-ltd-ors-558884", "priority": 94, "topics": ["NI Act s.138"], "note": {"Facts": "The Supreme Court held that an Asset Reconstruction Company (ARC) that acquires a bank's financial asset under Section 5 of the Securitisation and Reconstruction of Financial Assets and Enforcement.", "Held": "Bench: Justice Dipankar Datta, Justice Sheel Nagu", "Provisions": "Provision: Section 138 of the NI Act"}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NI Act s.138"], "landmark": false, "boost": 8}, "date": "2026-11-19"}, {"id": "98dec3e90153", "source": "livelaw", "category": "supreme-court", "title": "Arbitral Tribunal Final Arbiter Of Facts; Section 37 Court Cannot Make Independent Assessment Of Merits : Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court has reiterated that appellate courts cannot substitute their own interpretation of contractual terms for that of an Arbitral Tribunal if the interpretation adopted by the Tribunal is a possible and plausible one.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1170-rajasthan-rajya-vidyut-utpadan-nigam-ltdv-parsa-kente-collieries-limited-558969", "priority": 92, "topics": ["Constitution"], "note": {"Facts": "The Supreme Court has reiterated that appellate courts cannot substitute their own interpretation of contractual terms for that of an Arbitral Tribunal if the interpretation adopted by the Tribunal is a possible and plausible one.", "Held": "Bench: Justice Satish Chandra Sharma, Justice Nongmeikapam Kotiswar Singh, Justice Sudhir Kumar Katriar", "Provisions": "Provision: Section 37 of the Arbitration and Conciliation Act, 1996; Observed that the Arbitral Tribunal is the final arbiter of facts, and that the construction of contractual terms primarily falls within its domain"}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-19"}, {"id": "56100f4fc02f", "source": "livelaw", "category": "high-court", "title": "Telangana High Court Quashes Preventive Detention Of 6 Accused In CPI Leader's Murder, Finds No Evidence Of Habitual Offending", "court": "Telangana High Court", "case_name": "Nagaraju v. State of Telangana and Others", "ratio": null, "summary": "The Telangana High Court has recently quashed the detention orders of six individuals over the murder of Communist Party of India leader Kethawat Chandu Rathod, consequently classified as 'Goondas' under the Telangana Prevention of Dangerous Activities Act, 1986. The Division Bench comprising of Justice Moushumi Bhattacharya and Justice Renuka Yara said that a single crime.", "url": "https://www.livelaw.in/high-court/telangana-high-court/telangana-high-court-quashes-preventive-detention-six-persons-accused-cpi-leader-chandu-rathod-murder-559021", "priority": 85, "topics": ["BNS / IPC"], "note": {"Facts": "Six persons were detained as “Goondas” under the Telangana Prevention of Dangerous Activities Act, 1986 for the murder of CPI leader Kethawat Chandu Rathod.", "Issue": "Whether a single criminal act (the murder) suffices to classify the accused as habitual offenders (“Goondas”) under the Act.", "Held": "The Telangana High Court quashed the preventive detention orders, holding that a single crime does not meet the statutory requirement of habitual offending.", "Principle": "Classification as a “Goonda” under the Telangana Prevention of Dangerous Activities Act, 1986 requires proof of a pattern of repeated offences; a solitary offence is insufficient.", "Provisions": "Telangana Prevention of Dangerous Activities Act, 1986 (specific sections not stated in the source).", "Exam angle": "Questions may test the ingredients of “Goonda” under the Telangana Prevention of Dangerous Activities Act, 1986 – e.g., “What is the statutory test for deeming a person a ‘Goonda’ and how does the requirement of habitual offending affect preventive detention?”"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "dbbcb120107c", "source": "livelaw", "category": "high-court", "title": "Hindu Marriage Can't Be Dissolved Through Community Separation Deed Unless Custom Is Established: Rajasthan High Court", "court": "Rajasthan High Court", "case_name": null, "ratio": "A Hindu marriage cannot be treated as dissolved merely on the basis of a community separation deed unless the customary practice permitting such dissolution is…", "summary": "The ruling: A Hindu marriage cannot be treated as dissolved merely on the basis of a community separation deed unless the customary practice permitting such dissolution is….", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-hindu-marriage-dissolved-through-community-separation-deed-559018", "priority": 83, "topics": ["CPC", "Hindu / Muslim law", "Rajasthan laws"], "note": {"Facts": "The appellant sought recognition of a marriage dissolution based solely on a community separation deed, which the Family Court had refused to acknowledge.", "Issue": "Whether a Hindu marriage can be deemed dissolved merely on the basis of a community separation deed absent proof of a customary practice allowing such dissolution.", "Held": "The Rajasthan High Court dismissed the appeal, holding that a Hindu marriage cannot be dissolved through a community separation deed unless the existence of a custom permitting such dissolution is duly established.", "Principle": "A Hindu marriage is not dissolved by a community separation deed unless the custom that authorises such dissolution is proven.", "Provisions": "not stated.", "Exam angle": "Hindu Marriage Act – test of custom as a ground for dissolution; could be asked to frame the issue of “custom” as an ingredient for nullity or dissolution of marriage."}, "syllabus": {"clusters": ["Civil procedure", "Personal, local and constitutional"], "acts": ["CPC", "Hindu / Muslim law", "Rajasthan laws"], "landmark": false, "boost": 13}, "date": "2026-11-19"}, {"id": "eaf503588074", "source": "sccblog", "category": "high-court", "title": "“Legislature cannot nullify a judgment by enacting law without removing the basis”: Andhra Pradesh High Court strikes down Section 147-A, Income-tax Act, 1961 as unconstitutional", "court": null, "case_name": null, "ratio": null, "summary": "Andhra Pradesh High Court: The petitions were filed challenging the constitutional validity of Section 147-A, Income-tax Act, 1961 (IT Act), inserted by the Finance Act, 2026 , with retrospective effect from 1 April 2021, as being ultra vires and violative of the basic structure of the Constitution , including the principles of Rule of Law.", "url": "https://www.scconline.com/blog/post/2026/11/18/ap-high-court-strikes-down-section-147a-income-tax-act/", "priority": 81, "topics": ["Constitution", "NDPS / SC-ST / PC / others", "Interpretation of statutes"], "note": {"Facts": "Petitioners challenged the constitutional validity of the newly inserted Section 147-A of the Income-Tax Act, 1961 (effective 1 April 2026 but retrospectively deemed from 1 April 2021), alleging it was ultra-vires and violated the basic structure, Rule of Law and separation of powers, and also contested reassessment proceedings initiated by Jurisdictional Assessing Officers (JAOs) under Sections 148-A and 148 as being non-faceless and therefore without jurisdiction.", "Issue": "Whether a legislature can nullify a judicial pronouncement by enacting a retrospective provision (Section 147-A) without removing the basis of the earlier judgment, and whether the JAOs have jurisdiction to issue notices and conduct reassessment under the faceless assessment scheme.", "Held": "The Andhra Pradesh High Court struck down Section 147-A as unconstitutional and set aside the impugned reassessment proceedings, holding that the provision sought to override judicial findings without eliminating the defect identified by the courts and could not be inserted after the IT Act had been repealed.", "Principle": "A validating or retrospective enactment cannot stand if it does not remove the defect identified by the judiciary; the legislature cannot defeat a judgment by merely inserting a new provision without addressing the underlying basis of the decision.", "Provisions": "Sections 147-A, 148-A, 148, 151-A, 144-B of the Income-Tax Act, 1961; Finance Acts 2021, 2022, 2026; Notification No. 18/2022, 15/2022, 61/2022; cases Snehdham Trust v. CIT (2025) SCC OnLine Guj 5771, Prithvi Cotton Mills Ltd. v. Broach Borough Municipality (1969) 2 SCC 283.", "Exam angle": "Income-Tax Act – validity of retrospective/validating legislation under the Constitution (basic structure, Rule of Law). Could be asked as: *“Explain the limitation on Parliament’s power to enact retrospective provisions that seek to override judicial decisions, citing the Andhra Pradesh High Court’s decision on Section 147-A.”"}, "syllabus": {"clusters": ["Personal, local and constitutional", "Special criminal Acts", "Interpretation"], "acts": ["Constitution", "NDPS / SC-ST / PC / others", "Interpretation of statutes"], "landmark": false, "boost": 10}, "date": "2026-11-19"}, {"id": "91e1f6c60903", "source": "sccblog", "category": "high-court", "title": "Offering money, catching hold of a woman’s hand and asking her to accompany him to the jungle outrages her modesty: Himachal Pradesh High Court", "court": null, "case_name": null, "ratio": null, "summary": "Himachal Pradesh HC : The present criminal revision petition, challenging a decision by the Additional Session Judge, dealt with a conviction of an accused under Section 354 , Penal Code, 1860 (IPC) arising from an incident where he allegedly caught hold of the informant’s arm, offered her money, and asked her to accompany him to.", "url": "https://www.scconline.com/blog/post/2026/11/18/upheld-conviction-for-outraging-womens-modesty-hp-hc/", "priority": 80, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The informant was returning from the jungle when the accused offered her ₹100, caught hold of her arm/hand and asked her to accompany him to the jungle; she raised an alarm, witnesses arrived, and the accused fled.", "Issue": "Whether the accused’s conduct of offering money, seizing the woman’s hand and urging her to follow him amounts to “outraging the modesty” of a woman punishable under Section 354 IPC.", "Held": "The High Court dismissed the revision, affirming the conviction and sentence under Section 354 IPC, holding that the accused’s acts indeed outraged the informant’s modesty.", "Principle": "Any act that shocks the sense of decency of a woman and assaults her modesty, such as offering money and forcibly taking hold of her hand to lead her elsewhere, falls within Section 354 IPC; a hostile witness’s testimony is not to be discarded if corroborated by other evidence.", "Provisions": "Section 354, Indian Penal Code; Section 313, Criminal Procedure Code; cited cases – *Kuntegowda v. Thurubaiah* (2026 SCC OnLine SC 1485), *State of Maharashtra v. Jagmohan Singh Kuldip Singh Anand* (2004 7 SCC 659), *State of Kerala v. Puttumana Illath Jathavedan Namboodiri* (1999 2 SCC 452), *Dadu v. State of M.P.* (2025 SCC OnLine SC 2733), *Selvamani v. State of T.N.* (2024 SCC OnLine SC 837), *Krishnan v. State of T.N.* (2003 7 SCC 56), *Rupan Deol Bajaj v. Kanwar Pal Singh Gill* (1995 6 SCC 194), *Tarkeshwar Sahu v. State of Bihar* (2006 8 SCC 560), *State of Punjab v. Major Singh* (1966 SCC OnLine SC 51).", "Exam angle": "IPC 354 – elements of outraging a woman’s modesty; evidentiary rule on hostile witnesses (corroboration required). Could be asked as: “Explain the test for ‘outraging modesty’ under Section 354 IPC and discuss the treatment of hostile witness testimony.”"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "4d5d0a08b04f", "source": "livelaw", "category": "supreme-court", "title": "Automatic Vesting Under Kerala Private Forests Act Applies Only If Land Falls Within Definition Of 'Private Forest': Supreme Court", "court": "Supreme Court", "case_name": "State of Kerala & Anr. v. P Krishna Pillai & Ors", "ratio": "The Forest Tribunal's finding, which was affirmed by the High Court…", "summary": "The Supreme Court has clarified that although the vesting of private forests in the Kerala Government under Section 3(1) of the Kerala Private Forests (Vesting and Assignment) Act, 1971.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1168-state-of-kerala-anr-v-p-krishna-pillai-ors-558897", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-19"}, {"id": "3b6672bb3438", "source": "livelaw", "category": "supr uch statements cannot be treated as substantive evidence of guilt, even when contradictions between a witness's police statement and courtroom testimony are duly proved after the witness turns hostile.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1159-naresh-versus-state-of-haryana-558775", "priority": 100, "topics": ["BSA / Evidence", "BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The Supreme Court has acquitted a man convicted in an alleged honour killing of two women believed to be involved in prostitution, based on a statement recorded during the police investigation, holding that such statements cannot be treated as substantive evidence of guilt, even when contradictions between a witness's police statement and courtroom testimony are duly proved after the witness turns hostile.", "Held": "Such statements cannot be treated as substantive evidence of guilt, even when contradictions between a witness's police statement and courtroom testimony are duly proved after…", "Principle": "Such statements cannot be treated as substantive evidence of guilt, even when contradictions between a witness's police statement and courtroom testimony are duly proved after…", "Provisions": "Provision: Section 155(3) of the Evidence Act; Clarified that statements recorded by the police under Section 161 of the Code of Criminal Procedure (CrPC) can be used only for the limited purpose of…"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BSA / Evidence", "BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-18"}, {"id": "062efb4bf4e6", "source": "livelaw", "category": "supreme-court", "title": "Forgery Not Official Duty, Public Servant Accused Of Forging Records Can't Claim S.197 CrPC Sanction : Supreme Court", "court": "Supreme Court", "case_name": "Ashok v. Mahesh & Anr", "ratio": "Public servants cannot claim protection under Section 197 of the Code of Criminal Procedure (Cr.", "summary": "The Supreme Court has held that public servants cannot claim protection under Section 197 of the Code of Criminal Procedure (Cr. P. C.) against prosecution for allegedly conspiring to forge documents.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1164-ashok-versus-mahesh-anr-558830", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The Supreme Court has held that public servants cannot claim protection under Section 197 of the Code of Criminal Procedure (Cr. P. C.) against prosecution for allegedly conspiring to forge documents.", "Held": "Public servants cannot claim protection under Section 197 of the Code of Criminal Procedure (Cr.", "Principle": "Public servants cannot claim protection under Section 197 of the Code of Criminal Procedure (Cr.", "Provisions": "Held that the complainant had approached an authority that was not competent to grant sanction and, therefore, the provision for deemed sanction after 90"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-18"}, {"id": "6093634170c8", "source": "sccblog", "category": "supreme-court", "title": "Bilkis Bano Case: Supreme Court Grants Bail to two Convicts After 17 Years in Jail, Suspends Sentence Pending Appeal", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: In an appeal arising from the conviction of persons involved in the brutal crimes committed against Bilkis Bano and her family during the 2002 Gujarat riots, a Division Bench of M.M. Sundresh and Prasanna B. Varale, JJ.", "url": "https://www.scconline.com/blog/post/2026/11/17/bilkis-bano-case-sc-grants-bail-convicts-after-17-years-in-jail/", "priority": 95, "topics": ["BNSS / CrPC"], "note": {"Facts": "Convicts of the 2002 Gujarat riots, including those who gang-raped Bilkis Bano, were sentenced to life imprisonment; after more than 14 years they sought premature release and remission, which was granted by Gujarat but later challenged.", "Issue": "Whether the conviction-related sentence can be suspended and bail granted pending appeal, and which remission policy governs the convicts’ premature-release applications.", "Held": "The Supreme Court suspended the life sentences, ordered release on bail with conditions, and directed that the appeal be listed for hearing; it also held that the 9 July 1992 Gujarat remission policy governs the convicts’ cases, setting aside the later remission orders.", "Principle": "A higher court may suspend a sentence and grant bail pending appeal when incarceration is prolonged and health concerns exist, and the applicable remission policy is the one in force at the time of the offence, not a later policy.", "Provisions": "Sections 433, 433-A, 432(7) CrPC (remission); no other statutes or cases cited.", "Exam angle": "Criminal Procedure Code – remission under §§ 432-433-A and the power of higher courts to suspend sentences and grant bail pending appeal; could be asked as “issue-framing” on the applicability of the remission policy and conditions for bail/suspension."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-18"}, {"id": "5d4069bf1817", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Applies Doctrine Of Indoor Management, Says Company's Boardroom Dispute Cannot Invalidate Sale To Bona Fide Third-Party", "court": "Supreme Court", "case_name": null, "ratio": "A third-party purchaser of a company's asset relying on a Company's Board Resolution meeting to undertake the purchase is protected under the Transfer of Property…", "summary": "The Supreme Court has observed that a third-party purchaser of a company's asset relying on a Company's Board Resolution meeting to undertake the purchase is protected under the Transfer of Property Act, and the sale cannot be invalidated merely because there's an internal dispute regarding the authority to execute the sale deed. According to the Court, the unrelated third party cannot be expected to verify the internal affairs of the company, particularly whether the Board meeting authorising the transaction was validly convened.", "url": "https://www.livelaw.in/supreme-court/supreme-court-applies-doctrine-of-indoor-management-says-companys-boardroom-dispute-cannot-invalidate-sale-to-bona-fide-third-party-558777", "priority": 94, "topics": ["Transfer of Property"], "note": {"Facts": "The mother-son directors of J & A Avenues India Pvt. Ltd. disputed a board resolution dated 01-08-2015 that allegedly authorised the son to sell 9 acres 28 guntas of company land to Elaine Info Solutions Pvt. Ltd. The mother claimed she neither received notice nor participated in the meeting. The sale deed dated 04-09-2015 referred to that resolution; consideration was received and reflected in the audited accounts signed by both directors.", "Issue": "Whether a bona-fide third-party purchaser can rely on a company’s board resolution and be protected from internal irregularities of the board meeting that it could not discover.", "Held": "The Supreme Court set aside the NCLT and NCLAT decisions and held that the sale deed cannot be invalidated; the purchaser, being an unrelated third party, is protected by the doctrine of indoor management.", "Principle": "A third-party purchaser who acts in good faith may rely on a company’s apparent authority as evidenced by a board resolution; internal defects in the board’s convening or participation are not the purchaser’s burden to prove (doctrine of indoor management).", "Provisions": "Section 241 of the Companies Act, 2013 (as invoked before the NCLT); Transfer of Property Act (as the statutory basis for protection of the purchaser); the case itself (Supreme Court judgment of Justices Sanjay Kumar & Sanjeev Sachdeva).", "Exam angle": "Companies Act 2013 – Section 241 (minority oppression) and the doctrine of indoor management; could be asked to frame the issue of “what protects a bona-fide third-party purchaser against internal irregularities of a company’s board” or to list the ingredients of the indoor-management rule."}, "syllabus": {"clusters": ["Property"], "acts": ["Transfer of Property"], "landmark": false, "boost": 8}, "date": "2026-11-18"}, {"id": "5f05b4a3c37a", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Upholds Stay On Azam Khan's Conviction In Forged Birth Certificate Case, Gives Same Relief To Wife & Son", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The bench dismissed the State's appeal, while allowing the appeals filed by Tazeem Fatma and Abdullah Azam Khan.", "url": "https://www.livelaw.in/top-stories/supreme-court-upholds-stay-on-azam-khans-conviction-in-forged-birth-certificate-case-gives-same-relief-to-wife-son-558682", "priority": 93, "topics": ["BNSS / CrPC"], "note": {"Facts": "Azam Khan, his wife Tazeen Fatma and son Abdullah were convicted for cheating, forgery and criminal conspiracy in a forged birth-certificate case; the Allahabad High Court suspended only Azam Khan’s conviction and bail, refusing similar relief to his wife and son.", "Issue": "Whether the Supreme Court should uphold the High Court’s suspension of Azam Khan’s conviction and extend the same relief to his wife and son.", "Held": "The Supreme Court dismissed the State’s appeal, upheld the suspension of Azam Khan’s conviction and granted the same relief to his wife and son.", "Principle": "A conviction may be suspended if the appellant’s role is not materially linked to the fraudulent act; the benefit of suspension can be extended to co-accused when their involvement is similarly non-material.", "Provisions": "not stated.", "Exam angle": "Criminal Procedure Code/Criminal Law – issue of suspension of conviction and bail; could be asked on the criteria for granting suspension of conviction to co-accused under criminal law."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-18"}, {"id": "bb8e346a5c0b", "source": "livelaw", "category": "supreme-court", "title": "Bilkis Bano Expresses Shock Over Supreme Court Order Suspending Sentences Of Men Convicted For Gang-Rape & Murder, Says She Wasn't Heard", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "Bilkis Bano has expressed shock and disbelief over the Supreme Court's October 28 order suspending the life sentences of two men convicted of gang-raping her and murdering members of her family during the 2002 Gujarat riots, stating that the order was passed without informing her or hearing her.", "url": "https://www.livelaw.in/top-stories/bilkis-bano-expresses-shock-over-supreme-court-order-suspending-sentences-of-men-convicted-for-gang-rape-murder-says-she-wasnt-heard-558704", "priority": 93, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Bilkis Bano, a survivor of the 2002 Gujarat riots, learned from the press that the Supreme Court on 28 Oct suspended the life sentences of two convicts for her gang-rape and the murder of her family, without being called or heard.", "Issue": "Whether the Supreme Court could suspend the convicts’ sentences without informing or hearing the victim-survivor.", "Held": "The Supreme Court bench (Justices M M Sundresh & P B Varale) suspended the sentences, citing the convicts’ long incarceration, a severe handicap, and pending issues in their appeals.", "Principle": "A higher court may stay or suspend a conviction-based sentence on grounds such as prolonged imprisonment, health handicap, and pending appellate questions, even if the victim is not heard.", "Provisions": "not stated.", "Exam angle": "Criminal Procedure Code/Criminal Law – relief against conviction (suspension of sentence) and the procedural right of a victim to be heard; could be asked as “whether victim-survivor’s hearing is mandatory before a court suspends a sentence” or “ingredients for granting remission or suspension of sentence”."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-18"}, {"id": "b26dea219a0e", "source": "sccblog", "category": "supreme-court", "title": "Different States, one larger terrorist conspiracy: Supreme Court orders clubbing of J&K and Haryana criminal cases with 2025 Red Fort blast case", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: In a significant ruling on the transfer and consolidation of criminal proceedings involving an alleged larger terrorist conspiracy in connection to the 2025 Red Fort blast, arising from incidents in different States and on different dates to a common Special Court , the Division Bench of Prashant Kumar Mishra * and Shree Chandrashekhar,.", "url": "https://www.scconline.com/blog/post/2026/11/17/sc-on-clubbing-of-cases-in-2025-red-fort-blast-conspiracy/", "priority": 92, "topics": ["BNS / IPC"], "note": {"Facts": "The Supreme Court considered three criminal proceedings – one concerning the 2025 Red Fort blast and two others from different States – alleged to be part of a larger terrorist conspiracy involving common accused, overlapping witnesses and evidence.", "Issue": "Whether the separate cases should be transferred and clubbed before a single Special Court under the NIA Act to avoid multiplicity, conflicting findings and security risks.", "Held": "The Court ordered that all three cases be transferred to and clubbed before the Special Court under the National Investigation Agency Act, 2008 at Patiala House Court, New Delhi.", "Principle": "When distinct terrorist incidents in different States are linked by a common conspiracy, common accused, and overlapping evidence, they may be clubbed and tried together in a single Special Court to prevent multiplicity of proceedings and ensure uniformity of judgment.", "Provisions": "National Investigation Agency Act, 2008; reference to State (NCT of Delhi) v. Khimji Bhai Jadeja, 2026 SCC OnLine SC 19 (distinguished).", "Exam angle": "NIA Act – question may ask to frame the issue of “clubbing of terrorist cases under the NIA Act” and to list the ingredients (common accused, overlapping evidence, risk of multiplicity) required for such consolidation."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC"], "landmark": false, "boost": 12}, "date": "2026-11-18"}, {"id": "5b97f4f499bc", "source": "livelaw", "category": "supreme-court", "title": "ECI Failed To Produce Records Showing Unanimous Approval Of SIR Decisions: Petitioner To Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The petitioner also contended that the subsequent corrective measures taken by the ECI after the writ petition do not validate earlier decisions.", "url": "https://www.livelaw.in/top-stories/eci-failed-to-produce-records-showing-unanimous-approval-of-sir-decisions-petitioner-to-supreme-court-558714", "priority": 89, "topics": ["Constitution"], "note": {"Facts": "The petitioner alleges that the Election Commission of India (ECI) cannot demonstrate, through contemporaneous records, that decisions on the Special Intensive Revision (SIR) of electoral rolls were taken unanimously by its three members, and that several SIR-related actions were taken unilaterally by the Chief Election Commissioner.", "Issue": "Whether the absence of contemporaneous records proving unanimity and compliance with Section 18 of the Chief Election Commissioner and Other Election Commissioners (Appointment, Conditions of Service and Term of Office) Act, 2023 renders the SIR decisions ultra vires.", "Held": "The Supreme Court has not yet ruled on the merits; the matter is listed for hearing. The petitioner seeks production of agendas, minutes, file-notings, resolutions, electronic approvals and communications to establish whether the decisions complied with the statutory requirement of collective approval.", "Principle": "A statutory requirement of collective decision-making (Section 18, 2023 Act) must be satisfied by contemporaneous documentary evidence; mere assertions of unanimity or subsequent corrective measures do not cure a prior lack of statutory authority.", "Exam angle": "Test takers may be asked to frame an issue on “whether the ECI’s SIR decisions complied with Section 18 of the 2023 Act” or to enumerate the “ingredients of a valid collective decision under Section 18” and the evidentiary burden on a public authority to produce contemporaneous records."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-18"}, {"id": "efd55ba6646d", "source": "livelaw", "category": "supreme-court", "title": "Reel Makers Not Entitled To Journalistic Protection During Protests, Delhi Police To Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "It has to be determined if reel-makers and content-creators can be elevated to the status of journalists.", "url": "https://www.livelaw.in/top-stories/reel-makers-not-entitled-to-journalistic-protection-during-protests-delhi-police-to-supreme-court-558831", "priority": 88, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-18"}, {"id": "2b4f49345fb7", "source": "livelaw", "category": "legislation", "title": "Subsequent Amendment To Recruitment Rules Cannot Invalidate Promotion Validly Made Under Earlier Rules: HP High Court", "court": "Himachal Pradesh High Court", "case_name": null, "ratio": "A subsequent amendment to Recruitment and Promotion Rules prescribing additional educational qualifications cannot invalidate a promotion that was validly granted under the rules prevailing at…", "summary": "The High Court observed that Devi Singh had been promoted as Senior Sheristedar on November 3, 2017, in accordance with the eligibility criteria prescribed under the rules then in force. It held that the subsequent amendment dated October 16, 2024, introducing the minimum educational qualification of 10+2, could not retrospectively invalidate his existing promotion or require his demotion.", "url": "https://www.livelaw.in/high-court/himachal-pradesh-high-court/hp-high-court-subsequent-amendment-recruitment-rules-invalidate-promotion-validly-558706", "priority": 87, "topics": ["Interpretation of statutes"], "note": {"Facts": "Devi Singh was promoted to Senior Sheristedar on 3 Nov 2017 under rules requiring only matriculation, and later to Chief Administrative Officer on 8 May 2025; a 2024 amendment introduced a 10+2 qualification.", "Issue": "Whether a later amendment to recruitment rules adding educational qualifications can invalidate a promotion made under the earlier rules.", "Held": "The amendment cannot retrospectively invalidate the promotion; the petition was dismissed.", "Principle": "A promotion validly made under the rules in force at the time of promotion remains valid despite subsequent amendments that impose higher qualifications, which apply only prospectively.", "Provisions": "Himachal Pradesh District Judiciary Staff Rules, 2022 (amended 16 Oct 2024); not stated.", "Exam angle": "Test on the applicability of amended recruitment rules (e.g., HP District Judiciary Staff Rules) – focus on prospective vs. retrospective effect of rule changes in promotion cases."}, "syllabus": {"clusters": ["Interpretation"], "acts": ["Interpretation of statutes"], "landmark": false, "boost": 4}, "date": "2026-11-18"}, {"id": "07fa5af47053", "source": "barandbench", "category": "high-court", "title": "Calcutta High Court upholds death penalty of man for rape and murder of 5-year-old girl", "court": null, "case_name": null, "ratio": null, "summary": "The Calcutta High Court on Tuesday upheld the death penalty of a man found guilty of raping and subsequently murdering his neighbour's five- year-old daughter after luring her with chocolates [ State of West Bengal v. Ashok Singh] . A Bench of Justices Arijit Banerjee and Apurba Sinha Ray noted that the convict Ashok Singh.", "url": "https://www.barandbench.com/news/litigation/calcutta-high-court-upholds-death-penalty-of-man-for-rape-and-murder-of-5-year-old-girl", "priority": 82, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Ashok Singh lured his neighbour’s 5-year-old daughter with chocolates, raped her through vagina and anus, and killed her by striking her head; forensic DNA linked him to the victim and he was convicted of child rape, aggravated sexual assault and murder.", "Issue": "Whether the conviction and death-penalty sentence imposed by the trial court fall within the “rarest of rare” category under Indian law.", "Held": "The Calcutta High Court upheld the death-penalty, confirming the trial court’s finding that the case is “rarest of rare” and directing a three-month stay pending any Supreme Court appeal.", "Principle": "A death sentence is justified when the crime involves extreme depravity, brutality and the offender is beyond reformation, satisfying the “rarest of rare” test.", "Provisions": "not stated.", "Exam angle": "Could be asked under the Indian Penal Code (sections on rape of a child, murder) and the jurisprudence on the “rarest of rare” doctrine for death-penalty awards."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-18"}, {"id": "20ac5dc329b7", "source": "livelaw", "category": "supreme-court", "title": "Past Misconduct May Be Relevant To Decide Penalty For Subsequent Misconduct, But Cannot Fill Gaps In Fresh Charges: Supreme Court", "court": "Supreme Court", "case_name": "SUMIT KUMAR v. UNION OF INDIA & ORS", "ratio": "Previous misconduct for which an employee has already been punished cannot, by itself, be treated as a fresh instance of misconduct to impose another penalty", "summary": "The Supreme Court has held that previous misconduct for which an employee has already been punished cannot, by itself, be treated as a fresh instance of misconduct to impose another penalty.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1161-sumit-kumar-versus-union-of-india-ors-558794", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-18"}, {"id": "4005840d8094", "source": "livelaw", "category": "supreme-court", "title": "IBC Cannot Be Invoked To Recover Full Dues Contrary To Binding SICA Rehabilitation Scheme : Supreme Court", "court": "Supreme Court", "case_name": "M/s. Ganesh Benzoplast Ltd. v. State Trading Corporation of India", "ratio": "Post-approval of the rehabilitation scheme of a sick company under the Sick Industrial Companies (Special Provisions) Act, 1985…", "summary": "The Supreme Court held that post-approval of the rehabilitation scheme of a sick company under the Sick Industrial Companies (Special Provisions) Act, 1985.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1163-ms-ganesh-benzoplast-ltd-v-the-state-trading-corporation-of-india-558806", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-18"}, {"id": "20134c99ca8c", "source": "livelaw", "category": "supreme-court", "title": "“Grossly Disproportionate”: Supreme Court Reinstates CRPF Constable Removed For 99-Day Overstay Of Leave", "court": "Supreme Court", "case_name": "Mithilesh Kumar Pathak v. Union of India & Ors", "ratio": null, "summary": "The Supreme Court on Monday (November 16) set aside the removal from service of a Central Reserve Police Force (CRPF) Constable who had overstayed his leave by 99 days, holding that the penalty of removal was “grossly disproportionate” and that the rejection of his medical documents rested on conjectures and surmises.", "url": "https://www.livelaw.in/sc ", "case_name": null, "ratio": null, "summary": "The bench comprising Justice Aravind Kumar and Justice Vipul M Pancholi was hearing a criminal contempt petition filed by the Supreme Court Bar Association (SCBA) against journalist Nikhil Wagle and Raut over their alleged objectionable remarks against Chief Justice of India Surya Kant and the judiciary.", "url": "https://www.livelaw.in/top-stories/as-a-seasoned-politician-you-should-know-restraint-supreme-court-to-sanjay-raut-on-comments-against-judiciary-558741", "priority": 71, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-18"}, {"id": "70f1468a5cd0", "source": "livelaw", "category": "supreme-court", "title": "DR. G. SRINIVASAN VS. UNION OF INDIA & ORS", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1158-dr-g-srinivasan-vs-union-of-india-ors-558694", "priority": 70, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-18"}, {"id": "22fe55eeaae6", "source": "livelaw", "category": "supreme-court", "title": "ELAINE INFO SOLUTIONS PVT. LTD. v M/S. J & A AVENUES INDIA PRIVATE LIMITED AND ORS", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1160-elaine-info-solutions-pvt-ltd-v-ms-j-a-avenues-india-private-limited-and-ors-558778", "priority": 70, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-18"}, {"id": "e01d048f13a5", "source": "livelaw", "category": "supreme-court", "title": "T. AKON PHOM AND OTHERS VERSUS STATE OF NAGALAND AND OTHERS", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1162-t-akon-phom-and-others-versus-stat curb terrorism.", "url": "https://www.thehindu.com/opinion/editorial/the-hindu-editoral-on-kashmir-terror-attack/article71713251.ece/", "priority": 78, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-18"}, {"id": "a3076bb59718", "source": "thehindu", "category": "editorial", "title": "All-too fallible: On India’s vote against moratorium on death penalty", "court": null, "case_name": null, "ratio": null, "summary": "India defends the death penalty amid calls for moratorium, highlighting safeguards, but evidence questions deterrence and urges abolition with reforms.", "url": "https://www.thehindu.com/opinion/editorial/the-hindu-editorial-on-indias-vote-against-moratorium-on-death-penalty/article71713256.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-18"}, {"id": "8cf196a767cd", "source": "livelaw", "category": "supreme-court", "title": "National Press Day : Landmark Supreme Court Judgments Upholding Media Freedom", "court": "Supreme Court", "case_name": "Sakal Papers v. Union of India", "ratio": null, "summary": "In the 2021 Pegasus case ( Manohar Lal Sharma v Union of India ) , the Supreme Court observed that surveillance will have a chilling effect on the freedom of press. The Court noted that the protection of journalistic sources is one of the basic conditions for the freedom of press.", "url": "https://www.livelaw.in/top-stories/national-press-day-landmark-supreme-court-judgments-upholding-media-freedom-558548", "priority": 100, "topics": ["Contract / Specific Relief", "Constitution"], "note": {"Facts": "Bloomberg Television Production Services India Pvt. Ltd. sought an interim injunction against Zee Entertainment to restrain publication of a news article in a defamation suit.", "Issue": "Whether a trial court may grant a pre-trial (ex-parte) injunction restraining media publication without first establishing that the material is “malicious” or “palpably false.”", "Held": "The Supreme Court cautioned that ex-parte injunctions should be granted only in exceptional cases where the defence would unquestionably fail at trial; otherwise, injunctions must follow a full trial or give the respondent a chance to be heard.", "Principle": "Pre-trial injunctions against media publications are permissible only when the plaintiff shows the content is malicious or palpably false; otherwise, courts must balance free speech with reputation and avoid stifling public debate.", "Provisions": "Not stated (the judgment relied on constitutional freedom of speech and the need to balance it with reputation and privacy).", "Exam angle": "Article 19(1)(a) of the Constitution – test the limits of free speech versus defamation; ask how the “malicious or palpably false” standard functions as a threshold for granting injunctions in media-related defamation cases."}, "syllabus": {"clusters": ["Obligations", "Personal, local and constitutional"], "acts": ["Contract / Specific Relief", "Constitution"], "landmark": true, "boost": 17}, "date": "2026-11-17"}, {"id": "056a4a849d20", "source": "livelaw", "category": "supreme-court", "title": "Gratuity Can't Be Withheld Because Of Pending Appeal Against Acquittal: Supreme Court", "court": "Supreme Court", "case_name": "Delhi Development Authority v. Rajender Kumar Sharma", "ratio": "Gratuity of retired employees who were acquitted in a corruption case cannot be withheld merely because the State government's challenge to the acquittal is pending.", "summary": "The Supreme Court on Monday (November 16) held that gratuity of retired employees who were acquitted in a corruption case cannot be withheld merely because the State government's challenge to the acquittal is pending.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1154-delhi-development-authority-v-rajender-kumar-sharma-558645", "priority": 100, "topics": ["BNSS / CrPC"], "note": {"Facts": "The Supreme Court on Monday (November 16) held that gratuity of retired employees who were acquitted in a corruption case cannot be withheld merely because the State government's challenge to the acquittal is pending.", "Held": "Gratuity of retired employees who were acquitted in a corruption case cannot be withheld merely because the State government's challenge to the acquittal is pending.", "Principle": "Gratuity of retired employees who were acquitted in a corruption case cannot be withheld merely because the State government's challenge to the acquittal is pending."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-17"}, {"id": "84ec1f043b83", "source": "livelaw", "category": "supreme-court", "title": "2002 Gujarat Riots | Supreme Court Suspends Life Sentence Of Two Bilkis Bano Rape Case Convicts", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court recently suspended the life sentences of two convicts in the Bilkis Bano gangrape and murder case and granted them bail, noting that they have spent more than 17 years in incarceration and one of them is severely handicapped.", "url": "https://www.livelaw.in/top-stories/2002-gujarat-riots-supreme-court-suspends-life-sentence-of-two-bilkis-bano-rape-case-convicts-558580", "priority": 99, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Two convicts in the Bilkis Bano gang-rape and murder case, Bipinchand Joshi and Pradip Modhiya, had been in custody for over 17 years, one being severely handicapped, and challenged the life sentences upheld by the Bombay High Court.", "Issue": "Whether the Supreme Court should suspend the life sentences and grant bail pending appeal, considering the length of incarceration and the appellant’s handicap.", "Held": "The Supreme Court suspended the life sentences and granted bail on terms to be fixed by the trial court, noting the long imprisonment and severe handicap, while the appeals against conviction will be heard later.", "Principle": "A life sentence may be suspended and bail granted when the convict has spent an extended period (here, >17 years) in custody and there are substantial factual or legal issues, especially if the convict is severely disabled.", "Provisions": "IPC §§ 143, 147, 302 read with 149; §§ 376(2)(e) & ( g); § 376(2)(g) for rigorous imprisonment; Sections 201 & 218 IPC (mentioned for police/doctor acquittals); High Court judgment (May 04 2017); Supreme Court order (Oct 28 2024).", "Exam angle": "Criminal Procedure Code – suspension of sentence & bail pending appeal; IPC – offences of murder, rioting, gang-rape; could be asked on the criteria for granting bail to life-sentence convicts or on the effect of prolonged incarceration on sentencing."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-17"}, {"id": "71df6833aba8", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Awards Rs. 30 Lakhs To Man Kept In Jail For 7 Years Despite Acquittal, Recommends Law To Compensate Illegal Custody", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court noted that the Chhattisgarh authorities displayed \"complete remissness\" in the matter.", "url": "https://www.livelaw.in/supreme-court/supreme-court-awards-rs-30-lakhs-to-man-kept-in-jail-for-7-years-despite-acquittal-recommends-law-to-compensate-illegal-custody-558641", "priority": 96, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Devilal Gond was acquitted by the Chhattisgarh High Court on 20 Jan 2018, but remained in prison until 19 May 2025 due to a communication gap between jail authorities and legal-aid officials.", "Issue": "Whether the Supreme Court should award compensation for the unlawful detention suffered after an acquittal and what legislative measure is required to prevent such occurrences.", "Held": "The Court awarded ₹30 lakhs compensation to Gond and directed all High Courts to consider directions similar to those of the Madhya Pradesh High Court, including the establishment of an Online Criminal Justice Ecosystem for timely communication of judicial orders.", "Principle": "The State is liable to compensate a person who is illegally detained after an acquittal, and a statutory framework is necessary to prescribe parameters for such compensation and to ensure prompt transmission of court orders to prison authorities.", "Provisions": "not stated (the judgment notes the absence of any legislative provision on compensation for wrongful incarceration)."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-17"}, {"id": "d4a2482e70a0", "source": "sccblog", "category": "supreme-court", "title": "Bhakra-Beas power dispute: Supreme Court directs Punjab and Haryana to pay Himachal Pradesh’s 13,066 MU energy arrears over 20 years", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: While adjudicating the long-standing dispute between the State of Himachal Pradesh and the States of Punjab and Haryana concerning the allocation of power generated from the Bhakra-Nangal and Beas Hydro-Electric Projects, a three-Judge Bench of Surya Kant, CJ * with Joymalya Bagchi and V. Mohana, JJ. , directed Punjab and Haryana to supply.", "url": "https://www.scconline.com/blog/post/2026/11/16/supreme-court-bhakra-beas-power-dispute-himachal-pradesh-punjab-haryana/", "priority": 88, "topics": ["Constitution"], "note": {"Facts": "Himachal Pradesh sued Punjab, Haryana, Union of India, Rajasthan and Chandigarh before the Supreme Court under Article 131 for its share of power from the Bhakra-Nangal and Beas hydro-electric projects, claiming 7.19 % entitlement. After the 2011 decree fixing the share, the parties disputed the valuation of arrears, capital-cost liability and mode of payment.", "Issue": "Whether the present proceedings can revisit matters already decided in the 27 September 2011 decree, and how the energy-arrears and capital-cost liability are to be settled.", "Held": "The Court held that the present suit is an execution proceeding; it cannot be used to reopen issues conclusively decided in the 2011 judgment. It directed Punjab and Haryana to supply the remaining 13,066 million units (after adjusting Himachal’s capital-cost liability of ₹420.77 crore) on a cash-less basis over 20 years and dismissed all pending applications.", "Principle": "Execution proceedings may not be employed to relitigate substantive rights already settled by a prior judgment; the entitlement of a successor state flows from the statutory apportionment provision (Section 78 (1), Punjab Reorganisation Act, 1966).", "Provisions": "Section 78 (1), Punjab Reorganisation Act 1966; Article 131 of the Constitution; Supreme Court judgment dated 27 September 2011 (declaring 7.19 % entitlement).", "Exam angle": "Questions may test the application of the Punjab Reorganisation Act, 1966 (especially Section 78) and Article 131 in inter-state disputes, focusing on the distinction between execution and merits proceedings and the rule that a decree’s substantive findings are conclusive."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-17"}, {"id": "4f1323974172", "source": "livelaw", "category": "high-court", "title": "Past Criminal Cases Alone Can't Justify Police Surveillance: Telangana High Court Issues Guidelines For Opening, Review Of Rowdy Sheets", "court": "Telangana High Court", "case_name": "G. Harinath Goud v. State of Telangana & Others", "ratio": null, "summary": "The Telangana High Court issued comprehensive guidelines governing opening, closure of rowdy sheets and police surveillance emphasizing that the object of surveillance is preventive and not punitive and its continued maintenance, in absence of sufficient reasons interferes with personal liberty of a person exposing him to social stigma. The court passed the order while quashing a rowdy.", "url": "https://www.livelaw.in/high-court/telangana-high-court/telangana-high-court-quashes-rowdy-sheet-issues-landmark-guidelines-police-surveillance-558614", "priority": 87, "topics": ["BNSS / CrPC", "Hindu / Muslim law", "Constitution"], "note": {"Facts": "The Telangana High Court issued guidelines on the opening, closure of rowdy sheets and police surveillance, emphasizing that surveillance is preventive, not punitive, and that its continuation without sufficient reason infringes personal liberty and causes social stigma.", "Issue": "Whether police surveillance based solely on past criminal cases, without adequate justification, can be continued without violating personal liberty.", "Held": "The Court quashed the rowdy sheet, holding that continued surveillance without sufficient reasons interferes with personal liberty and is impermissible.", "Principle": "Surveillance must be preventive, not punitive; it may not be maintained absent sufficient justification, lest it violate personal liberty and cause stigma.", "Provisions": "not stated.", "Exam angle": "Criminal Procedure (surveillance and preventive measures) – could be asked on the permissible scope and procedural safeguards for police surveillance, focusing on the need for justification and protection of liberty."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Hindu / Muslim law", "Constitution"], "landmark": true, "boost": 21}, "date": "2026-11-17"}, {"id": "54b61ac1cac0", "source": "sccblog", "category": "high-court", "title": "Delhi HC quashes ED LOCs against non- accused in RCFL—RHFL case; Holds mere pendency of investigation insufficient to restrict travel", "court": null, "case_name": null, "ratio": null, "summary": "Delhi High Court: While quashing Look Out Circulars (LOCs) opened by Enforcement Directorate (ED) against the non- accused petitioners, a Single Judge Bench of Madhu Jain, J., held that the pendency of an investigation does not, by itself, justify restricting a person’s right to travel abroad, which forms part of personal liberty under Article 21.", "url": "https://www.scconline.com/blog/post/2026/11/16/delhi-hc-look-out-circular-quashed-non-accused/", "priority": 84, "topics": ["BNSS / CrPC", "Constitution"], "note": {"Facts": "The Enforcement Directorate issued Look Out Circulars (LOCs) restricting the foreign travel of petitioners who were not accused in the RCFL—RHFL case, despite their cooperation and appearance before authorities.", "Issue": "Whether the mere pendency of an investigation justifies imposing an LOC that restricts a person’s right to travel abroad.", "Held": "The Delhi High Court quashed the LOCs, holding that investigation pendency alone cannot curtail the right to travel, which is part of personal liberty under Article 21.", "Principle": "An LOC is a coercive measure and cannot be maintained solely because an investigation is ongoing; it must be based on a person-specific satisfaction that the departure would harm India’s economic or larger public interest, and alternative safeguards (undertakings, document production, travel intimation, accessibility conditions) are sufficient.", "Provisions": "not stated.", "Exam angle": "Article 21 of the Constitution; Enforcement Directorate’s powers under the Prevention of Money-Laundering Act – could be asked to frame the issue of “when can a LOC be justified despite Article 21” or to list the ingredients required for invoking the economic-interest exception."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Constitution"], "landmark": false, "boost": 13}, "date": "2026-11-17"}, {"id": "42f4845a6084", "source": "livelaw", "category": "supreme-court", "title": "Lulu International Shopping Malls Private Limited v Gorinka Pratyusha and others Etc", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1154-lulu-international-shopping-malls-private-limited-v-gorinka-pratyusha-and-others-etc-558647", "priority": 82, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-17"}, {"id": "9670024422a1", "source": "sccblog", "category": "high-court", "title": "Seriousness of UAPA charges cannot justify a blanket bar on travel abroad: Delhi HC", "court": null, "case_name": null, "ratio": null, "summary": "Delhi High Court: In two petitions challenging the orders dated 06.10.2026 passed by the Additional Sessions Judge (Special Judge), Shahdara District, Karkardooma Courts in Sessions Case 163/2020 and Sessions Case 354/2022, whereby the petitioner’s applications to travel to the United Kingdom (UK) from 02.11.2026 to 01.12.2026 were rejected, a Single Judge Bench of Amit Bansal,.", "url": "https://www.scconline.com/blog/post/2026/11/16/delhi-hc-natasha-narwal-permission-travel-uk-uapa-accused-right-to-travel-abroad-article-21-academic-purposes/", "priority": 81, "topics": ["BNSS / CrPC", "Constitution"], "note": {"Facts": "The petitioner, an accused on bail in two cases involving UAPA offences, sought permission to travel to the UK from 02-11-2026 to 01-12-2026 for in-person PhD supervisory meetings and to present a paper at a conference; her passport was lodged with the trial court and the travel application was rejected on the ground of serious UAPA charges.", "Issue": "Whether an accused charged with serious offences under the Unlawful Activities Prevention Act, 1967 can be barred from travelling abroad in a blanket manner despite being on bail.", "Held": "The Delhi High Court allowed the petitions and permitted the petitioner to travel, subject to specific safeguards, holding that the seriousness of UAPA charges does not automatically curtail the right to travel abroad.", "Principle": "The right to travel abroad, a facet of Article 21, cannot be denied on a blanket basis merely because the accused faces serious UAPA charges; the restriction must be proportionate and consider the individual’s bail record, purpose of travel, and safeguards.", "Provisions": "Article 21 Constitution of India; Unlawful Activities Prevention Act, 1967 (Sections 13, 16, 17, 18); Penal Code, 1860; Arms Act, 1959; Prevention of Damage to Public Property Act, 1984; Maneka Gandhi v. Union of India, (1978) 1 SCC 248.", "Exam angle": "Test on Article 21 (right to travel) vis-à-vis UAPA offences – could be asked to frame the issue of whether the seriousness of charges under UAPA justifies a blanket travel ban, and to enumerate the ingredients of a proportional restriction (bail status, purpose of travel, safeguards)."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Constitution"], "landmark": false, "boost": 13}, "date": "2026-11-17"}, {"id": "e5b97c84e3d5", "source": "livelaw", "category": "high-court", "title": "Mere Mention Of Name Without Evidence Of Role In Criminal Conspiracy Not Enough For Trial: MP High Court Quashes FIR Against Law Student", "court": "Madhya Pradesh High Court", "case_name": "KSY v. State of MP", "ratio": "Mere reference to a person's name, without disclosure of any particular conduct or material indicating his participation in an allegedly criminal conspiracy…", "summary": "Madhya Pradesh High Court judgment in KSY v. State of MP. The ruling: Mere reference to a person's name, without disclosure of any particular conduct or material indicating his participation in an allegedly criminal conspiracy….", "url": "https://www.livelaw.in/high-court/madhya-pradesh-high-court/madhya-pradesh-high-court-name-mentioned-in-criminal-conspiracy-fir-without-specific-act-or-material-not-enough-for-trial-558617", "priority": 80, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "A law student’s name was mentioned in an FIR alleging participation in a criminal conspiracy, but the FIR contained no specific conduct or material linking him to the alleged conspiracy.", "Issue": "Whether a mere mention of a person’s name, without any disclosed act or evidence of participation, is sufficient to sustain an FIR and subject the person to criminal trial.", "Held": "The Madhya Pradesh High Court quashed the FIR, holding that such a bare reference to a name does not justify proceeding to trial.", "Principle": "A name alone, absent any allegation of conduct or material evidence of involvement, cannot be the basis for a criminal trial.", "Provisions": "not stated.", "Exam angle": "Criminal Procedure Code – validity of FIR; could be asked to frame the issue of “requirements for a cognizable FIR” or to list the essential ingredients that must be disclosed to sustain an FIR."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-17"}, {"id": "8fbf2b3e75a3", "source": "livelaw", "category": "high-court", "title": "Third Party Claiming Ownership Or Possession Doesn't Automatically Become Necessary Party In Eviction Suit: Allahabad High Court", "court": "Allahabad High Court", "case_name": "Smt Chandri Devi and another v. Smt", "ratio": "A third party asserting an independent claim of ownership, tenancy or possession over premises forming the subject matter of a pending Small Causes Court suit…", "summary": "The Allahabad High Court has held that a third party asserting an independent claim of ownership, tenancy or possession over premises forming the subject matter of a pending Small Causes Court suit cannot seek impleadment merely because a decree in the suit may affect the rights so asserted. The position is no different, it held, where the claim rests on a tenancy said to have been created.", "url": "https://www.livelaw.in/high-court/allahabad-high-court/allahabad-high-court-third-party-asserting-independent-ownership-separate-tenancy-necessary-party-eviction-suit-558618", "priority": 80, "topics": ["CPC"], "note": {"Facts": "A third party asserted an independent claim of ownership, tenancy or possession over premises that were the subject of a pending Small Causes Court suit.", "Issue": "Whether such a third party can be impleaded in the eviction suit merely because the decree may affect his asserted rights.", "Held": "The court held that the third party cannot be impleaded on that basis.", "Principle": "A third party claiming ownership, tenancy or possession does not automatically become a necessary party in an eviction suit simply because the decree may affect the rights he asserts.", "Provisions": "not stated", "Exam angle": "Could be asked under the procedural law governing impleadment in eviction proceedings (e.g., CPC provisions on parties), focusing on the requirement of necessity versus mere interest."}, "syllabus": {"clusters": ["Civil procedure"], "acts": ["CPC"], "landmark": false, "boost": 12}, "date": "2026-11-17"}, {"id": "78271385de02", "source": "sccblog", "category": "high-court", "title": "Orissa High Court quashes confiscation of vehicle despite liquor seizure; holds owner’s knowledge must be independently established", "court": null, "case_name": null, "ratio": null, "summary": "Orissa High Court: In a case concerning the legality of confiscating a vehicle under Section 71 , Odisha Excise Act, 2008 , following the recovery of 68 PET bottles of alleged non-duty-paid Indian Made Foreign Liquor (IMFL), the Single Judge Bench of Sashikanta Mishra, J. , held that the principal issue on confiscation could not.", "url": "https://www.scconline.com/blog/post/2026/11/16/orissa-hc-quashes-vehicle-confiscation-illicit-liquor-case/", "priority": 76, "topics": ["NDPS / SC-ST / PC / others"], "note": null, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NDPS / SC-ST / PC / others"], "landmark": false, "boost": 8}, "date": "20 l Chambal Gharial Sanctuary (Illegal Sand Mining in the National Chambal Sanctuary & Threat to Endangered Aquatic Wildlife, In re, (2026) 8 SCC 722).", "Exam angle": "Environment (Protection) Act* – could be asked on the scope of judicial directions to enforce wildlife protection, focusing on the requirement of urgent remedial orders when illegal activities threaten a sanctuary."}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["Probation / JJ / POCSO / DV"], "landmark": false, "boost": 8}, "date": "2026-11-16"}, {"id": "a309d1e60cf9", "source": "livelaw", "category": "high-court", "title": "Deposit Of Balance Amount After Passing Of Decree Cannot Retrospectively Revive Right To Defend Under Order XXXVII CPC: J&K&L High Court", "court": "Jammu & Kashmir and Ladakh High Court", "case_name": null, "ratio": "The deposit of a balance amount after the passing of a decree cannot be construed as compliance with a conditional direction retrospectively…", "summary": "The High Court of Jammu & Kashmir and Ladakh at Srinagar has held that the deposit of a balance amount after the passing of a decree cannot be construed as compliance with a conditional direction.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/deposit-of-balance-amount-after-passing-of-decree-cannot-retrospectively-revive-right-to-defend-under-order-xxxvii-cpc-jk-high-court-558457", "priority": 80, "topics": ["CPC", "Interpretation of statutes"], "note": {"Facts": "The plaintiffs sued for recovery of Rs 57.32 lacs under Order XXXVII CPC for electrical works allegedly executed at the MLA Hostel. The defendants deposited Rs 19.01 lacs on 26-03-2023 but the balance Rs 18.81 lacs was deposited only on 25-07-2025, after the suit had been decreed in favour of the plaintiffs on 12-08-2023.", "Issue": "Whether a deposit of the balance amount after the decree can be treated as retrospective compliance with the conditional order and thereby revive the defendants’ right to defend the suit under Order XXXVII CPC.", "Held": "The High Court dismissed the appeal, holding that the post-decree deposit cannot be construed as compliance with the condition and therefore cannot revive the right to defend; the trial court’s decree was lawful.", "Principle": "A condition imposed for leave to defend under Order XXXVII CPC must be fulfilled within the stipulated period; a later deposit does not retrospectively satisfy the condition nor revive the right to defend.", "Provisions": "Order XXXVII of the Code of Civil Procedure (CPC); no specific section or case cited in the source.", "Exam angle": "CPC – Order XXXVII; test the requirement of timely compliance with conditions for leave to defend and the effect of subsequent compliance on a decree already passed."}, "syllabus": {"clusters": ["Civil procedure", "Interpretation"], "acts": ["CPC", "Interpretation of statutes"], "landmark": false, "boost": 13}, "date": "2026-11-16"}, {"id": "7865b10deb9e", "source": "livelaw", "category": "high-court", "title": "Better Financial Resources No Ground To Deprive Mother Of Child's Custody: Allahabad High Court Dismisses Grandparents' Appeal", "court": "Allahabad High Court", "case_name": "Manoj Sahlot and another v. State of U.P", "ratio": "The grandparents' better financial resources, by themselves, cannot be a ground for depriving the mother of the child's custody.", "summary": "The Allahabad High Court recently dismissed an appeal filed by a child's paternal grandparents against a Single Judge order directing that the custody of their 8-year-old grandson be handed over to his mother.", "url": "https://www.livelaw.in/high-court/allahabad-high-court/allahabad-hc-better-financial-resources-mother-child-custody-558505", "priority": 80, "topics": ["Hindu / Muslim law"], "note": {"Facts": "The mother filed a habeas corpus petition seeking custody of her 8-year-old son after the paternal grandparents allegedly detained him following the father’s death; the Single Judge ordered custody to the mother, and the grandparents appealed.", "Issue": "Whether the grandparents’ superior financial resources can be a ground to deprive the mother of custody of her minor child.", "Held": "The appeal was dismissed; the custody order in favour of the mother was upheld.", "Principle": "Better financial resources alone do not constitute a ground for taking custody away from a fit mother; the child’s welfare, age, emotional bond and continuity of care are paramount.", "Provisions": "Section 6 of the Hindu Minority and Guardianship Act, 1956; reference to the Guardians and Wards Act (no specific section cited).", "Exam angle": "Family Law – application of the Hindu Minority and Guardianship Act, 1956 to custody disputes; could be asked on the criteria for awarding custody and the relevance (or irrelevance) of the guardian’s financial standing."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-16"}, {"id": "8111bb695481", "source": "scobserver", "category": "supreme-court", "title": "Closed by retreat - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "The Court’s disposal of a challenge to a BCI Circular revives questions about its approach to cases rendered moot. In Rishabh Duggal v Bar Council of India , the Supreme Court of India heard a challenge to the Bar Council of India’s 2016 Circular, which prescribed an upper age limit for admission to law courses.", "url": "https://www.scobserver.in/journal/closed-by-retreat/", "priority": 76, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-16"}, {"id": "26753cf8901e", "source": "livelaw", "category": "high-court", "title": "LiveLaw Allahabad High Court Weekly Round-Up: November 09 To November 15, 2026", "court": null, "case_name": null, "ratio": null, "summary": "Shiv Ram v. State of U.P. Thru.", "url": "https://w
