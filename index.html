ial inability of a woman's family to meet an alleged dowry demand cannot, by itself, be a ground to disbelieve allegations of harassment.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1190-neeraj-kumar-versus-suraj-prakash-ors-559677", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The Supreme Court has observed that while the financial inability of a woman's family to meet an alleged dowry demand cannot, by itself, be a ground to disbelieve allegations of harassment.", "Held": "While the financial inability of a woman's family to meet an alleged dowry demand cannot, by itself, be a ground to disbelieve allegations of harassment…", "Principle": "While the financial inability of a woman's family to meet an alleged dowry demand cannot, by itself, be a ground to disbelieve allegations of harassment…"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-24"}, {"id": "1722443d805d", "source": "livelaw", "category": "supreme-court", "title": "Delay In Trial No Ground For Bail When Accused Has Criminal Antecedents, Previous Conviction: Supreme Court", "court": "Supreme Court", "case_name": "CHANDER PAL v. RAHUL @ VIKRAM & ANR", "ratio": null, "summary": "A mere delay in trial cannot be a ground to enlarge an accused on bail on the strength of his right to a speedy trial while overlooking his antecedents and previous conviction, observed the Supreme Court, while setting aside the bail granted to an accused who had been granted bail in a murder case on the strength of his right to a speedy trial, overlooking his antecedents and previous conviction in an attempt to murder case involving the same deceased person.", "url": "https://www.livelaw.in/supreme-court/delay-in-trial-no-ground-for-bail-when-accused-has-criminal-antecedents-previous-conviction-supreme-court-559709", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The accused was granted bail by the Punjab & Haryana High Court on the sole ground of delay in trial, while his criminal antecedents and a prior conviction for attempt to murder (S. 307 IPC) were concealed.", "Issue": "Whether a mere delay in trial justifies bail when the accused has antecedents and a previous serious conviction.", "Held": "The Supreme Court set aside the High Court’s bail order, cancelling the bail and directing the accused to surrender.", "Principle": "A delay in trial alone cannot be a ground for bail if the accused has criminal antecedents and a prior conviction; the court must balance the right to a speedy trial with societal interest.", "Provisions": "not stated.", "Exam angle": "Criminal Procedure Code – bail provisions; could be asked on the test of “balancing right to speedy trial vs. societal interest” and the requirement to consider antecedents and prior convictions when granting bail."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-24"}, {"id": "e509b1efcc08", "source": "livelaw", "category": "supreme-court", "title": "'Stop Acting Like Bahubali': Supreme Court Chides Bihar Sessions Judge For Order Punishing SP For Contempt", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court today pulled up a Bihar Sessions Judge over the conviction of a senior police officer for contempt for non-compliance of the judge's directions. The top Court also questioned the Sessions Judge's understanding of the law and advised him to stop acting like a \"Bahubali\".", "url": "https://www.livelaw.in/top-stories/stop-acting-like-bahubali-supreme-court-chides-bihar-sessions-judge-for-order-punishing-sp-for-contemptstop-acting-like-bahubali-supreme-court-chides-bihar-sessions-judge-for-order-punishing-sp-for-contempt-559607", "priority": 96, "topics": ["BNSS / CrPC"], "note": {"Facts": "A Bihar Sessions Judge convicted the Rohtas Superintendent of Police for criminal contempt under Section 384 of the Bharatiya Nyaya Sanhita (corresponding to Section 345 CrPC) for willfully disobeying the judge’s directions, imposing a fine of Re 1 and directing training reforms for IAS/IPS officers.", "Issue": "Whether the non-compliance of a police officer with a Sessions Judge’s direction amounts to a crime in the face of the court punishable as criminal contempt under Section 384 BNSS/Section 345 CrPC.", "Held": "The Supreme Court held that the Sessions Judge erred; a failure to comply with a direction does not constitute a “crime in the face of the Court” and the conviction was improper.", "Principle": "Non-compliance with a judicial direction is not criminal contempt unless the act is a direct affront to the dignity or authority of the court; contempt must involve a “crime in the face of the Court”.", "Provisions": "Section 384 Bharatiya Nyaya Sanhita, Section 345 CrPC, Article 227 Constitution (cited in discussion).", "Exam angle": "Criminal Procedure Code – contempt of court; focus on the elements of criminal contempt (Section 345 CrPC) and the limits of a Sessions Judge’s contempt jurisdiction."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-24"}, {"id": "2c3f237a4952", "source": "livelaw", "category": "supreme-court", "title": "CJI-led Bench Of Supreme Court To Hear Umar Khalid, Sharjeel Imam Bail Pleas On Nov 25", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court is set to hear bail pleas of former JNU scholar Umar Khalid and Sharjeel Imam in the 2020 Delhi riots larger conspiracy case after the Delhi High Court denied them bail recently.", "url": "https://www.livelaw.in/top-stories/cji-led-bench-of-supreme-court-to-hear-umar-khalid-sharjeel-imam-bail-pleas-on-nov-25-559687", "priority": 96, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The Delhi High Court denied bail to former JNU scholar Umar Khalid and Sharjeel Imam in the 2020 Delhi riots conspiracy case, imposing a one-year embargo on bail and conditioning release on the completion of protected-witness examination.", "Issue": "Whether the one-year embargo and the protected-witness condition can be relaxed to grant bail to Khalid and Imam.", "Held": "The Supreme Court has scheduled a hearing of the bail appeals on 25 November; no decision has been rendered yet.", "Principle": "The Court will consider whether procedural conditions (embargo period, protected-witness examination) imposed on bail can be relaxed in view of prolonged incarceration.", "Provisions": "not stated.", "Exam angle": "Criminal Procedure Code – bail provisions and judicial discretion in imposing conditions; could be asked on the test for granting bail versus conditions of protected witnesses."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-24"}, {"id": "2f14efee80c2", "source": "sccblog", "category": "supreme-court", "title": "Grandson has no coparcenary right by birth in property that fell to his living father on partition: SC", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: In an appeal by a minor through his mother seeking half a share in land that his father had obtained under a compromise decree in a family partition and later sold, a Division Bench of Augustine George Masih and Sunita Agarwal , JJ. held that, in view of Section 8 , Hindu Succession.", "url": "https://www.scconline.com/blog/post/2026/11/23/grandson-no-coparcenary-right-by-birth-after-partition-class-i-heirs-supreme-court/", "priority": 93, "topics": ["CPC", "Hindu / Muslim law"], "note": {"Facts": "The appellant (a minor) claimed a half-share in land that had been allotted to his father in a 1994 partition compromise and subsequently sold in 1997. He argued that, as the son of a coparcener, he became a coparcener by birth in his grandfather’s ancestral property.", "Issue": "Whether a grandson (son of a living coparcener) has a coparcenary right by birth in property that had already been partitioned and allotted to his father.", "Held": "The Supreme Court affirmed that under Section 8 of the Hindu Succession Act, 1956 a son’s son is not a Class I heir and therefore acquires no right by birth in the grandfather’s property once it is partitioned. The father’s share became his exclusive property, held as a tenant in common, and the grandson’s claim was dismissed.", "Principle": "Upon partition, the allotted share passes to the heir in his individual capacity; the coparcenary does not continue, and a grandson has no coparcenary right by birth in that share.", "Provisions": "Section 8, Hindu Succession Act, 1956; Section 6 (pre-2005) HSA; Section 29-A, Hindu Succession (Tamil Nadu Amendment) Act, 1989 (not attracted). Cases cited: *CWT v. Chander Sen*; *Bhanwar Singh v. Puran*.", "Exam angle": "Test on the Hindu Succession Act, 1956 – focus on Section 8 (Class I heirs) and the effect of partition on coparcenary rights; could be asked as “whether a grandson becomes a coparcener by birth after a partition” or “impact of Section 8 on inheritance of partitioned property.”"}, "syllabus": {"clusters": ["Civil procedure", "Personal, local and constitutional"], "acts": ["CPC", "Hindu / Muslim law"], "landmark": false, "boost": 13}, "date": "2026-11-24"}, {"id": "5b39d48e385d", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Suspends Sentence Of Godhra Train Burning Convict On Medical Grounds", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "A bench comprising Justice MM Sundresh and Justice PB Varale passed an order considering that Irfan suffers from serious cardiovascular disease. The State did not dispute the medical condition of the convict.", "url": "https://www.livelaw.in/top-stories/supreme-court-suspends-sentence-of-godhra-train-burning-convict-on-medical-grounds-559587", "priority": 93, "topics": ["BNSS / CrPC"], "note": {"Facts": "Irfan Siraj Pada, convicted in the 2002 Godhra train-burning case, has been in custody for over 17 years and suffers from serious cardiovascular disease.", "Issue": "Whether the Supreme Court may suspend his sentence and grant bail on medical grounds despite the conviction.", "Held": "The Supreme Court suspended Irfan’s sentence and granted bail, accepting his medical condition and long-term incarceration.", "Principle": "A conviction can be stayed and bail granted when the convict’s serious health condition and prolonged imprisonment justify relief, even after the appellate process.", "Provisions": "not stated", "Exam angle": "Criminal Procedure Code – bail and suspension of sentence on medical grounds; could be asked to frame the issue of granting bail to convicts with serious illness after long imprisonment."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-24"}, {"id": "c51a675106de", "source": "barandbench", "category": "supreme-court", "title": "Supreme Court strikes down two UP laws denying pension benefits with respect to service before regularisation", "court": null, "case_name": null, "ratio": null, "summary": "The Supreme Court has struck down the Uttar Pradesh Qualifying Service for Pension and Validation Act, 2021, and the Uttar Pradesh Entitlement to Pension and Validation Act, 2025, as unconstitutional. [ Uttar Pradesh Ground Water Department Non-Gazetted Employee Association (Regd.) & Anr. v.", "url": "https://www.barandbench.com/news/litigation/supreme-court-strikes-down-two-up-laws-denying-pension-benefits-with-respect-to-service-before-regularisation", "priority": 93, "topics": ["Constitution"], "note": {"Facts": "The Uttar Pradesh Qualifying Service for Pension and Validation Act, 2021 and the Uttar Pradesh Entitlement to Pension and Validation Act, 2025 sought to exclude work-charged, temporary or daily-wage service rendered before regularisation from pension calculations; employees challenged the statutes as unconstitutional.", "Issue": "Whether a law can retrospectively deny pension benefits for service rendered before an employee’s regularisation, thereby overturning the Supreme Court’s earlier ruling in Prem Singh v. State of Uttar Pradesh.", "Held": "The Supreme Court struck down both Acts as unconstitutional, holding that regularised employees cannot be denied pension benefits for their pre-regularisation service.", "Principle": "Once an employee is regularised under a valid scheme, the “birthmark” of the original non-regular appointment is erased; the employer cannot later deny vested retirement rights by retrospectively redefining eligibility, as such denial violates Articles 14, 16 and 21 of the Constitution.", "Provisions": "Articles 14, 16, 21 of the Constitution; Prem Singh v. State of Uttar Pradesh (2019).", "Exam angle": "Test on the constitutional validity of pension-related statutes under Articles 14, 16, 21 (e.g., issue-framing on “class within a class” and the effect of regularisation on service credit)."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-24"}, {"id": "06694e7ce35c", "source": "barandbench", "category": "high-court", "title": "'Basava Mantapa' author moves Karnataka High Court to quash FIR over remarks on Basavanna", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.barandbench.com/news/litigation/basava-mantapa-author-moves-karnataka-high-court-to-quash-fir-over-remarks-on-basavanna", "priority": 82, "topics": ["BNSS / CrPC"], "note": {"Facts": "US-based writer Ravi Hanjagimutt filed a petition in the Karnataka High Court seeking to quash an FIR registered under the Bharatiya Nyaya Sanhita for allegedly derogatory remarks on Basavanna in his Kannada book *Basava Mantapa* and a TV interview.", "Issue": "Whether the FIR invoking Sections 192, 196(1), 353(2) and 299 of the Bharatiya Nyaya Sanhita can stand given the petitioner’s claim that the statements were academic and not intended to offend the Veerashaiva-Lingayat community.", "Held": "(Not stated in the source – the decision is pending).", "Principle": "(Not stated in the source – the ratio will emerge from the court’s interpretation of the listed provisions vis-à-vis freedom of expression and intent).", "Provisions": "Sections 192, 196(1), 353(2), 299 of the Bharatiya Nyaya Sanhita; Section 35(3) of the Bharatiya Nagarik Suraksha Sanhita; Section 98 of the BNSS, 2023 (forfeiture). No case law is cited in the source.", "Exam angle": "Questions may test the applicability of the Bharatiya Nyaya Sanhita provisions on provocation, enmity and outrage of religious feelings, and the procedural safeguards under the Bharatiya Nagarik Suraksha Sanhita (notice under 35 (3), forfeiture under 98). Candidates could be asked to frame the issue of “whether the alleged remarks constitute an offence under Sections 192, 196(1), 353(2) and 299” and to discuss the ingredients of each offence."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-24"}, {"id": "a882391e7724", "source": "livelaw", "category": "high-court", "title": "Madras High Court Quashes FIR Over Critical Remarks Against CM Vijay For Giving Govt Jobs To Karur Tragedy Victims", "court": "Madras High Court", "case_name": "Thirumurugan v. State of Tamil Nadu and Another", "ratio": null, "summary": "The Madras High Court recently quashed a criminal case registered against a man for posting a video criticising CM Joseph Vijay's decision to give government jobs to families of victims who lost their lives during the Karur Stampede in September last year.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-man-posting-video-criticising-karur-stampede-government-job-case-quashed-559638", "priority": 80, "topics": ["BNSS / CrPC"], "note": {"Facts": "The petitioner posted a video harshly criticizing Chief Minister Joseph Vijay’s policy of giving government jobs to families of victims of the Karur stampede; a FIR was filed under Sections 352 and 353(2) of the BNS and the petitioner sought quash.", "Issue": "Whether the video constitutes an offence under Sections 352 or 353(2) of the BNS, or whether it is protected political speech.", "Held": "The Madras High Court quashed the FIR, holding that the ingredients of the alleged offences were not made out and continuation of the proceedings would be an abuse of process.", "Principle": "Purely political commentary, even if harsh, does not attract criminal liability under Sections 352 or 353(2) of the BNS absent incitement to violence, provocation, false information or promotion of enmity; such speech is protected unless it threatens public order.", "Provisions": "Sections 528, 352, 353(2) and 173(3) of the BNS (as cited in the judgment)."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-24"}, {"id": "18a2a683dcf4", "source": "livelaw", "category": "high-court", "title": "LiveLaw Rajasthan High Court Weekly Round-Up: November 16 - November 22, 2026", "court": null, "case_name": null, "ratio": null, "summary": "NOMINAL INDEX [Citations: 491 - 499]Balvinder Singh v State of Rajasthan; 2026 LiveLaw (Raj) 491D v A; 2026 LiveLaw (Raj) 492Vishal Singh v State of Rajasthan, and other connected petitio; 2026 LiveLaw (Raj) 493Anil Shyoran v State of Rajasthan; 2026 LiveLaw (Raj) 494Vijendra Singh v State of Rajasthan; 2026 LiveLaw (Raj) 495Mukesh v the State.", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-weekly-roundup-559689", "priority": 76, "topics": ["Rajasthan laws"], "note": {"Facts": "A practising advocate was alleged to have participated in a corrupt transaction; his role was limited to conveying a demand for illegal gratification.", "Issue": "Whether an advocate who merely communicates a demand, without independently soliciting, demanding or accepting gratification, can be charged under the Prevention of Corruption Act and under Section 120-B IPC for criminal conspiracy.", "Held": "The charges under the Prevention of Corruption Act were set aside, and the criminal conspiracy charge under Section 120-B IPC was quashed.", "Principle": "Mere presence in the chain of communication, without evidence of a meeting of minds or a common unlawful object, does not make a person a co-conspirator or liable under the Prevention of Corruption Act.", "Provisions": "Prevention of Corruption Act (specific sections not stated); Section 120-B, Indian Penal Code; *Balvinder Singh v State of Rajasthan*, 2026 LiveLaw (Raj) 491.", "Exam angle": "Questions may test the applicability of the Prevention of Corruption Act and Section 120-B IPC, focusing on the requirement of an independent demand/solicitation or a “meeting of minds” for conspiracy liability."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Rajasthan laws"], "landmark": false, "boost": 8}, "date": "2026-11-24"}, {"id": "0ed0035400ae", "source": "livelaw", "category": "supreme-court", "title": "Tamil Nadu Government Moves Supreme Court Challenging Madras HC Order To Remove Periyar Statue From Temple Land", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Madras High Court, by its order dated October 30, 2026, had directed the Thanjavur District Collector to safely remove the statue from the temple land and relocate it to another suitable place within four weeks. The Court had also directed the State authorities to file a compliance report and listed the matter after four weeks to verify compliance.", "url": "https://www.livelaw.in/top-stories/tamil-nadu-government-moves-supreme-court-challenging-madras-hc-order-to-remove-per hindu", "category": "editorial", "title": "Just verdict: on Myanmar and the International Court of Justice", "court": null, "case_name": null, "ratio": null, "summary": "Only a truly democratic, federal, plural and peaceful Myanmar can bring the Rohingya home in safety.", "url": "https://www.thehindu.com/opinion/editorial/just-verdict-on-myanmar-and-the-international-court-of-justice/article71735482.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-24"}, {"id": "b6c47eeb1142", "source": "thehindu", "category": "editorial", "title": "Fatal disagreement: on the COP31 summit", "court": null, "case_name": null, "ratio": null, "summary": "Without honest good-faith dialogue, the COP is at risk of being a sideshow.", "url": "https://www.thehindu.com/opinion/editorial/fatal-disagreement-on-the-cop31-summit/article71735124.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-24"}, {"id": "33cb33fc8f2c", "source": "thehindu", "category": "editorial", "title": "The Bilkis Bano order — justice deferred again", "court": null, "case_name": null, "ratio": null, "summary": "In the Bilkis Bano case, the issue is whether the specific relief to two men has been awarded in a way that honours the survivor in the middle of it.", "url": "https://www.thehindu.com/opinion/lead/the-bilkis-bano-order-justice-deferred-again/article71735769.ece/", "priority": 74, "topics": ["Contract / Specific Relief"], "note": null, "syllabus": null, "date": "2026-11-24"}, {"id": "58488f266682", "source": "scobserver", "category": "supreme-court", "title": "Justice’s Long Ascent - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "The Order of suspension of sentence for two convicts in the Bilkis Bano’s matter acts against its own institutional memory On 28 October, the Division Bench of Justice M.M. Sundresh and P.B. Varale suspended the sentences of two convicts—Bipinchandra Kanaiyalal Joshi and Pradip Ramanlal Modhiya—who were convicted in the Bilkis Bano gangrape case and the.", "url": "https://www.scobserver.in/journal/justices-long-ascent/", "priority": 98, "topics": ["BNSS / CrPC"], "note": {"Facts": "The Division Bench of Justice M.M. Sundresh and P.B. Varale suspended the sentences of two convicts (Bipinchandra Joshi and Pradip Modhiya) in the Bilkis Bano gang-rape and murder case, citing long incarceration and Joshi’s disability, and questioning the conviction on the basis that one convict was not named in the original FIR.", "Issue": "Whether a life sentence may be suspended on the grounds raised by the appellants, particularly the reliance on the original FIR and the alleged disability of a convict, given the gravity of the offences.", "Held": "The order suspended the sentences, accepting the appellants’ contentions despite objections from the Additional Solicitor General and without detailed reasoning.", "Principle": "Suspension of a life sentence must be granted only in exceptional circumstances, with due regard to the seriousness of the offence; reliance solely on the original FIR to set aside a conviction is not permissible where the trial courts have already affirmed the conviction on survivor testimony.", "Provisions": "Section 435 CrPC (remission), Section 389 CrPC (cancellation of suspension of sentence), *Rajesh Upadhyay v. State of Bihar* (2025), *Preet Pal Singh v. State of U.P.* (2020).", "Exam angle": "CrPC – discuss the criteria for suspension/remission of life sentences under §§ 389 and 435, and how Supreme Court precedents (*Rajesh Upadhyay*, *Preet Pal Singh*) frame the limits of such orders."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-23"}, {"id": "061ecf592089", "source": "livelaw", "category": "supreme-court", "title": "Court Must Assess Builder-Banker Nexus Before Directing Loan Recovery From Homebuyer : Supreme Court", "court": "Supreme Court", "case_name": "Ravi Kumar Jangra and Anr. v. Union of India and Ors", "ratio": "Unless homebuyers are clearly found in default, upon examining the loan disbursement mechanism between banks and builders…", "summary": "It must be assessed if the loan was disbursed strictly in accordance with the tripartite agreement, and recovery must be ordered only if the homebuyer is clearly in default.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1188-ravi-kumar-jangra-and-anr-v-union-of-india-and-ors-559495", "priority": 90, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "ce41fbde51cf", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court To Examine Whether Former Mutawalli Can Represent Waqf As Sajjadanashin After Tenure Ends", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The dispute arose after the Waqf Tribunal dismissed the Dargah's suit seeking a declaration that certain properties were Waqf properties, on the ground that the person representing it no longer held the position of Mutawalli.", "url": "https://www.livelaw.in/supreme-court/supreme-court-to-examine-whether-former-mutawalli-can-represent-waqf-as-sajjadanashin-after-tenure-ends-559493", "priority": 89, "topics": ["Hindu / Muslim law"], "note": {"Facts": "A former Mutawalli of a Dargah continued to represent the Waqf in a suit after his tenure expired, claiming he was also a Sajjadanashin, an office without a fixed term.", "Issue": "Whether, in the absence of a Waqfnama, Waqf deed or pleaded custom establishing him as Sajjadanashin, a former Mutawalli can represent the Waqf after his Mutawalli tenure ends.", "Held": "The Supreme Court has not yet decided; it has listed the matter for further hearing to examine the question.", "Principle": "The Court must determine if representation can persist without documentary proof (Waqfnama or deed) or pleaded custom of Sajjadanashin status once the Mutawalli’s term has expired.", "Provisions": "not stated.", "Exam angle": "Waqf Act – issue of who may represent a Waqf institution in litigation; could be asked on the requirement of a Waqfnama or custom to establish Sajjadanashin status versus tenure-based authority of a Mutawalli."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-23"}, {"id": "507b30b3051d", "source": "sccblog", "category": "supreme-court", "title": "2026 SCC Vol. 9 Part 1: Key Supreme Court Case on online games", "court": null, "case_name": null, "ratio": null, "summary": "This volume of the Supreme Court Cases (SCC), Part 1 of Volume 9, embodies a landmark case decided by the Supreme Court on consideration of online gaming activities/games played on digital platforms involving staking upon uncertain outcomes, like betting and gambling. Central Goods and Services Tax Act, 2017 — Ss. 2(1) , 2(31) , 2(52).", "url": "https://www.scconline.com/blog/post/2026/11/22/2026-scc-vol-9-part-1-latest-supreme-court-cases/", "priority": 81, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": true, "boost": -2}, "date": "2026-11-23"}, {"id": "057f46c52e5d", "source": "livelaw", "category": "high-court", "title": "Delhi High Court Declines Death Penalty For Cop Convicted Of Double Murder, Says Breach Of Public Trust Alone Can't Justify Capital Punishment", "court": "Delhi High Court", "case_name": "Vimpy Chaddha v. State of NCT of Delhi & Anr", "ratio": null, "summary": "The Delhi High Court has upheld the life sentence awarded to a police officer convicted of murdering two persons in 2011, observing that his abuse of the position of trust reposed in him as a protector of citizens constituted a significant aggravating circumstance.", "url": "https://www.livelaw.in/high-court/delhi-high-court/delhi-high-court-declines-death-penalty-for-cop-convicted-of-double-murder-says-breach-of-public-trust-alone-cant-justify-capital-punishment-559482", "priority": 78, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Police officer Ajay Kumar Tomar, in uniform, robbed and shot Amarjeet Singh Chadha on 24 Sept 2011 and, while fleeing, shot civilian motorcyclist Harender Singh (alias Sunny), who later died.", "Issue": "Whether the officer’s breach of public trust and the gravity of the murders justify enhancement of the life sentences to the death penalty.", "Held": "The Delhi High Court upheld the trial court’s life sentences and rejected the pleas for capital punishment.", "Principle": "Abuse of a position of public trust is an aggravating factor, but alone cannot constitute a ground for death-penalty; capital punishment requires evidence of exceptional brutality, depravity or irredeemability.", "Provisions": "not stated.", "Exam angle": "Could be asked under the IPC’s provisions on murder and death-penalty sentencing, focusing on the test for aggravation versus the requirement of “exceptional” circumstances for capital punishment."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-23"}, {"id": "3d6e6c9b76c3", "source": "livelaw", "category": "high-court", "title": "Daughter-In-Law Can't Be Expected To Vacate Senior Citizen's House Without Assured Alternate Accommodation: Delhi High Court", "court": "Delhi High Court", "case_name": "Namrata Yadav v. Ramesh Kumar Yadav & Ors", "ratio": "A daughter-in-law cannot be expected to vacate her senior citizen in-laws' house and relocate to an alternate accommodation without certainty regarding its standard…", "summary": "The Court was hearing a petition filed by a woman challenging an order passed under the Maintenance and Welfare of Parents and Senior Citizens Act, 2007, directing her and her son to vacate the property occupied by them.", "url": "https://www.livelaw.in/high-court/delhi-high-court/daughter-in-law-cant-be-expected-to-vacate-senior-citizens-house-without-assured-alternate-accommodation-delhi-high-court-559481", "priority": 75, "topics": ["Hindu / Muslim law"], "note": {"Facts": "A daughter-in-law and her son were ordered to vacate the senior-citizen in-laws’ house under the Maintenance and Welfare of Parents and Senior Citizens Act, 2007, after the in-laws alleged harassment; the daughter-in-law claimed the house was her matrimonial home under the Protection of Women from Domestic Violence Act, 2005.", "Issue": "Whether a daughter-in-law can be compelled to vacate the senior-citizen’s house without a guaranteed, suitably standardised alternate accommodation.", "Held": "The Delhi High Court upheld the eviction order in principle but modified it, directing the in-laws to provide specific alternate accommodation (rent up to ₹35,000 and six months’ advance) and allowing the daughter-in-law four weeks to identify suitable housing, thereby protecting her right to residence.", "Principle": "A daughter-in-law’s right to reside in a shared household is not absolute; eviction must be accompanied by assured, adequate alternate accommodation to avoid rendering the residential right illusory.", "Provisions": "Maintenance and Welfare of Parents and Senior Citizens Act, 2007; Protection of Women from Domestic Violence Act, 2005; no specific sections or cases cited in the source.", "Exam angle": "Questions may test the interplay of the Maintenance and Welfare of Parents and Senior Citizens Act, 2007 with the Protection of Women from Domestic Violence Act, 2005, focusing on the balance of senior citizens’ right to peaceful living against a daughter-in-law’s right to residence and the requirement of guaranteed alternate accommodation."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-23"}, {"id": "784914a17cd5", "source": "livelaw", "category": "supreme-court", "title": "Police Can't Justify Restraint Of Journalists By Merely Avoiding Words 'Arrest' Or 'Detention': Media Organisation Tells Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "Journalism cannot be made conditional on accreditation, the Network of Women in Media stated in the rejoinder.", "url": "https://www.livelaw.in/top-stories/police-cant-justify-restraint-of-journalists-by-merely-avoiding-words-arrest-or-detention-media-organisation-tells-supreme-court-559479", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "832a255f791d", "source": "livelaw", "category": "supreme-court", "title": "Tamil Nadu Files Review Petition Against Supreme Court Order Allowing Karthigai Lamp Lighting At Thiruparankundram Deepathoon", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The bench directed that only authorised representatives of the Devasthanam (temple administration) and government officials would be permitted to access the location for the ritual. The general public would not be allowed to go to the Deepathoon. No procession, public congregation, slogan-raising or demonstration shall be allowed during the ceremony.", "url": "https://www.livelaw.in/top-stories/tamil-nadu-files-review-petition-against-supreme-court-order-allowing-karthigai-lamp-lighting-at-thiruparankundram-deepathoon-559492", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "a8505eec7a07", "source": "livelaw", "category": "high-court", "title": "Senior Citizen Can't Be Compelled To Share Own House With Children Against Wishes: Delhi High Court", "court": "Delhi High Court", "case_name": null, "ratio": null, "summary": "The Court set aside orders passed by the District Magistrate and the Divisional Commissioner rejecting his eviction plea under the Maintenance and Welfare of Parents and Senior Citizens Act, 2007, and directed the son and daughter-in-law to vacate the property within four weeks.", "url": "https://www.livelaw.in/high-court/delhi-high-court/senior-citizen-cant-be-compelled-to-share-own-house-with-children-against-wishes-delhi-high-court-559486", "priority": 72, "topics": ["Hindu / Muslim law"], "note": {"Facts": "An 85-year-old owner of a self-acquired house in Delhi filed a petition for eviction of his eldest son and daughter-in-law, alleging harassment, threats and assault, and seeking relief under the Maintenance and Welfare of Parents and Senior Citizens Act, 2007.", "Issue": "Whether a senior citizen can be compelled to share his own house with his children against his wishes when he alleges harassment, and what evidentiary standard is required under the Senior Citizens Act for eviction.", "Held": "The Delhi High Court set aside the orders of the District Magistrate and Divisional Commissioner and directed the son and daughter-in-law to vacate the property within four weeks, holding that the senior citizen’s right to peaceful, dignified residence outweighs the requirement of proving harassment by the stringent civil standard.", "Principle": "Under the Maintenance and Welfare of Parents and Senior Citizens Act, 2007, a senior citizen may obtain eviction of children from his own property if he demonstrates that the property needs protection for him to live peacefully and with dignity; the Act does not impose a requirement of “clear and cogent” evidence of harassment, and summary proceedings may rely on the overall factual matrix, including police complaints.", "Provisions": "Maintenance and Welfare of Parents and Senior Citizens Act, 2007; Delhi Maintenance and Welfare of Parents and Senior Citizens Rules, 2009; *Ravi Kant Gupta v. State of Uttar Pradesh*; *Pritam Singh v. Government of NCT of Delhi*.", "Exam angle": "Questions may test the application of the Senior Citizens Act – e.g., “Discuss the criteria for eviction of children from a senior citizen’s property under the Act and the evidentiary standards required,” or “Analyse how the High Court’s interpretation of ‘protection of property’ expands the scope of relief under the Act.”"}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-23"}, {"id": "2c52cd69e851", "source": "livelaw", "category": "supreme-court", "title": "Independence Of Judiciary Is Non-Negotiable: Justice KV Viswanathan", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "Speaking at the launch of the book in New Delhi on Friday, Justice Viswanathan said that the work was not merely a narration of historical trials but carried several important messages, with its primary message being a tribute to the independence of the judiciary.", "url": "https://www.livelaw.in/top-stories/independence-of-judiciary-is-non-negotiable-justice-kv-viswanathan-559480", "priority": 69, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "b9e620f8f489", "source": "livelaw", "category": "high-court", "title": "Fresh Divorce Petition Maintainable Despite Earlier Withdrawal Without Liberty To Refile On Jurisdictional Grounds: Delhi High Court", "court": "Delhi High Court", "case_name": null, "ratio": "Procedural provisions cannot be applied in a manner that defeats substantive matrimonial rights…", "summary": "The Delhi High Court has held that withdrawal of a divorce petition due to a defect in territorial jurisdiction, even without obtaining liberty to institute a fresh petition.", "url": "https://www.livelaw.in/high-court/delhi-high-court/fresh-divorce-petition-maintainable-despite-earlier-withdrawal-without-liberty-to-refile-on-jurisdictional-grounds-delhi-high-court-559484", "priority": 64, "topics": ["Hindu / Muslim law"], "note": {"Facts": "The husband withdrew a 2021 divorce petition filed in Gurugram Family Court for lack of territorial jurisdiction without seeking liberty to re-file, and later instituted a fresh petition in Dwarka Family Court; the wife sought dismissal of the second petition under Order XXIII Rule 1(4) CPC.", "Issue": "Whether a divorce petition withdrawn for a jurisdictional defect, without liberty to institute a fresh suit, bars the filing of a subsequent petition on the same matrimonial claim.", "Held": "The Delhi High Court allowed the fresh petition, holding that the earlier withdrawal does not bar a new suit where the withdrawal was made bona-fide due to lack of jurisdiction and not to abandon the claim.", "Principle": "A withdrawal of a matrimonial suit for a jurisdictional defect, without intent to abandon the claim, does not invoke Order XXIII Rule 1(4) CPC to bar a fresh petition; procedural rules cannot defeat substantive matrimonial rights unless the statute expressly mandates such consequence.", "Provisions": "Order VII Rule 11 CPC; Order XXIII Rule 1(4) CPC; *Nidhi Jain v. Ankit Jain* (distinguished)."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-23"}, {"id": "e29fc44e0e6f", "source": "livelaw", "category": "high-court", "title": "Child's Welfare Paramount In Custody Disputes, Not Parents' 'Battle Of Wits And Egos': Delhi High Court", "court": "Delhi High Court", "case_name": null, "ratio": null, "summary": "Justice Neena Bansal Krishna made the observation while disposing of a contempt petition filed by a father alleging that his estranged wife was deliberately disobeying a Family Court order granting him visitation rights to meet their minor son.", "url": "https://www.livelaw.in/high-court/delhi-high-court/childs-welfare-paramount-in-custody-disputes-not-parents-battle-of-wits-and-egos-delhi-high-court-559483", "priority": 62, "topics": ["Hindu / Muslim law"], "note": {"Facts": "A father filed a contempt petition alleging his estranged wife deliberately violated a Family Court order granting him visitation rights to their minor son; the parties had a settlement permitting visitation, but the mother allegedly obstructed it and has an appeal pending.", "Issue": "Whether the mother’s alleged non-compliance with the visitation order amounts to contempt, or whether the matter should be decided by the Family Court on execution/modification of the order.", "Held": "The Delhi High Court declined to entertain contempt proceedings, directing the Family Court to consider the father’s execution petition and pass appropriate orders.", "Principle": "In custody and visitation disputes, the child’s welfare is paramount and alleged breaches of visitation orders must be resolved by the competent Family Court, not through contempt proceedings at the interim stage.", "Provisions": "not stated.", "Exam angle": "Application of the Family Courts Act (guardianship and visitation orders) – could be asked on the test as an issue-framing question about the proper forum and the primacy of the child’s best interests in custody disputes."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-23"}, {"id": "c1a7993f30eb", "source": "livelaw", "category": "high-court", "title": "Haryana State Legal Services Authority Conducts Statewide Special Lok Adalat For Negotiable Instruments Act Cases", "court": "Punjab & Haryana High Court", "case_name": null, "ratio": null, "summary": "In pursuance of the vision of ensuring accessible, affordable, and expeditious justice for all, a Special Lok Adalat for cases under the Negotiable Instruments Act was successfully organized across.", "url": "https://www.livelaw.in/news-updates/haryana-state-legal-services-authority-special-lok-adalat-negotiable-instruments-act-cases-559491", "priority": 61, "topics": ["NI Act s.138"], "note": {"Facts": "In pursuance of the vision of ensuring accessible, affordable, and expeditious justice for all, a Special Lok Adalat for cases under the Negotiable Instruments Act was successfully organized across.", "Held": "Bench: Justice Harsimran Singh Sethi"}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NI Act s.138"], "landmark": false, "boost": 8}, "date": "2026-11-23"}, {"id": "3fd58c44db92", "source": "sccblog", "category": "high-court", "title": "“Daughter”, not “adopted daughter”: Kerala HC directs State to amend e-district portal to record adopted children as “son” or “daughter” without any prefix", "court": null, "case_name": null, "ratio": null, "summary": "Kerala High Court: In a matter concerning the legal status and identity of an adopted child in official records, a Single Judge Bench of P.V. Kunhikrishnan, J . held that an adopted child must be recognised simply as the “son” or “daughter” of their adoptive parents, without the prefix “adopted”.", "url": "https://www.scconline.com/blog/post/2026/11/21/kerala-high-court-adopted-children-official-records-e-district-portal/", "priority": 56, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "d5c4a408ec83", "source": "livelaw", "category": "high-court", "title": "Centre's Order Cancelling Author Amrit Wilson's OCI Card Lacks Details Of 'Anti-India Activities': Delhi High Court", "court": "Delhi High Court", "case_name": null, "ratio": null, "summary": "Justice Amit Mahajan held that the principles of natural justice were not followed in the cancellation proceedings, as neither the show cause notice nor the cancellation order disclosed specific details of the alleged activities.", "url": "https://www.livelaw.in/high-court/delhi-high-court/centres-order-cancelling-author-amrit-wilsons-oci-card-lacks-details-of-anti-india-activities-delhi-high-court-559485", "priority": 56, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "d0d0710adbb1", "source": "livelaw", "category": "high-court", "title": "TVK MLA Sent Obscene Messages To District Collector, Police Took No Action On Complaint : Justice Victoria Gowri", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "\"Recently, there was an incident regarding the Kallakurichi District Collector. She was sent inappropriate messages by the Kallakurichi MLA. Isn't that workplace harassment? The Collector's husband has filed a complaint, but the state police department has so acted.", "url": "https://www.livelaw.in/high-court/madras-high-court/tvk-mla-sent-obscene-messages-to-district-collector-police-took-no-action-on-complaint-justice-victoria-gowri-559506", "priority": 50, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "981cca002aa1", "source": "sccblog", "category": "judiciary", "title": "Shardul Amarchand Mangaldas & Co advises EAAA India Alternatives Limited on ₹1,000 crore investment in relation to Great White Group", "court": null, "case_name": null, "ratio": null, "summary": "Shardul Amarchand Mangaldas & Co (“ SAM ”) advised EAAA India Alternatives Limited (“ EAAA ”), as investment manager of India Special Assets Fund III, ISAF III Onshore Fund and Special Situation India Fund, on its investment of up to ₹1,000 crore through a combination of debt and equity instruments to facilitate the acquisition of.", "url": "https://www.scconline.com/blog/post/2026/11/21/shardul-amarchand-mangaldas-eaaa-india-alternatives-great-white-group-investment/", "priority": 45, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-23"}, {"id": "b9566681ade4", "source": "telegram-pdf", "category": "national", "title": "S , "case_name": null, "ratio": "A Magistrate who rejects a police report stating that no cognizable offence is made out must record reasons for doing so before directing registration of…", "summary": "The Supreme Court has recently held that a Magistrate who rejects a police report stating that no cognizable offence is made out must record reasons for doing so before directing registration of an FIR under Section 156(3) of the Code of Criminal Procedure, 1973 (CrPC, now Section 175(3) of the Bharatiya Nagarik Suraksha Sanhita.", "url": "https://www.livelaw.in/supreme-court/magistrate-must-give-reasons-when-ordering-fir-despite-police-report-of-no-offence-supreme-court-559470", "priority": 100, "topics": ["BNSS / CrPC"], "note": {"Facts": "A group of landowners complained to the Delhi Economic Offences Wing (EOW) that a developer and its lenders had cheated them. The EOW, after a preliminary enquiry, filed an Action Taken Report (ATR) stating that no cognizable offence was made out. The complainants approached a Magistrate under Section 156(3) CrPC, and despite the ATR, the Magistrate ordered registration of an FIR. The High Court refused to quash the FIR; the appellants then appealed to the Supreme Court.", "Issue": "Whether a Magistrate must give reasons when he rejects a police report/ATR stating that no cognizable offence is made out and directs registration of an FIR under Section 156(3) CrPC (now Section 175(3) BNSS).", "Held": "The Supreme Court held that a Magistrate who rejects the police’s conclusion must record reasons relating to the material before ordering an FIR. Failure to do so renders the order “without application of mind” and is liable to be set aside.", "Principle": "A judicial authority exercising discretion under Section 156(3) CrPC must apply its judicial mind and give a reasoned order when its conclusion diverges from the investigative agency’s report; the reasons need not be elaborate but must exist and be linked to the material.", "Provisions": "- Section 156(3) CrPC (now Section 175(3) BNSS) – power to order investigation. - Action Taken Report (ATR) – not a Section 173 CrPC report (now Section 193 BNSS) and not binding, but must be considered. - References: *Lalita Kumari v. Government of UP*, *Maksud Saiyed v. State of Gujarat*, *Priyanka Srivastava v. State of UP*, *Anurag Bhatnagar v. State (NCT of Delhi)*, *SN Vijayalakshmi v. State of Karnataka*.", "Exam angle": "Test on the CrPC (or BNSS) – Section 156(3) discretion and the duty to give reasons; could be asked as “What is the requirement of reasoned orders when a Magistrate orders FIR under Section 156(3) despite police’s ATR?” – focus on judicial mind, ATR vs. Section 173 report, and relevant case law."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-22"}, {"id": "87fdb485f151", "source": "livelaw", "category": "legislation", "title": "2019 Amendment Enhancing Minimum Punishment Under POCSO Act Not Retrospective: Tripura High Court", "court": "Tripura High Court", "case_name": "Miithun v. State of Tripura", "ratio": null, "summary": "The Tripura High Court has reduced the sentence of a man convicted under the POCSO Act from 20 years to 10 years after finding that the Trial Court had applied the enhanced minimum punishment introduced by the 2019 amendment to an offence committed before the amendment came into force. Section 6 of the POCSO Act prescribes the punishment for aggravated penetrative sexual assault.", "url": "https://www.livelaw.in/high-court/tripura-high-court/tripura-high-court-corrects-trial-court-retrospective-application-2019pocso-amendment-559386", "priority": 97, "topics": ["BNSS / CrPC", "Probation / JJ / POCSO / DV", "Interpretation of statutes"], "note": {"Facts": "A man was convicted for aggravated penetrative sexual assault committed before the 2019 amendment and was sentenced to 20 years by the Trial Court.", "Issue": "Whether the enhanced minimum punishment introduced by the 2019 amendment to the POCSO Act can be applied retrospectively to offences committed before its commencement.", "Held": "The Tripura High Court reduced the sentence to 10 years, holding that the amendment is not retrospective and cannot be applied to the earlier offence.", "Principle": "An amendment increasing the minimum punishment under the POCSO Act is prospective and cannot be imposed on offences that occurred before the amendment’s commencement.", "Provisions": "Section 6 of the POCSO Act (as amended); 2019 amendment to the POCSO Act; no other cases cited.", "Exam angle": "POCSO Act – issue of retrospective application of statutory amendments; could be asked on the principle that enhanced punishments are not retrospective and the ingredients of Section 6."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts", "Interpretation"], "acts": ["BNSS / CrPC", "Probation / JJ / POCSO / DV", "Interpretation of statutes"], "landmark": false, "boost": 14}, "date": "2026-11-22"}, {"id": "bed36671182d", "source": "livelaw", "category": "supreme-court", "title": "Limitation Act | Delay Must Be Assessed On Cumulative Circumstances, Not Isolated Reasons: Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": "While considering an application for condonation of delay, factors such as administrative procedures, change of counsel…", "summary": "The Supreme Court has held that while considering an application for condonation of delay, factors such as administrative procedures, change of counsel, and procurement of certified copies cannot.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1186-delhi-development-authority-vsudarshan-manjhi-ors-559434", "priority": 94, "topics": ["Limitation / Registration"], "note": {"Facts": "The Supreme Court has held that while considering an application for condonation of delay, factors such as administrative procedures, change of counsel, and procurement of certified copies cannot.", "Held": "While considering an application for condonation of delay, factors such as administrative procedures, change of counsel…", "Principle": "While considering an application for condonation of delay, factors such as administrative procedures, change of counsel…", "Provisions": "Observed that the delay caused due to administrative hurdles, change of counsel cannot justify delay, however, such factors cannot be viewed in isolation rath"}, "syllabus": {"clusters": ["Property"], "acts": ["Limitation / Registration"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "8694046dabf2", "source": "livelaw", "category": "supreme-court", "title": "Non-Participant In Auction Cannot Seek Award By Making Higher Offer Later : Supreme Court", "court": "Supreme Court", "case_name": "M/s Kalindi Associates v. M/s Bharat Commerce and Industries Limited & Ors", "ratio": null, "summary": "The Supreme Court held that a person who did not participate in an auction and is a stranger to it acquires no locus or right to seek confirmation of the bid in his favour merely by offering a higher price at a later stage.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1187-ms-kalindi-associates-v-ms-bharat-commerce-and-industries-limited-ors-559450", "priority": 88, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-22"}, {"id": "c434276bef22", "source": "livelaw", "category": "high-court", "title": "'Stringent Bail Conditions Under PMLA Cannot Override Constitutional Right To Personal Liberty': Jharkhand High Court", "court": "Jharkhand High Court", "case_name": "Basudeb Bagchi and Anr. v. Directorate of Enforcement", "ratio": "The stringent bail conditions prescribed under Section 45 of the Prevention of Money Laundering Act, 2002 (PMLA)…", "summary": "The Court observed that prolonged pre-trial incarceration, particularly where the trial is unlikely to conclude within a reasonable period, constitutes a substantial ground for granting bail notwithstanding the restrictions under the PMLA.", "url": "https://www.livelaw.in/high-court/jharkhand-high-court/jharkhand-high-court-grants-bail-two-accused-prayag-group-money-laundering-case-559215", "priority": 83, "topics": ["BNSS / CrPC", "Constitution"], "note": {"Facts": "The Jharkhand High Court granted bail to two accused in a money-laundering case (Prayag Group) after they had been in pre-trial custody for a prolonged period, noting that no chargesheet was filed in the predicate offences and that the Supreme Court had already granted them bail in a related PMLA case.", "Issue": "Whether the stringent bail conditions under Section 45 of the Prevention of Money Laundering Act, 2002 can override the constitutional right to personal liberty under Article 21 of the Constitution.", "Held": "The Court allowed bail, holding that Section 45’s restrictions cannot eclipse Article 21 and that prolonged pre-trial detention without a reasonable prospect of trial is a substantial ground for bail.", "Principle": "When pre-trial incarceration is likely to be indefinite or unduly prolonged, the statutory rigour of Section 45 PMLA yields to the constitutional guarantee of personal liberty under Article 21; bail must be granted to prevent punishment before conviction.", "Provisions": "Section 45, PMLA; Sections 3, 70, 4, PMLA; Article 21, Constitution of India; Supreme Court decisions (unnamed) on bail under Section 45.", "Exam angle": "PMLA – bail under Section 45 vis-à-vis Article 21; could be asked to frame the issue of “whether stringent statutory bail conditions can be relaxed on the ground of violation of personal liberty and right to speedy trial” and to list the ingredients (pre-trial detention length, absence of chargesheet, likelihood of early trial)."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Constitution"], "landmark": false, "boost": 13}, "date": "2026-11-22"}, {"id": "83b08c98d1d0", "source": "livelaw", "category": "high-court", "title": "Jharkhand High Court Directs Improvements To AIIMS Deoghar Infra In MP Nishikant Dubey's PIL, Cites Right To Healthcare", "court": "Jharkhand High Court", "case_name": "Nishikant Dubey v. Union of India and Ors", "ratio": "The effective functioning of tertiary healthcare institutions such as AIIMS Deoghar is intrinsically linked to the State's constitutional obligation under Article 21 of the Constitution", "summary": "The Jharkhand HC has held that the effective functioning of tertiary healthcare institutions such as AIIMS Deoghar is intrinsically linked to the State's constitutional obligation under Article 21 of the Constitution. The Court observed that access to hospital facilities and timely medical care forms an integral part of the right to life and that ensuring adequate infrastructure at such institutions is not merely an administrative matter.", "url": "https://www.livelaw.in/high-court/jharkhand-high-court/jharkhand-high-court-directs-improvement-aiims-deoghar-infrastructure-mp-nishikant-dubey-pil-559399", "priority": 79, "topics": ["Constitution"], "note": {"Facts": "A PIL filed by MP Nishikant Dubey sought directions to make AIIMS Deoghar fully functional, highlighting deficiencies in electricity, water, fire safety, land encroachments, a railway over-bridge and a diesel-storage tank.", "Issue": "Whether the State’s failure to provide adequate infrastructure to AIIMS Deoghar violates its constitutional obligation under Article 21 to ensure the right to life-including access to timely medical care.", "Held": "The Jharkhand High Court directed the State to remedy the identified infrastructure gaps within stipulated time-frames and disposed of the PIL, noting that the State had begun remedial steps.", "Principle": "Effective functioning of tertiary-care institutions is integral to the fulfillment of the State’s constitutional duty under Article 21; therefore, ensuring essential infrastructure (electricity, water, fire safety, etc.) is a justiciable aspect of the right to life.", "Provisions": "Article 21 of the Constitution; no specific statutory sections or case citations were mentioned in the source.", "Exam angle": "Article 21 (right to life) – could be asked on how the right to health care is interpreted as part of life, focusing on the State’s duty to provide functional medical infrastructure."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "ac90ea89ff95", "source": "livelaw", "category": "high-court", "title": "Family Courts And High Courts Can't Grant Divorce Solely On Ground Of Irretrievable Breakdown Of Marriage: Telangana High Court", "court": "Telangana High Court", "case_name": null, "ratio": "A High Court or Family Court cannot grant a decree of divorce solely on the ground of irretrievable breakdown of marriage…", "summary": "The ruling: A High Court or Family Court cannot grant a decree of divorce solely on the ground of irretrievable breakdown of marriage….", "url": "https://www.livelaw.in/high-court/telangana-high-court/telangana-high-court-grant-divorce-solely-ground-irretrievable-breakdown-559394", "priority": 78, "topics": ["CPC", "Hindu / Muslim law"], "note": {"Facts": "The Telangana High Court considered whether a decree of divorce could be granted solely on the ground of irretrievable breakdown of marriage.", "Issue": "Can a High Court or Family Court grant divorce on the sole ground of irretrievable breakdown of marriage under the Hindu Marriage Act, 1955?", "Held": "The Court held that divorce cannot be granted solely on that ground, though it may be taken into account along with other factors when deciding a divorce appeal.", "Principle": "A decree of divorce must rest on statutory grounds; irretrievable breakdown alone is not a sufficient ground under the Hindu Marriage Act, 1955.", "Provisions": "Hindu Marriage Act, 1955 (no specific section cited); not stated.", "Exam angle": "Test on the Hindu Marriage Act – ask whether irretrievable breakdown is a standalone ground for divorce and the requirement to consider additional statutory grounds."}, "syllabus": {"clusters": ["Civil procedure", "Personal, local and constitutional"], "acts": ["CPC", "Hindu / Muslim law"], "landmark": false, "boost": 13}, "date": "2026-11-22"}, {"id": "f7b1d24d073e", "source": "livelaw", "category": "high-court", "title": "'Mere Position As School Principal Does Not Attract Liability U/S 19 POCSO Act Without Knowledge Of Offence': Patna High Court", "court": "Patna High Court", "case_name": "Amal Raj v. State of Bihar and Anr", "ratio": null, "summary": "The Patna HC has held that merely holding the position of Principal of a school does not automatically attract criminal liability under Sections 19 and 21 of the Protection of Children from Sexual Offences Act, 2012 (POCSO Act), unless there is material establishing knowledge or apprehension of the commission of a sexual offence and a consequent failure to discharge the statutory duty to report it.", "url": "https://www.livelaw.in/high-court/patna-high-court/patna-high-court-school-principal-liability-pocso-act-without-proof-of-knowledge-559398", "priority": 78, "topics": ["BNS / IPC", "BNSS / CrPC", "Probation / JJ / POCSO / DV"], "note": {"Facts": "The FIR alleged sexual harassment of a minor by two sports teachers; the school principal was later added as accused without any allegation of his knowledge or involvement.", "Issue": "Whether a school principal can be held liable under Sections 19 and 21 of the POCSO Act (and related provisions) merely by virtue of his position, absent proof of knowledge or apprehension of the offence.", "Held": "The Patna High Court quashed the cognizance order and all criminal proceedings against the principal, holding that his mere position does not attract liability under Sections 19, 21, 17 of the POCSO Act or Section 75 of the JJ Act without material showing knowledge, apprehension, abetment or culpable omission.", "Principle": "Liability under Section 19 POCSO (and the attendant punishment under Section 21) arises only when the person had actual knowledge or a reasonable apprehension of the offence and willfully failed to report it; mere positional authority without such knowledge is insufficient for criminal prosecution.", "Provisions": "Sections 19, 21, 17 of the Protection of Children from Sexual Offences Act, 2012; Section 75 of the Juvenile Justice (Care and Protection of Children) Act, 2015; Section 528 of the Bharatiya Nagarik Suraksha Sanhita, 2023; reference to the Patna High Court judgment (Justice Sunil Dutta Mishra).", "Exam angle": "POCSO Act – focus on the statutory duty to report (Sec. 19) and its conditions; could be asked as an issue-framing question on “when does a person in a position of authority attract criminal liability under Sec. 19/21 POCSO?” or as an ingredient-based question testing knowledge/apprehension requirement."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts"], "acts": ["BNS / IPC", "BNSS / CrPC", "Probation / JJ / POCSO / DV"], "landmark": false, "boost": 13}, "date": "2026-11-22"}, {"id": "ae4f2c9bfb8b", "source": "livelaw", "category": "high-court", "title": "Refunding Money To Customers Does Not Wipe Out Banking Misconduct: Calcutta High Court Upholds SBI Employee's Removal", "court": "Calcutta High Court", "case_name": null, "ratio": "A bank employee was required to follow prescribed procedures while handling customers' accounts, irrespective of whether the Bank ultimately suffered monetary loss", "summary": "The Calcutta High Court has refused to interfere with the dismissal of a former State Bank of India (SBI) employee who was found guilty of five out of six charges relating to alleged irregularities.", "url": "https://www.livelaw.in/high-court/calcutta-high-court/refunding-money-to-customers-does-not-wipe-out-banking-misconduct-calcutta-high-court-upholds-sbi-employees-removal-559358", "priority": 77, "topics": ["BNSS / CrPC"], "note": {"Facts": "A former SBI Customer Assistant was dismissed after a departmental enquiry proved five of six charges of irregular handling of customers’ accounts, including unauthorized debits and disbursements, despite later refunds of the amounts.", "Issue": "Whether the refund of monies or the absence of financial loss can negate the misconduct and render the removal from service disproportionate.", "Held": "The Calcutta High Court dismissed the writ petition and upheld the removal, holding that refund or regularisation does not erase the misconduct already committed.", "Principle": "Refund of money or lack of loss does not extinguish the liability for misconduct; a bank employee must follow prescribed procedures, and repeated unauthorized actions constitute major misconduct justifying removal.", "Provisions": "not stated.", "Exam angle": "Could be asked under the Banking Regulation Act/Banking Service Rules – focusing on disciplinary procedure, the test of misconduct versus loss, and the proportionality of penalty."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-22"}, {"id": "659caee268a2", "source": "sccblog", "category": "high-court", "title": "Negative Phenolphthalein Test does not help accused when bribe money is placed at his direction: Kerala HC", "court": null, "case_name": null, "ratio": null, "summary": "Kerala High Court : The present appeal was filed against the judgment of the Enquiry Commissioner and Special Judge, Kottayam, convicting the appellant, a former Assistant Engineer of Arakulam Gram Panchayat, for offences relating to demand and acceptance of illegal gratification under Sections 7 and 13(1)(d) read with Section 13(2) of the Prevention of Corruption.", "url": "https://www.scconline.com/blog/post/2026/11/21/negative-phenolphthalein-test-bribery-case-kerala-hc/", "priority": 76, "topics": ["NDPS / SC-ST / PC / others"], "note": {"Facts": "The appellant, a former Assistant Engineer of Arakulam Gram Panchayat, was accused of demanding and accepting illegal gratification for passing a bill on a pond construction; the complainant placed the bribe money in the measurement book (M-book) at the appellant’s direction, after which a vigilance team recovered it.", "Issue": "Whether the absence of a colour change on the appellant’s hands in a phenolphthalein test defeats the prosecution’s case of demand and acceptance of illegal gratification.", "Held": "The Kerala High Court held that the negative phenolphthalein test does not discredit the prosecution’s case, as the money was placed in the M-book on the appellant’s direction and he was apprehended before any further handling.", "Principle": "A negative phenolphthalein test on the accused’s hands does not defeat proof of demand and acceptance of illegal gratification when the money is shown to have been placed at the accused’s direction; demand and acceptance can be established by oral, documentary or circumstantial evidence.", "Provisions": "Sections 7 and 13(1)(d) read with Section 13(2) of the Prevention of Corruption Act, 1988; Section 120-B of the Indian Penal Code, 1860; cited cases: judgment of the Enquiry Commissioner and Special Judge, Kottayam; High Court judgment of A. Badharudeen, J.", "Exam angle": "Questions may test the Prevention of Corruption Act – how demand and acceptance of illegal gratification are proved; focus on evidentiary issues such as the relevance of chemical tests (phenolphthalein) and the weight of oral/circumstantial evidence."}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NDPS / SC-ST / PC / others"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "8ffa4591bf34", "source": "sccblog", "category": "high-court", "title": "Patna HC holds Permanent Lok Adalat lacks jurisdiction to record land dispute compromise; Sets aside award as void ab initio", "court": null, "case_name": null, "ratio": null, "summary": "Patna High Court: In a writ petition seeking modification of an award passed by the Permanent Lok Adalat, Sasaram, Rohtas, to incorporate a portion of land allegedly omitted due to a typographical mistake, a Single Judge Bench of G. Anupama Chakravarthy, J. , held that a Permanent Lok Adalat has no jurisdiction to record a.", "url": "https://www.scconline.com/blog/post/2026/11/21/pat-hc-permanent-lok-adalat-lacks-jurisdiction-over-land-dispute-compromises/", "priority": 76, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "c5b074244e3a", "source": "sccblog", "category": "high-court", "title": "State cannot renege on binding sale of Ballygunge land only because of change in regime: Calcutta HC", "court": null, "case_name": null, "ratio": null, "summary": "Calcutta High Court: In an appeal by the State of Mizoram challenging the Single Judge’s order that set aside the cancellation of an e-tender for the sale of government land in Ballygunge, Kolkata, the Division Bench of Arijit Banerjee* and Apurba Sinha Ray, JJ., dismissed the appeal and held that the State had failed to.", "url": "https://www.scconline.com/blog/post/2026/11/21/calcutta-hc-tender-cancellation-after-change-of-government/", "priority": 76, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "fbfba493119c", "source": "livelaw", "category": "high-court", "title": "Mother's Employment-Related Travel Not Grounds To Deny Child Custody When Father Is Also Busy Professional: Chhattisgarh High Court", "court": "Chhattisgarh High Court", "case_name": "Dr. Santosh Bh
