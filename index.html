tle": "LiveLaw Allahabad High Court Weekly Round-Up: November 02 To November 08, 2026", "court": null, "case_name": null, "ratio": null, "summary": "NOMINAL INDEX U.P. Rajya Sadak Parivahan Nigam vs. Basant Lal and four others 2026 LiveLaw (AB) 905 Vijay Sonkar & 3 Ors.", "url": "https://www.livelaw.in/round-ups/weekly/livelaw-allahabad-high-court-weekly-round-up-november-02-to-november-08-2026-557916", "priority": 68, "topics": ["General"], "date": "2026-11-11"}, {"id": "04d58288e9c2", "source": "sccblog", "category": "high-court", "title": "Top Legal Developments [2-8 Nov 2026]: OBC creamy layer Criteria, green crackers, OCI Card holder deportation, bonded labour; and more", "court": null, "case_name": null, "ratio": null, "summary": "This roundup of weekly legal developments in India highlights significant Supreme Court and High Court rulings, including the Supreme Court’s clarification on the applicability of OBC creamy layer criteria to concluded selections and UPSC CSE 2025 service allocation, its decision permitting green crackers in Delhi-NCR for two days, the rights of OCI card holders against.", "url": "https://www.scconline.com/blog/post/2026/11/10/weekly-legal-developments-india-2-8-november-2026/", "priority": 68, "topics": ["Environment"], "date": "2026-11-11"}, {"id": "9d7d7ccb1ccc", "source": "livelaw", "category": "high-court", "title": "Being Natural Guardian Doesn't Entitle Father To Take Child's Custody By Force: Madras High Court", "court": "Madras High Court", "case_name": null, "ratio": "A father, though being a natural guardian of a minor child, cannot take the child's custody by force and should seek custody only in accordance…", "summary": "The bench of Justice AD Jagadish Chandira and Justice B Karthikeyan thus directed a father to hand over his 2.5-year-old minor child to the mother.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-father-natural-guardian-but-no-forcible-custody-of-minor-child-557962", "priority": 65, "topics": ["Family & succession"], "date": "2026-11-11"}, {"id": "369af784f565", "source": "livelaw", "category": "high-court", "title": "AI-Generated Books For Public Libraries? Madras High Court Directs DVAC To Register FIR, Directs Freezing Of Publishers' Bank Accounts", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The Madras High Court, on Tuesday (November 10), directed the Directorate of Vigilance and Anti-Corruption to register an FIR in connection with the alleged scam in the procurement of books for public libraries. The court has also directed the authorities to take necessary steps to freeze the bank account of alleged fraudulent publishers.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-book-procurement-scam-dvac-directed-register-fir-freeze-bank-account-558026", "priority": 64, "topics": ["Criminal procedure (BNSS)"], "date": "2026-11-11"}, {"id": "3398f32b0c32", "source": "livelaw", "category": "high-court", "title": "Failure To Prove Penetrative Sexual Assault Warrants Modification Of Conviction: Tripura High Court Reduces POCSO Sentence", "court": "Tripura High Court", "case_name": null, "ratio": null, "summary": "The Tripura High Court has held that the prosecution's failure to establish penetrative sexual assault warrants modification of a conviction under Section 6 of the Protection of Children from Sexual Offences (POCSO) Act.", "url": "https://www.livelaw.in/high-court/tripura-high-court/tripura-high-court-reduces-pocso-conviction-aggravated-penetrative-sexual-assault-558000", "priority": 64, "topics": ["General"], "date": "2026-11-11"}, {"id": "f8e8ce644959", "source": "livelaw", "category": "high-court", "title": "RTI | Information Sought To Examine Recruitment Fairness Can't Be Denied For Failure To First Establish Irregularities: P&H High Court", "court": "Punjab & Haryana High Court", "case_name": null, "ratio": null, "summary": "The Punjab and Haryana High Court has set aside an order of the Haryana State Information Commission that refused to give an unsuccessful candidate the videography of the Band Skill Test in a Haryana Police recruitment.", "url": "https://www.livelaw.in/high-court/punjab-and-haryana-high-court/rti-information-sought-to-examine-recruitment-fairness-cant-be-denied-for-failure-to-first-establish-irregularities-ph-high-court-557949", "priority": 63, "topics": ["Property & land", "Service & administrative"], "date": "2026-11-11"}, {"id": "d1e5c90bc8d7", "source": "livelaw", "category": "high-court", "title": "Police Can't Restrict Licensed Bar Hotels' Operating Hours Merely Apprehending Drug Use: Kerala High Court", "court": "Kerala High Court", "case_name": null, "ratio": null, "summary": "The Kerala High Court on Tuesday (November 10) set aside the police notices issued to the manager of Kochi Radisson Blu hotel, an FL-3 licensed 5-star bar hotel, restricting its operation beyond 12:00 am and curtailing conduct of DJ parties after 11 pm.", "url": "https://www.livelaw.in/high-court/kerala-high-court/kerala-high-court-dj-party-police-notice-radisson-blu-hotel-557979", "priority": 63, "topics": ["Constitutional law", "Environment"], "date": "2026-11-11"}, {"id": "043787483b8b", "source": "livelaw", "category": "high-court", "title": "J&K&L High Court Quashes FIR Over Railway Contract Dispute; Says Signing Agreement In Own Capacity Without Claiming Authority Is Not Forgery", "court": "Jammu & Kashmir and Ladakh High Court", "case_name": null, "ratio": null, "summary": "The Court held that an agreement executed by Mohd. Ashraf Beigh on October 16, 2021, could not be treated as a forged document merely because he allegedly lacked authority to execute it on behalf of a private construction company. The agreement itself disclosed that he was representing the company as the father of its Managing Director, and nowhere claimed that he held any independent authorisation to act on its behalf.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/jk-high-court-quashes-fir-over-railway-tunnel-sub-contract-dispute-says-signing-agreement-in-own-capacity-without-claiming-authority-does-not-amount-to-forgery-557925", "priority": 63, "topics": ["Criminal procedure (BNSS)", "Contract & commercial"], "date": "2026-11-11"}, {"id": "f4037f839894", "source": "livelaw", "category": "high-court", "title": "Calcutta High Court Dismisses Fresh Plea Against Demolition Of 'Illegal' Building, Says Pending Appeal Does Not Automatically Stay Court's Order", "court": "Calcutta High Court", "case_name": null, "ratio": null, "summary": "The Calcutta High Court has dismissed a fresh writ petition filed by a man challenging an order directing him to demolish his allegedly illegal building, observing that the mere pendency of an appeal against the demolition direction does not operate as a stay of the order.", "url": "https://www.livelaw.in/high-court/calcutta-high-court/calcutta-high-court-dismisses-fresh-plea-against-demolition-of-illegal-building-says-pending-appeal-does-not-automatically-stay-courts-order-558017", "priority": 63, "topics": ["Constitutional law"], "date": "2026-11-11"}, {"id": "435ce65176e7", "source": "sccblog", "category": "judiciary", "title": "ITAT Kolkata allows depreciation on goodwill of ₹3,562.41 crore and other intangibles arising on demerger; Deletes ₹8.82 crore S. 14A disallowance", "court": null, "case_name": null, "ratio": null, "summary": "The Income Tax Appellate Tribunal, Kolkata: Bench “C”, comprising Rajesh Kumar, AM and Pradip Kumar Choubey, JM , in an appeal filed by Tata Consumer Products Ltd. against the assessment order for Assessment Year 2020—2021, held that depreciation was allowable under Section 32 , Income-tax Act, 1961 on goodwill, brands and distribution network arising upon.", "url": "https://www.scconline.com/blog/post/2026/11/10/itat-kolkata-goodwill-depreciation-on-demerger-tata-consumer-products/", "priority": 61, "topics": ["Tort, consumer & mot
