ipura High Court", "case_name": null, "ratio": null, "summary": "The Tripura High Court has held that the prosecution's failure to establish penetrative sexual assault warrants modification of a conviction under Section 6 of the Protection of Children from Sexual Offences (POCSO) Act.", "url": "https://www.livelaw.in/high-court/tripura-high-court/tripura-high-court-reduces-pocso-conviction-aggravated-penetrative-sexual-assault-558000", "priority": 64, "topics": ["General"], "date": "2026-11-11"}, {"id": "f8e8ce644959", "source": "livelaw", "category": "high-court", "title": "RTI | Information Sought To Examine Recruitment Fairness Can't Be Denied For Failure To First Establish Irregularities: P&H High Court", "court": "Punjab & Haryana High Court", "case_name": null, "ratio": null, "summary": "The Punjab and Haryana High Court has set aside an order of the Haryana State Information Commission that refused to give an unsuccessful candidate the videography of the Band Skill Test in a Haryana Police recruitment.", "url": "https://www.livelaw.in/high-court/punjab-and-haryana-high-court/rti-information-sought-to-examine-recruitment-fairness-cant-be-denied-for-failure-to-first-establish-irregularities-ph-high-court-557949", "priority": 63, "topics": ["Property & land", "Service & administrative"], "date": "2026-11-11"}, {"id": "d1e5c90bc8d7", "source": "livelaw", "category": "high-court", "title": "Police Can't Restrict Licensed Bar Hotels' Operating Hours Merely Apprehending Drug Use: Kerala High Court", "court": "Kerala High Court", "case_name": null, "ratio": null, "summary": "The Kerala High Court on Tuesday (November 10) set aside the police notices issued to the manager of Kochi Radisson Blu hotel, an FL-3 licensed 5-star bar hotel, restricting its operation beyond 12:00 am and curtailing conduct of DJ parties after 11 pm.", "url": "https://www.livelaw.in/high-court/kerala-high-court/kerala-high-court-dj-party-police-notice-radisson-blu-hotel-557979", "priority": 63 ll to rethink and allow the Justice Kurian Joseph Committee on Union-State Relations to complete its work.", "url": "https://www.thehindu.com/opinion/editorial/without-any-rationale-on-the-disbanding-of-the-justice-kurian-joseph-committee/article71686725.ece/", "priority": 74, "topics": ["General"], "date": "2026-11-11"}, {"id": "5d597a1830e5", "source": "livelaw", "category": "supreme-court", "title": "Hindu Succession | Grandson Has No Birthright In Property Devolved On Father In Partition Of Grandfather's Estate : Supreme Court", "court": "Supreme Court", "case_name": "J Rajesh (Minor) Thr His Mother and Natural Guardian J Gomathi v. M Kumaran (Dead) Thr LRs & Ors", "ratio": "A son who inherits his father's property under Section 8 takes it absolutely, and that his own son has no right by birth in it.", "summary": "The Supreme Court held that once the grandfather's property devolved on his Class I heirs under Section 8 of the Hindu Succession Act, 1956, and was partitioned among them, the share allotted to the father became his exclusive property in his individual capacity, and that the grandson has no right by birth in such property.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1148-j-rajesh-minor-thr-his-mother-and-natural-guardian-j-gomathi-v-m-kumaran-dead-thr-lrs-ors-557963", "priority": 100, "topics": ["Civil procedure (CPC)", "Property & land", "Family & succession"], "date": "2026-11-10"}, {"id": "3bc337a154a7", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Directs UP Gov To Identify Undertrials Granted Bail But Haven't Been Released From Jail In 75 Districts", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court has stated that the exercise would cover all undertrial prisoners irrespective of whether they have engaged a private lawyer or have sought assistance of the District Legal Services Authority(DLSA). Further, it must be carried out with the help of the concerned DLSA.", "url
