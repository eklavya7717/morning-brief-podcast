<script>
const DATA=[{"id": "fa83adee035d", "source": "livelaw", "category": "supreme-court", "title": "Accidental Gunshot Injury From Own Gun Qualifies For War Injury Pension: Supreme Court", "court": "Supreme Court", "case_name": "JC-377745M Ex Sub Maj & Hony Lt Devi Singh v. Union of India & Ors", "ratio": "An injury cannot be classified as self-inflicted merely because the bullet was discharged from the serviceman's own weapon.", "summary": "The Court clarified that an injury cannot be classified as self-inflicted merely because the bullet was discharged from the serviceman's own weapon. The exclusion of self-inflicted injuries does not cover every accidental injury involving one's own weapon.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1185-jc-377745m-ex-sub-maj-hony-lt-devi-singh-v-union-of-india-ors-559412", "priority": 100, "topics": ["BNSS / CrPC"], "note": {"Facts": "The Court clarified that an injury cannot be classified as self-inflicted merely because the bullet was discharged from the serviceman's own weapon. The exclusion of self-inflicted injuries does not cover every accidental injury involving one's own weapon.", "Held": "An injury cannot be classified as self-inflicted merely because the bullet was discharged from the serviceman's own weapon.", "Principle": "An injury cannot be classified as self-inflicted merely because the bullet was discharged from the serviceman's own weapon."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-22"}, {"id": "798badf85ecc", "source": "livelaw", "category": "supreme-court", "title": "Magistrate Must Give Reasons When Ordering FIR Despite Police Report Of 'No Offence': Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": "A Magistrate who rejects a police report stating that no cognizable offence is made out must record reasons for doing so before directing registration of…", "summary": "The Supreme Court has recently held that a Magistrate who rejects a police report stating that no cognizable offence is made out must record reasons for doing so before directing registration of an FIR under Section 156(3) of the Code of Criminal Procedure, 1973 (CrPC, now Section 175(3) of the Bharatiya Nagarik Suraksha Sanhita.", "url": "https://www.livelaw.in/supreme-court/magistrate-must-give-reasons-when-ordering-fir-despite-police-report-of-no-offence-supreme-court-559470", "priority": 100, "topics": ["BNSS / CrPC"], "note": {"Facts": "A group of landowners complained to the Delhi Economic Offences Wing (EOW) that a developer and its lenders had cheated them. The EOW, after a preliminary enquiry, filed an Action Taken Report (ATR) stating that no cognizable offence was made out. The complainants approached a Magistrate under Section 156(3) CrPC, and despite the ATR, the Magistrate ordered registration of an FIR. The High Court refused to quash the FIR; the appellants then appealed to the Supreme Court.", "Issue": "Whether a Magistrate must give reasons when he rejects a police report/ATR stating that no cognizable offence is made out and directs registration of an FIR under Section 156(3) CrPC (now Section 175(3) BNSS).", "Held": "The Supreme Court held that a Magistrate who rejects the police’s conclusion must record reasons relating to the material before ordering an FIR. Failure to do so renders the order “without application of mind” and is liable to be set aside.", "Principle": "A judicial authority exercising discretion under Section 156(3) CrPC must apply its judicial mind and give a reasoned order when its conclusion diverges from the investigative agency’s report; the reasons need not be elaborate but must exist and be linked to the material.", "Provisions": "- Section 156(3) CrPC (now Section 175(3) BNSS) – power to order investigation. - Action Taken Report (ATR) – not a Section 173 CrPC report (now Section 193 BNSS) and not binding, but must be considered. - References: *Lalita Kumari v. Government of UP*, *Maksud Saiyed v. State of Gujarat*, *Priyanka Srivastava v. State of UP*, *Anurag Bhatnagar v. State (NCT of Delhi)*, *SN Vijayalakshmi v. State of Karnataka*.", "Exam angle": "Test on the CrPC (or BNSS) – Section 156(3) discretion and the duty to give reasons; could be asked as “What is the requirement of reasoned orders when a Magistrate orders FIR under Section 156(3) despite police’s ATR?” – focus on judicial mind, ATR vs. Section 173 report, and relevant case law."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-22"}, {"id": "87fdb485f151", "source": "livelaw", "category": "legislation", "title": "2019 Amendment Enhancing Minimum Punishment Under POCSO Act Not Retrospective: Tripura High Court", "court": "Tripura High Court", "case_name": "Miithun v. State of Tripura", "ratio": null, "summary": "The Tripura High Court has reduced the sentence of a man convicted under the POCSO Act from 20 years to 10 years after finding that the Trial Court had applied the enhanced minimum punishment introduced by the 2019 amendment to an offence committed before the amendment came into force. Section 6 of the POCSO Act prescribes the punishment for aggravated penetrative sexual assault.", "url": "https://www.livelaw.in/high-court/tripura-high-court/tripura-high-court-corrects-trial-court-retrospective-application-2019pocso-amendment-559386", "priority": 97, "topics": ["BNSS / CrPC", "Probation / JJ / POCSO / DV", "Interpretation of statutes"], "note": {"Facts": "A man was convicted for aggravated penetrative sexual assault committed before the 2019 amendment and was sentenced to 20 years by the Trial Court.", "Issue": "Whether the enhanced minimum punishment introduced by the 2019 amendment to the POCSO Act can be applied retrospectively to offences committed before its commencement.", "Held": "The Tripura High Court reduced the sentence to 10 years, holding that the amendment is not retrospective and cannot be applied to the earlier offence.", "Principle": "An amendment increasing the minimum punishment under the POCSO Act is prospective and cannot be imposed on offences that occurred before the amendment’s commencement.", "Provisions": "Section 6 of the POCSO Act (as amended); 2019 amendment to the POCSO Act; no other cases cited.", "Exam angle": "POCSO Act – issue of retrospective application of statutory amendments; could be asked on the principle that enhanced punishments are not retrospective and the ingredients of Section 6."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts", "Interpretation"], "acts": ["BNSS / CrPC", "Probation / JJ / POCSO / DV", "Interpretation of statutes"], "landmark": false, "boost": 14}, "date": "2026-11-22"}, {"id": "bed36671182d", "source": "livelaw", "category": "supreme-court", "title": "Limitation Act | Delay Must Be Assessed On Cumulative Circumstances, Not Isolated Reasons: Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": "While considering an application for condonation of delay, factors such as administrative procedures, change of counsel…", "summary": "The Supreme Court has held that while considering an application for condonation of delay, factors such as administrative procedures, change of counsel, and procurement of certified copies cannot.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1186-delhi-development-authority-vsudarshan-manjhi-ors-559434", "priority": 94, "topics": ["Limitation / Registration"], "note": {"Facts": "The Supreme Court has held that while considering an application for condonation of delay, factors such as administrative procedures, change of counsel, and procurement of certified copies cannot.", "Held": "While considering an application for condonation of delay, factors such as administrative procedures, change of counsel…", "Principle": "While considering an application for condonation of delay, factors such as administrative procedures, change of counsel…", "Provisions": "Observed that the delay caused due to administrative hurdles, change of counsel cannot justify delay, however, such factors cannot be viewed in isolation rath"}, "syllabus": {"clusters": ["Property"], "acts": ["Limitation / Registration"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "8694046dabf2", "source": "livelaw", "category": "supreme-court", "title": "Non-Participant In Auction Cannot Seek Award By Making Higher Offer Later : Supreme Court", "court": "Supreme Court", "case_name": "M/s Kalindi Associates v. M/s Bharat Commerce and Industries Limited & Ors", "ratio": null, "summary": "The Supreme Court held that a person who did not participate in an auction and is a stranger to it acquires no locus or right to seek confirmation of the bid in his favour merely by offering a higher price at a later stage.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1187-ms-kalindi-associates-v-ms-bharat-commerce-and-industries-limited-ors-559450", "priority": 88, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-22"}, {"id": "c434276bef22", "source": "livelaw", "category": "high-court", "title": "'Stringent Bail Conditions Under PMLA Cannot Override Constitutional Right To Personal Liberty': Jharkhand High Court", "court": "Jharkhand High Court", "case_name": "Basudeb Bagchi and Anr. v. Directorate of Enforcement", "ratio": "The stringent bail conditions prescribed under Section 45 of the Prevention of Money Laundering Act, 2002 (PMLA)…", "summary": "The Court observed that prolonged pre-trial incarceration, particularly where the trial is unlikely to conclude within a reasonable period, constitutes a substantial ground for granting bail notwithstanding the restrictions under the PMLA.", "url": "https://www.livelaw.in/high-court/jharkhand-high-court/jharkhand-high-court-grants-bail-two-accused-prayag-group-money-laundering-case-559215", "priority": 83, "topics": ["BNSS / CrPC", "Constitution"], "note": {"Facts": "The Jharkhand High Court granted bail to two accused in a money-laundering case (Prayag Group) after they had been in pre-trial custody for a prolonged period, noting that no chargesheet was filed in the predicate offences and that the Supreme Court had already granted them bail in a related PMLA case.", "Issue": "Whether the stringent bail conditions under Section 45 of the Prevention of Money Laundering Act, 2002 can override the constitutional right to personal liberty under Article 21 of the Constitution.", "Held": "The Court allowed bail, holding that Section 45’s restrictions cannot eclipse Article 21 and that prolonged pre-trial detention without a reasonable prospect of trial is a substantial ground for bail.", "Principle": "When pre-trial incarceration is likely to be indefinite or unduly prolonged, the statutory rigour of Section 45 PMLA yields to the constitutional guarantee of personal liberty under Article 21; bail must be granted to prevent punishment before conviction.", "Provisions": "Section 45, PMLA; Sections 3, 70, 4, PMLA; Article 21, Constitution of India; Supreme Court decisions (unnamed) on bail under Section 45.", "Exam angle": "PMLA – bail under Section 45 vis-à-vis Article 21; could be asked to frame the issue of “whether stringent statutory bail conditions can be relaxed on the ground of violation of personal liberty and right to speedy trial” and to list the ingredients (pre-trial detention length, absence of chargesheet, likelihood of early trial)."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Constitution"], "landmark": false, "boost": 13}, "date": "2026-11-22"}, {"id": "83b08c98d1d0", "source": "livelaw", "category": "high-court", "title": "Jharkhand High Court Directs Improvements To AIIMS Deoghar Infra In MP Nishikant Dubey's PIL, Cites Right To Healthcare", "court": "Jharkhand High Court", "case_name": "Nishikant Dubey v. Union of India and Ors", "ratio": "The effective functioning of tertiary healthcare institutions such as AIIMS Deoghar is intrinsically linked to the State's constitutional obligation under Article 21 of the Constitution", "summary": "The Jharkhand HC has held that the effective functioning of tertiary healthcare institutions such as AIIMS Deoghar is intrinsically linked to the State's constitutional obligation under Article 21 of the Constitution. The Court observed that access to hospital facilities and timely medical care forms an integral part of the right to life and that ensuring adequate infrastructure at such institutions is not merely an administrative matter.", "url": "https://www.livelaw.in/high-court/jharkhand-high-court/jharkhand-high-court-directs-improvement-aiims-deoghar-infrastructure-mp-nishikant-dubey-pil-559399", "priority": 79, "topics": ["Constitution"], "note": {"Facts": "A PIL filed by MP Nishikant Dubey sought directions to make AIIMS Deoghar fully functional, highlighting deficiencies in electricity, water, fire safety, land encroachments, a railway over-bridge and a diesel-storage tank.", "Issue": "Whether the State’s failure to provide adequate infrastructure to AIIMS Deoghar violates its constitutional obligation under Article 21 to ensure the right to life-including access to timely medical care.", "Held": "The Jharkhand High Court directed the State to remedy the identified infrastructure gaps within stipulated time-frames and disposed of the PIL, noting that the State had begun remedial steps.", "Principle": "Effective functioning of tertiary-care institutions is integral to the fulfillment of the State’s constitutional duty under Article 21; therefore, ensuring essential infrastructure (electricity, water, fire safety, etc.) is a justiciable aspect of the right to life.", "Provisions": "Article 21 of the Constitution; no specific statutory sections or case citations were mentioned in the source.", "Exam angle": "Article 21 (right to life) – could be asked on how the right to health care is interpreted as part of life, focusing on the State’s duty to provide functional medical infrastructure."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "ac90ea89ff95", "source": "livelaw", "category": "high-court", "title": "Family Courts And High Courts Can't Grant Divorce Solely On Ground Of Irretrievable Breakdown Of Marriage: Telangana High Court", "court": "Telangana High Court", "case_name": null, "ratio": "A High Court or Family Court cannot grant a decree of divorce solely on the ground of irretrievable breakdown of marriage…", "summary": "The ruling: A High Court or Family Court cannot grant a decree of divorce solely on the ground of irretrievable breakdown of marriage….", "url": "https://www.livelaw.in/high-court/telangana-high-court/telangana-high-court-grant-divorce-solely-ground-irretrievable-breakdown-559394", "priority": 78, "topics": ["CPC", "Hindu / Muslim law"], "note": {"Facts": "The Telangana High Court considered whether a decree of divorce could be granted solely on the ground of irretrievable breakdown of marriage.", "Issue": "Can a High Court or Family Court grant divorce on the sole ground of irretrievable breakdown of marriage under the Hindu Marriage Act, 1955?", "Held": "The Court held that divorce cannot be granted solely on that ground, though it may be taken into account along with other factors when deciding a divorce appeal.", "Principle": "A decree of divorce must rest on statutory grounds; irretrievable breakdown alone is not a sufficient ground under the Hindu Marriage Act, 1955.", "Provisions": "Hindu Marriage Act, 1955 (no specific section cited); not stated.", "Exam angle": "Test on the Hindu Marriage Act – ask whether irretrievable breakdown is a standalone ground for divorce and the requirement to consider additional statutory grounds."}, "syllabus": {"clusters": ["Civil procedure", "Personal, local and constitutional"], "acts": ["CPC", "Hindu / Muslim law"], "landmark": false, "boost": 13}, "date": "2026-11-22"}, {"id": "f7b1d24d073e", "source": "livelaw", "category": "high-court", "title": "'Mere Position As School Principal Does Not Attract Liability U/S 19 POCSO Act Without Knowledge Of Offence': Patna High Court", "court": "Patna High Court", "case_name": "Amal Raj v. State of Bihar and Anr", "ratio": null, "summary": "The Patna HC has held that merely holding the position of Principal of a school does not automatically attract criminal liability under Sections 19 and 21 of the Protection of Children from Sexual Offences Act, 2012 (POCSO Act), unless there is material establishing knowledge or apprehension of the commission of a sexual offence and a consequent failure to discharge the statutory duty to report it.", "url": "https://www.livelaw.in/high-court/patna-high-court/patna-high-court-school-principal-liability-pocso-act-without-proof-of-knowledge-559398", "priority": 78, "topics": ["BNS / IPC", "BNSS / CrPC", "Probation / JJ / POCSO / DV"], "note": {"Facts": "The FIR alleged sexual harassment of a minor by two sports teachers; the school principal was later added as accused without any allegation of his knowledge or involvement.", "Issue": "Whether a school principal can be held liable under Sections 19 and 21 of the POCSO Act (and related provisions) merely by virtue of his position, absent proof of knowledge or apprehension of the offence.", "Held": "The Patna High Court quashed the cognizance order and all criminal proceedings against the principal, holding that his mere position does not attract liability under Sections 19, 21, 17 of the POCSO Act or Section 75 of the JJ Act without material showing knowledge, apprehension, abetment or culpable omission.", "Principle": "Liability under Section 19 POCSO (and the attendant punishment under Section 21) arises only when the person had actual knowledge or a reasonable apprehension of the offence and willfully failed to report it; mere positional authority without such knowledge is insufficient for criminal prosecution.", "Provisions": "Sections 19, 21, 17 of the Protection of Children from Sexual Offences Act, 2012; Section 75 of the Juvenile Justice (Care and Protection of Children) Act, 2015; Section 528 of the Bharatiya Nagarik Suraksha Sanhita, 2023; reference to the Patna High Court judgment (Justice Sunil Dutta Mishra).", "Exam angle": "POCSO Act – focus on the statutory duty to report (Sec. 19) and its conditions; could be asked as an issue-framing question on “when does a person in a position of authority attract criminal liability under Sec. 19/21 POCSO?” or as an ingredient-based question testing knowledge/apprehension requirement."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts"], "acts": ["BNS / IPC", "BNSS / CrPC", "Probation / JJ / POCSO / DV"], "landmark": false, "boost": 13}, "date": "2026-11-22"}, {"id": "ae4f2c9bfb8b", "source": "livelaw", "category": "high-court", "title": "Refunding Money To Customers Does Not Wipe Out Banking Misconduct: Calcutta High Court Upholds SBI Employee's Removal", "court": "Calcutta High Court", "case_name": null, "ratio": "A bank employee was required to follow prescribed procedures while handling customers' accounts, irrespective of whether the Bank ultimately suffered monetary loss", "summary": "The Calcutta High Court has refused to interfere with the dismissal of a former State Bank of India (SBI) employee who was found guilty of five out of six charges relating to alleged irregularities.", "url": "https://www.livelaw.in/high-court/calcutta-high-court/refunding-money-to-customers-does-not-wipe-out-banking-misconduct-calcutta-high-court-upholds-sbi-employees-removal-559358", "priority": 77, "topics": ["BNSS / CrPC"], "note": {"Facts": "A former SBI Customer Assistant was dismissed after a departmental enquiry proved five of six charges of irregular handling of customers’ accounts, including unauthorized debits and disbursements, despite later refunds of the amounts.", "Issue": "Whether the refund of monies or the absence of financial loss can negate the misconduct and render the removal from service disproportionate.", "Held": "The Calcutta High Court dismissed the writ petition and upheld the removal, holding that refund or regularisation does not erase the misconduct already committed.", "Principle": "Refund of money or lack of loss does not extinguish the liability for misconduct; a bank employee must follow prescribed procedures, and repeated unauthorized actions constitute major misconduct justifying removal.", "Provisions": "not stated.", "Exam angle": "Could be asked under the Banking Regulation Act/Banking Service Rules – focusing on disciplinary procedure, the test of misconduct versus loss, and the proportionality of penalty."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-22"}, {"id": "659caee268a2", "source": "sccblog", "category": "high-court", "title": "Negative Phenolphthalein Test does not help accused when bribe money is placed at his direction: Kerala HC", "court": null, "case_name": null, "ratio": null, "summary": "Kerala High Court : The present appeal was filed against the judgment of the Enquiry Commissioner and Special Judge, Kottayam, convicting the appellant, a former Assistant Engineer of Arakulam Gram Panchayat, for offences relating to demand and acceptance of illegal gratification under Sections 7 and 13(1)(d) read with Section 13(2) of the Prevention of Corruption.", "url": "https://www.scconline.com/blog/post/2026/11/21/negative-phenolphthalein-test-bribery-case-kerala-hc/", "priority": 76, "topics": ["NDPS / SC-ST / PC / others"], "note": {"Facts": "The appellant, a former Assistant Engineer of Arakulam Gram Panchayat, was accused of demanding and accepting illegal gratification for passing a bill on a pond construction; the complainant placed the bribe money in the measurement book (M-book) at the appellant’s direction, after which a vigilance team recovered it.", "Issue": "Whether the absence of a colour change on the appellant’s hands in a phenolphthalein test defeats the prosecution’s case of demand and acceptance of illegal gratification.", "Held": "The Kerala High Court held that the negative phenolphthalein test does not discredit the prosecution’s case, as the money was placed in the M-book on the appellant’s direction and he was apprehended before any further handling.", "Principle": "A negative phenolphthalein test on the accused’s hands does not defeat proof of demand and acceptance of illegal gratification when the money is shown to have been placed at the accused’s direction; demand and acceptance can be established by oral, documentary or circumstantial evidence.", "Provisions": "Sections 7 and 13(1)(d) read with Section 13(2) of the Prevention of Corruption Act, 1988; Section 120-B of the Indian Penal Code, 1860; cited cases: judgment of the Enquiry Commissioner and Special Judge, Kottayam; High Court judgment of A. Badharudeen, J.", "Exam angle": "Questions may test the Prevention of Corruption Act – how demand and acceptance of illegal gratification are proved; focus on evidentiary issues such as the relevance of chemical tests (phenolphthalein) and the weight of oral/circumstantial evidence."}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NDPS / SC-ST / PC / others"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "8ffa4591bf34", "source": "sccblog", "category": "high-court", "title": "Patna HC holds Permanent Lok Adalat lacks jurisdiction to record land dispute compromise; Sets aside award as void ab initio", "court": null, "case_name": null, "ratio": null, "summary": "Patna High Court: In a writ petition seeking modification of an award passed by the Permanent Lok Adalat, Sasaram, Rohtas, to incorporate a portion of land allegedly omitted due to a typographical mistake, a Single Judge Bench of G. Anupama Chakravarthy, J. , held that a Permanent Lok Adalat has no jurisdiction to record a.", "url": "https://www.scconline.com/blog/post/2026/11/21/pat-hc-permanent-lok-adalat-lacks-jurisdiction-over-land-dispute-compromises/", "priority": 76, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "c5b074244e3a", "source": "sccblog", "category": "high-court", "title": "State cannot renege on binding sale of Ballygunge land only because of change in regime: Calcutta HC", "court": null, "case_name": null, "ratio": null, "summary": "Calcutta High Court: In an appeal by the State of Mizoram challenging the Single Judge’s order that set aside the cancellation of an e-tender for the sale of government land in Ballygunge, Kolkata, the Division Bench of Arijit Banerjee* and Apurba Sinha Ray, JJ., dismissed the appeal and held that the State had failed to.", "url": "https://www.scconline.com/blog/post/2026/11/21/calcutta-hc-tender-cancellation-after-change-of-government/", "priority": 76, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "fbfba493119c", "source": "livelaw", "category": "high-court", "title": "Mother's Employment-Related Travel Not Grounds To Deny Child Custody When Father Is Also Busy Professional: Chhattisgarh High Court", "court": "Chhattisgarh High Court", "case_name": "Dr. Santosh Bhardwaj v. Smt", "ratio": "A mother's travel in connection with her government employment cannot, by itself…", "summary": "The Chhattisgarh High Court has held that a mother's travel in connection with her government employment cannot, by itself, be a ground to conclude that she is incapable of looking after her child.", "url": "https://www.livelaw.in/high-court/chhattisgarh-high-court/mother-travel-not-ground-deny-child-custody-when-father-busy-professional-559397", "priority": 75, "topics": ["Hindu / Muslim law"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "2774c7804e34", "source": "livelaw", "category": "high-court", "title": "Rajasthan High Court Defers Interim Relief On IAS Officer Shikhar Agrawal's Plea In Corruption Case Over Luxury Villas", "court": "Rajasthan High Court", "case_name": "Shikhar Agrawal v. State of Rajasthan", "ratio": null, "summary": "Rajasthan High Court judgment in Shikhar Agrawal v. State of Rajasthan.", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-denies-interim-relief-ias-officer-shikhar-agarwal-corruption-case-559384", "priority": 73, "topics": ["Rajasthan laws"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Rajasthan laws"], "landmark": false, "boost": 8}, "date": "2026-11-22"}, {"id": "794c1eee1716", "source": "livelaw", "category": "high-court", "title": "Father's Duty To Educate Child Can't Be Made A Tool For Oppression, Socio-Economic Condition Of Parents Relevant: Allahabad High Court", "court": "Allahabad High Court", "case_name": null, "ratio": "While a father is responsible for educating his child in a good and reputed institution commensurate with his means…", "summary": "The Allahabad High Court has held that while a father is responsible for educating his child in a good and reputed institution commensurate with his means, that responsibility cannot be made a tool for oppression, and the socio-economic condition of the parents must also be looked into while fixing maintenance and educational expenses under Section 26 of the Hindu Marriag ": 72, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-22"}, {"id": "65f5114f5935", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Rejects Plea Seeking Maintenance Of Police Database On Persons Making Repeated Sexual Offense Complaints", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court today refused to entertain a plea seeking a structured database of complainants who lodge multiple sexual-offence cases. Underlining the need to protect identity of victims/complainants, as well as referring to existing identification mechanisms, the Court dismissed the plea.", "url": "https://www.livelaw.in/top-stories/supreme-court-sexual-offenses-plea-seeking-database-of-persons-making-repeated-complaints-rejected-2-layer-identification-mechanism-in-place-559308", "priority": 100, "topics": ["Hindu / Muslim law"], "note": {"Facts": "A petitioners’ PIL sought a structured police database of complainants filing multiple sexual-offence complaints; the Delhi High Court had directed the police to consider the request, and the petitioners approached the Supreme Court.", "Issue": "Whether a police-maintained database of identities of complainants in sexual-offence cases should be created.", "Held": "The Supreme Court dismissed the plea, refusing to order such a database.", "Principle": "The Court held that existing two-layer identification mechanisms—mandatory medical examination with DNA profiling and recording of the victim’s statement before a Magistrate—already safeguard victim identity, and creating a police database would risk disclosure and is unnecessary.", "Provisions": "not stated.", "Exam angle": "Could be asked under the Criminal Law (Amendment) Act/IPC on sexual offences – focusing on victim-identity protection and the adequacy of existing procedural safeguards versus proposed police databases."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "aeca7412966b", "source": "livelaw", "category": "supreme-court", "title": "'Shocking The Conscience' Not Enough To Modify Arbitral Award: Supreme Court Restores Contractor's Claim Against Kolkata Port Trust", "court": "Supreme Court", "case_name": "M/s Marino Dredgeco Limited v. Board of Trustees of the Port of Kolkata", "ratio": "A court exercising jurisdiction under Section 37 of the Arbitration and Conciliation Act, 1996…", "summary": "The Supreme Court has set aside a Calcutta High Court judgment that reduced an arbitral award in favour of a dredging contractor by 50%, holding that a court exercising jurisdiction under Section.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1184-ms-marino-dredgeco-limited-versus-the-board-of-trustees-of-the-port-of-kolkata-559317", "priority": 100, "topics": ["Contract / Specific Relief"], "note": {"Facts": "The Supreme Court has set aside a Calcutta High Court judgment that reduced an arbitral award in favour of a dredging contractor by 50%, holding that a court exercising jurisdiction under Section.", "Held": "A court exercising jurisdiction under Section 37 of the Arbitration and Conciliation Act, 1996…", "Principle": "A court exercising jurisdiction under Section 37 of the Arbitration and Conciliation Act, 1996…", "Provisions": "Provision: Section 37 of the Arbitration and Conciliation Act, 1996; Held that the High Court's conclusion that the claim for additional work, which exceeded 70% of the original contract value, shocked its conscience was no"}, "syllabus": {"clusters": ["Obligations"], "acts": ["Contract / Specific Relief"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "0e9b40a42c47", "source": "livelaw", "category": "supreme-court", "title": "Section 92 CPC Suit Doesn't Give Every Devotee An Automatic Right To Be Impleaded: Supreme Court", "court": "Supreme Court", "case_name": "Subhasindu Das & Ors v. Bacchu Ranjan Das & Ors", "ratio": null, "summary": "The Supreme Court on Thursday (November 19) held that a suit under Section 92 of the Code of Civil Procedure, 1908 (CPC) is representative in nature, but this does not give every devotee or member.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1181-subhasindu-das-ors-v-bacchu-ranjan-das-ors-etc-559259", "priority": 98, "topics": ["CPC"], "note": {"Facts": "The Supreme Court on Thursday (November 19) held that a suit under Section 92 of the Code of Civil Procedure, 1908 (CPC) is representative in nature, but this does not give every devotee or member.", "Held": "Bench: Justice Vikram Nath, Justice Sandeep Mehta, Justice Aparesh Kumar Singh"}, "syllabus": {"clusters": ["Civil procedure"], "acts": ["CPC"], "landmark": false, "boost": 12}, "date": "2026-11-21"}, {"id": "b95ab3912b15", "source": "livelaw", "category": "supreme-court", "title": "UP Urban Tenancy Act 2021 | Pending Petitions Shouldn't Be Dismissed : Supreme Court To Examine HC Verdict Striking Down Law", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court on Friday issued notice on a special leave petition against the Allahabad High Court's August ruling that struck down key provisions of the Uttar Pradesh Regulation of Urban .", "url": "https://www.livelaw.in/top-stories/up-urban-tenancy-act-2021-pending-petitions-shouldnt-be-dismissed-supreme-court-to-examine-hc-verdict-striking-down-law-559354", "priority": 95, "topics": ["Transfer of Property"], "note": {"Facts": "The Allahabad High Court struck down Sections 8, 9, 10, 38 and 42 of the Uttar Pradesh Regulation of Urban Premises Tenancy Act, 2021, declaring them ultra vires and quashing an eviction order passed under the Act; the Supreme Court has issued notice on a Special Leave Petition and stayed dismissal of pending proceedings under the Act during the SLP.", "Issue": "Whether pending proceedings under the impugned provisions of the UP Regulation of Urban Premises Tenancy Act, 2021 can be dismissed as non-maintainable in view of the High Court’s declaration of those provisions as unconstitutional.", "Held": "The Supreme Court directed that, pending the SLP, proceedings under the relevant provisions of the 2021 Act shall not be dismissed as non-maintainable or abated.", "Principle": "A declaration of unconstitutionality of statutory provisions does not automatically render all pending proceedings under those provisions non-maintainable; they may continue until the higher court’s final decision on the validity of the provisions.", "Provisions": "Sections 8, 9, 10, 38, 42 (U.P. Act No 16 of 2021); Section 21(2) (U.P. Act); Article 254(2) of the Constitution; Transfer of Property Act 1882; Provincial Small Causes Courts Act 1887; 1972 Uttar Pradesh Urban Buildings (Regulation of Letting, Rent and Eviction) Act.", "Exam angle": "UP Regulation of Urban Premises Tenancy Act 2021 – test on repugnancy under Article 254(2) with the Transfer of Property Act 1882 and the Provincial Small Causes Courts Act 1887; focus on validity of State legislation without Presidential assent and the effect of a High Court’s striking-down on pending proceedings."}, "syllabus": {"clusters": ["Property"], "acts": ["Transfer of Property"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "44fceb7fd805", "source": "livelaw", "category": "supreme-court", "title": "In Case Of Child Born To Unwed Parents, Mother Has Better Prima Facie Claim Of Custody : Supreme Court", "court": "Supreme Court", "case_name": "Helena Anna Maria Lersch v. State of Goa & Anr", "ratio": null, "summary": "The Court clarified that the determination was confined to the mother's prima facie claim for interim custody and would not affect the Family Court's independent adjudication of the pending guardianship proceedings.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1179-helena-anna-maria-lersch-v-state-of-goa-anr-559225", "priority": 94, "topics": ["Hindu / Muslim law"], "note": {"Facts": "The Court clarified that the determination was confined to the mother's prima facie claim for interim custody and would not affect the Family Court's independent adjudication of the pending guardianship proceedings.", "Held": "Bench: Justice Nongmeikapam Kotiswar Singh, Justice N.V. Anjaria", "Provisions": "Noted that Section 6(b) of the Hindu Minority and Guardianship Act, 1956, specifically accords primacy to the mother over the father in respect of the natu"}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "f2d7c07fc7fb", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Awards Rs 10 Lakh Each To Two School Clerks For Wrongful Dismissal, Notes Poor Drafting Defeated Their Claim In HC", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court recently directed a private school to pay Rs 10 Lakh each to two clerks as compensation for the wrongful termination of their services, noting that their case had failed in the High Court because of poor drafting of the writ petitions.", "url": "https://www.livelaw.in/top-stories/supreme-court-awards-two-terminated-school-clerks-559289", "priority": 92, "topics": ["Constitution"], "note": {"Facts": "Two clerks of a private school were terminated after an inquiry (under the Maharashtra Employees of Private Schools (Conditions of Service) Rules, 1981) in which they did not participate and were not furnished the inquiry reports. The School Tribunal stayed the termination but later dismissed their appeals, and the High Court dismissed their writ petitions under Article 226, holding they were not on the same footing as the headmaster.", "Issue": "Whether the Supreme Court can award compensation for wrongful termination despite the appellants’ poorly drafted writ petitions and the High Court’s dismissal.", "Held": "The Supreme Court exercised its power under Article 142 and directed the school to pay Rs 10 lakh each to the two clerks as lump-sum compensation for wrongful termination.", "Principle": "A party must plead all material averments in a writ petition; a court is not bound to entertain matters not pleaded. However, an order wholly contrary to an express judicial order is a nullity, and the Supreme Court may intervene under Article 142 to grant appropriate relief.", "Provisions": "Article 226, Article 142 of the Constitution; *Ram Saran Varshney v. State of U.P.* (cited). No specific statutory sections or rules are stated beyond the reference to the Maharashtra Employees of Private Schools (Conditions of Service) Rules, 1981.", "Exam angle": "Service-law question under the Maharashtra Employees of Private Schools Rules and constitutional remedies – could be asked on the scope of Article 226 vs. Article 142, or on the requirement of proper pleading in writ petitions."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "3ba816f79978", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Dismisses Karnataka Govt Plea To Restore Ban On Bike Taxis, Says Better To Regulate", "court": "Supreme Court", "case_name": null, "ratio": "Bike taxis cannot operate in the state unless the State government issues relevant guidelines and rules under the Motor Vehicles Act", "summary": "The Supreme Court has upheld the Karnataka High Court's January 23 order setting aside ban on bike taxis in the state. By the impugned order, the division bench of the HC had allowed a batch of appeals preferred by aggregators OLA, Uber, Rapido and others challenging the Bike Taxi ban in the State.", "url": "https://www.livelaw.in/top-stories/supreme-court-dismisses-karnataka-govt-plea-to-restore-ban-on-bike-taxis-in-karnataka-559292", "priority": 84, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": true, "boost": -2}, "date": "2026-11-21"}, {"id": "f3b3ddf9655d", "source": "livelaw", "category": "high-court", "title": "Rajasthan High Court Grants Interim Protection From Arrest To Asaram In FIR Over Delay In Surrendering After Parole", "court": "Rajasthan High Court", "case_name": "Asharam v. State of Rajasthan & Ors", "ratio": null, "summary": "Rajasthan High Court judgment in Asharam v. State of Rajasthan & Ors.", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-stays-asharam-arrest-fir-over-delayed-surrender-parole-expiry-559366", "priority": 82, "topics": ["BNSS / CrPC", "Rajasthan laws"], "note": {"Facts": "An FIR was lodged against Asaram for failing to surrender to prison within the stipulated time after his parole expired.", "Issue": "Whether the court should grant interim protection from arrest to Asaram pending the resolution of the quashing petition.", "Held": "The Rajasthan High Court, on a petition for quashing, granted interim protection from arrest to Asaram.", "Principle": "The court may order interim protection from arrest when a petition is pending and the prosecution requires time to obtain necessary alignment.", "Provisions": "not stated", "Exam angle": "Criminal Procedure Code – interim bail/protection; could be asked on the criteria for granting interim protection from arrest in pending criminal matters."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Rajasthan laws"], "landmark": false, "boost": 13}, "date": "2026-11-21"}, {"id": "7c9ab3bc6bd9", "source": "sccblog", "category": "high-court", "title": "Mere use of company’s name on counterfeit goods does not constitute copyright infringement; Bombay HC quashes FIR in JSW Steel case", "court": null, "case_name": null, "ratio": null, "summary": "Bombay High Court: While examining whether the sale of counterfeit tin sheets bearing the name of JSW Steel Ltd. amounts to copyright infringement under Sections 51 and 63 of the Copyright Act, 1957 , the Single Judge Bench of M. W.", "url": "https://www.scconline.com/blog/post/2026/11/20/company-name-on-counterfeit-goods-copyright-infringement-bombay-hc/", "priority": 80, "topics": ["BNSS / CrPC"], "note": {"Facts": "Counterfeit tin sheets bearing the name “JSW Steel Ltd.” were sold, and an FIR was filed alleging copyright infringement.", "Issue": "Whether the mere use of a company’s name on counterfeit goods amounts to infringement under Sections 51 and 63 of the Copyright Act, 1957.", "Held": "The Bombay High Court quashed the FIR, holding that such use does not constitute copyright infringement.", "Principle": "Use of a company’s name on counterfeit goods, without allegation of copying a copyright-protected artistic work or logo, falls outside the scope of copyright infringement and is instead a matter for trademark law.", "Provisions": "Sections 51, 63 of the Copyright Act, 1957; Section 104 of the Trade Marks Act, 1999; Section 528 of the Bharatiya Nagarik Suraksha Sanhita, 2023.", "Exam angle": "Test on the Copyright Act – distinction between copyright infringement and trademark infringement; could be asked to frame the issue or to list the ingredients for establishing infringement under Sections 51/63."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-21"}, {"id": "3c68e8df21e1", "source": "livelaw", "category": "supreme-court", "title": "Arbitrator Cannot Award Beyond Monetary Limit Of Dispute Referred To Arbitration: Supreme Court", "court": "Supreme Court", "case_name": "NEYCER (INDIA) LTD. v. GMB CERAMICS LTD", "ratio": null, "summary": "Adjudicating a matter under the Arbitration Act, 1940, a bench of Justice Dipankar Datta and Justice Satish Chandra Sharma held that an umpire cannot enlarge the scope of the reference by relying on subsequent correspondence or a party's reservation of rights to claim additional damages.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1183-neycer-india-ltd-vs-gmb-ceramics-ltd-559315", "priority": 79, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-21"}, {"id": "3852ab6c76e8", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Strikes Down UP Laws Excluding Work-Charged Employees' Pre-Regularisation Service From Pension", "court": "Supreme Court", "case_name": "Prem Singh v. State of Uttar Pradesh", "ratio": "Once an employee is regularised in public service under a duly formulated scheme…", "summary": "The Court noted that the laws were enacted to override its 2019 verdict.", "url": "https://www.livelaw.in/supreme-court/supreme-court-strikes-down-up-laws-excluding-work-charged-employees-pre-regularisation-service-from-pension-559244", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-21"}, {"id": "a63b8959bab4", "source": "livelaw", "category": "high-court", "title": "Marriage Between Hindu And Christian Can't Be Validated By Registration Under Hindu Marriage Act: Madras High Court", "court": "Madras High Court", "case_name": null, "ratio": "The marriage between a Hindu and a Non-Hindu cannot be solemnised under the Hindu Marriage Act and such a marriage cannot be validated by mere…", "summary": "The bench of Justice CV Karthikeyan and Justice S Raveekumar thus declared a marriage between a Christian man and a Hindu woman void, holding that the marriage could not.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-hindu-and-christian-not-solemnise-hindu-marriage-act-registration-not-validate-559365", "priority": 77, "topics": ["Hindu / Muslim law"], "note": {"Facts": "A Christian man and a Hindu woman were married and later sought validation of their marriage by registration under the Hindu Marriage Act.", "Issue": "Whether a marriage between a Hindu and a non-Hindu can be solemnised or validated under the Hindu Marriage Act merely by registration.", "Held": "The Madras High Court declared the marriage void, holding that such a marriage cannot be solemnised under the Hindu Marriage Act and cannot be validated by registration.", "Principle": "A marriage between a Hindu and a non-Hindu is not permissible under the Hindu Marriage Act and registration does not cure the invalidity.", "Provisions": "not stated.", "Exam angle": "Hindu Marriage Act – question on the requirement of both parties being Hindus (or belonging to religions specified in the Act) and the impossibility of validating an inter-religious marriage through registration."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "90919ca91b28", "source": "sccblog", "category": "high-court", "title": "Delhi High Court: Aadhaar Card Not Conclusive Proof of Date of Birth; ESIC Records Prevail in Superannuation Dispute", "court": null, "case_name": null, "ratio": null, "summary": "Delhi High Court: While considering a writ petition challenging the Labour Court’s award holding the termination of a workwoman’s services illegal for non-compliance with Section 25-F , Industrial Disputes Act, 1947 (ID Act), a Single Judge Bench of Manoj Kumar Ohri, J. , dismissed the petition, holding that the management had failed to establish that.", "url": "https://www.scconline.com/blog/post/2026/11/20/delhi-hc-aadhaar-date-of-birth-esic-records-superannuation/", "priority": 76, "topics": ["Constitution"], "note": {"Facts": "A workwoman claimed illegal termination; management argued she had attained superannuation (age 58) on 20 May 2017, relying on her Aadhaar card (DOB 20 May 1959). The Labour Court, using ESIC records (DOB 20 May 1960) furnished by management, held termination illegal for non-compliance with Section 25-F, ID Act.", "Issue": "Whether an Aadhaar card alone can be treated as conclusive proof of date of birth for the purpose of establishing superannuation and the legality of termination under Section 25-F, ID Act.", "Held": "The Delhi High Court dismissed the writ petition, holding that the Aadhaar card is not conclusive proof of date of birth; ESIC records, being earlier and supplied by management, were rightly preferred, and the termination without complying with Section 25-F was illegal.", "Principle": "An Aadhaar card, being based on self-declaration or supporting documents, is not conclusive evidence of date of birth; the party bearing the burden of proof must produce reliable documentary evidence, and a plausible finding based on such evidence cannot be disturbed by a writ court.", "Provisions": "Section 25-F, ID Act; Section 25-G, ID Act; Articles 226 & 227, Constitution of India; UIDAI Office Memorandum (20 Dec 2018); *Saroj v. Iffco-Tokio General Insurance Co.*, 2024 SCC OnLine SC 3038.", "Exam angle": "Industrial Disputes Act – test of superannuation age and compliance with Section 25-F; evidentiary rule that Aadhaar is not conclusive proof of DOB – could be asked as “What evidence is required to establish age for superannuation under ID Act?” or “How does the court treat Aadhaar as proof of DOB?”"}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "531a9d67d0a8", "source": "livelaw", "category": "supreme-court", "title": "Pan-India Case On Unauthorised Construction Shifted From Justice Amanullah's Bench", "court": "Supreme Court", "case_name": "Loganathan v. State of Tamil Nadu & Ors", "ratio": null, "summary": "The Supreme Court case concerning unauthorised constructions and commercial use of residential properties across the country has been shifted from a bench headed by Justice Ahsanuddin Amanullah.", "url": "https:/ was wrong to infer that the accused had.", "Held": "Bench: Justice JB Pardiwala, Justice K Vinod Chandran"}, "syllabus": {"clusters": ["Evidence and crime", "Property", "Special criminal Acts"], "acts": ["BNSS / CrPC", "Transfer of Property", "NDPS / SC-ST / PC / others"], "landmark": false, "boost": 14}, "date": "2026-11-20"}, {"id": "994e437b734a", "source": "livelaw", "category": "supreme-court", "title": "Recovery Of Victim's Ornaments Alone Cannot Prove Murder: Supreme Court Acquits Man", "court": "Supreme Court", "case_name": "Bheemanagouda @ Bheemajja v. State by Harapanahalli Police", "ratio": "The prosecution had failed to establish a complete and unbroken chain of circumstantial evidence as the recovery of victim's ornaments alone cannot prove murder.", "summary": "Bench: Justice Prashant Kumar Mishra, Justice Vipul M Pancholi", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1176-bheemanagouda-bheemajja-v-state-by-harapanahalli-police-559146", "priority": 100, "topics": ["BSA / Evidence", "BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Bench: Justice Prashant Kumar Mishra, Justice Vipul M Pancholi", "Held": "The prosecution had failed to establish a complete and unbroken chain of circumstantial evidence as the recovery of victim's ornaments alone cannot prove murder.", "Principle": "The prosecution had failed to establish a complete and unbroken chain of circumstantial evidence as the recovery of victim's ornaments alone cannot prove murder.", "Provisions": "Observed so while hearing an appeal filed against the Karnataka High Court's judgment which had upheld appellant's (accused) conviction under Section 302 Indi"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BSA / Evidence", "BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-20"}, {"id": "13cb703690db", "source": "livelaw", "category": "supreme-court", "title": "Lender Does Not Hold Mortgage Security In Trust For Borrower: Supreme Court Quashes FIR Over Alleged Use Of Land As Cross-Collateral", "court": "Supreme Court", "case_name": "Edelweiss Asset Reconstruction Company Limited v. State of NCT of Delhi & Ors", "ratio": null, "summary": "The Court observed that a lender taking a mortgage to secure repayment of its own loan holds the security for itself and not in the capacity of a banker entrusted with property belonging to a customer. Consequently, the offence of criminal breach of trust by a banker under Section 409 of the Indian Penal Code (IPC) cannot be invoked merely because a lender holds a mortgage over property offered as security for a loan.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1178-edelweiss-asset-reconstruction-company-limited-v-state-of-nct-of-delhi-ors-559186", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC", "Transfer of Property"], "note": {"Facts": "The Court observed that a lender taking a mortgage to secure repayment of its own loan holds the security for itself and not in the capacity of a banker entrusted with property belonging to a customer. Consequently, the offence of criminal breach of trust by a banker under Section 409 of the Indian Penal Code (IPC) cannot be invoked merely because a lender holds a mortgage over property offered as security for a loan.", "Held": "Bench: Justice Vikram Nath, Justice Sandeep Mehta"}, "syllabus": {"clusters": ["Evidence and crime", "Property"], "acts": ["BNS / IPC", "BNSS / CrPC", "Transfer of Property"], "landmark": false, "boost": 13}, "date": "2026-11-20"}, {"id": "cb9f7eea7b7c", "source": "sccblog", "category": "supreme-court", "title": "Appreciating the scope and dimensions of “surcharge” in taxation laws: Implications of Supreme Court’s larger Bench exposition on “surcharge” and “cess”", "court": null, "case_name": null, "ratio": null, "summary": "Introduction Tax on tax is economically frowned upon as it results into cascading effect. Whether such economic distortion can render the levy legally invalid is a different matter altogether. Giving short thrift to the debate, about five decades back the Supreme Court observed that “bad economics may be good law and vice versa ”, thereby.", "url": "https://www.scconline.com/blog/post/2026/11/19/supreme-court-larger-bench-surcharge-cess-taxation-laws/", "priority": 96, "topics": ["Constitution"], "note": {"Facts": "Arjun Flour Mills challenged a State levy that computed a surcharge on the sales-tax payable by a dealer, arguing it was in substance a tax on the dealer’s income and beyond State competence. The State contended it was merely a “surcharge” – an enhancement of the sales-tax rate.", "Issue": "Whether a levy that is computed as a percentage of the sales-tax payable is a valid surcharge (i.e., a sales-tax) or an unconstitutional tax on income/fiscal burden of the dealer.", "Held": "The Supreme Court held that the levy is a surcharge – an enhancement of the principal sales-tax – and therefore a valid sales-tax, not a tax on income. Consequently, while the surcharge is constitutionally valid, the Court barred States from levying it post-GST transition because the underlying sales-tax statutes have ceased to exist.", "Principle": "A surcharge, even if computed on the amount of another tax, retains the character of the principal levy; the method of computation does not alter the subject-matter of the tax.", "Provisions": "- Arjun Flour Mills v. State of Odisha (larger Bench) – cited. - State of Telangana v. Tirumala Construction – GST transition provision, Sec. 19, Constitution (101st Amendment) Act, 2016. - No specific statutory sections were quoted for the surcharge itself; the decision refers to the constitutional entry on “tax on sale or purchase of goods”.", "Exam angle": "Constitutional Law – State List (List II) power to tax sale or purchase of goods.* The question can be framed as: “Explain the scope of ‘surcharge’ under State taxation power and its limitation post-GST (Sec. 19, 101st Amendment).” This tests understanding of legislative competence, the distinction between surcharge and cess, and the effect of the GST transition on State levies."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": true, "boost": 16}, "date": "2026-11-20"}, {"id": "724da1b63ee5", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Quashes Mining Land Acquisition In Tribal Area, Holds Gram Sabha Consent Mandatory", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court held that Section 41(3) of the RFCTLARR Act was mandatory for acquisitions in scheduled areas.", "url": "https://www.livelaw.in/supreme-court/supreme-court-quashes-mining-land-acquisition-in-tribal-area-holds-gram-sabha-consent-mandatory-559049", "priority": 89, "topics": ["Transfer of Property"], "note": {"Facts": "The government sought to acquire land in scheduled village areas of Sundergarhi district, Odisha, for a Dalmia Cement plant, but the gram panchayats had rejected the proposal and no consent was recorded on Form M as required.", "Issue": "Whether prior consent of the gram panchayat/gram sabha under Section 41(3) of the Right to Fair Compensation and Transparency in Land Acquisition, Rehabilitation and Resettlement Act, 2013 is mandatory for land acquisition in scheduled areas, and whether its absence vitiates the acquisition.", "Held": "The Supreme Court set aside the acquisition proceedings, holding that the consent requirement under Section 41(3) is mandatory, not directory, and its non-compliance renders the acquisition void.", "Principle": "For land acquisition in scheduled areas, the statutory requirement of obtaining gram sabha consent under Section 41(3) of the 2013 Act is mandatory; failure to secure it cannot be cured later and invalidates the acquisition.", "Provisions": "Section 41(3), 2013 Act; Section 2(2)(b), 2013 Act (80% family consent for private company); Rule 41, Odisha Rules (Form M); Mines and Minerals (Development and Regulation) Act, 1957 (mining lease).", "Exam angle": "Test on the Right to Fair Compensation and Transparency in Land Acquisition Act, 2013 – focus on mandatory consent under Section 41(3) and its applicability to private-company projects in scheduled areas."}, "syllabus": {"clusters": ["Property"], "acts": ["Transfer of Property"], "landmark": false, "boost": 8}, "date": "2026-11-20"}, {"id": "2b4085639e49", "source": "livelaw", "category": "supreme-court", "title": "'Go And Tell The Chief Justice To Mind His Own Business': When A Judge Allowed Sons To Appear Before Him", "court": "Supreme Court", "case_name": "Purushottam Bhujade v. Sudhir Shikshan Sanstha & Ors", "ratio": null, "summary": "The Supreme Court traced the evolving law of bias and recalled that kinship was not regarded as a ground for bias at one point in time.", "url": "https://www.livelaw.in/top-stories/supreme-court-recalls-justice-badaurddin-tyabji-sons-appearing-law-of-bias-559056", "priority": 87, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "14b8740fc9a9", "source": "livelaw", "category": "supreme-court", "title": "Directions For Removal Of Highway Encroachments Can't Be Used To Demolish Structures Without Due Process : Supreme Court Clarifies Order", "court": "Supreme Court", "case_name": "RE: PHALODI ACCIDENT v. NATIONAL HIGHWAYS AUTHORITY OF INDIA & ORS", "ratio": "Its April directions to remove encroachments along National Highways cannot be used to demolish disputed structures without following due process of law", "summary": "The Supreme Court on Wednesday (November 18) clarified that its April directions to remove encroachments along National Highways cannot be used to demolish disputed structures without following due.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1171-in-re-phalodi-accident-versus-national-highways-authority-of-india-ors-559024", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "6001fe21a963", "source": "sccblog", "category": "high-court", "title": "Top Legal Developments [9-15 Nov 2026]: Digital Arrest Scams, GST, AI Deepfakes and More", "court": null, "case_name": null, "ratio": null, "summary": "This week witnessed significant judicial developments, with the Supreme Court calling for mandatory compensation to victims of cyber frauds where financial institutions fail to exercise due diligence, and clarifying when balance sheet entries can extend the limitation period. The High Courts delivered key rulings on GST input tax credit, AI-generated deepfakes, personality rights, social media.", "url": "https://www.scconline.com/blog/post/2026/11/19/weekly-legal-developments-india-9-15-november-2026/", "priority": 76, "topics": ["Limitation / Registration"], "note": {"Facts": "A three-Judge Bench of the Supreme Court examined digital arrest scams and other cyber frauds where victims lost money because their banks failed to exercise due diligence.", "Issue": "Whether financial institutions are required to compensate victims when cyber fraud occurs due to their lack of due diligence.", "Held": "The Court directed that banks must indemnify victims and pay compensation not less than the amount lost, and must adopt preventive safeguards such as suspending suspicious transactions, notifying police and physically verifying transactions.", "Principle": "A financial institution that fails to exercise due diligence and thereby enables a cyber fraud must compensate the victim for the full loss.", "Provisions": "not stated.", "Exam angle": "Likely framed under the Banking Regulation Act / RBI regulatory framework, testing the duty of banks to exercise due diligence and the remedy of mandatory compensation for cyber-fraud victims."}, "syllabus": {"clusters": ["Property"], "acts": ["Limitation / Registration"], "landmark": false, "boost": 8}, "date": "2026-11-20"}, {"id": "91bf476cb36b", "source": "livelaw", "category": "supreme-court", "title": "Maharashtra Entertainment Duty Act | Business-To-Business Trade Exhibitions Liable To Duty If Entry Is Paid : Supreme Court", "court": "Supreme Court", "case_name": "GEM AND JEWELLERY EXPORT PROMOTION COUNCIL v. STATE OF MAHARASHTRA AND OTHERS", "ratio": null, "summary": "The Supreme Court has held that business-to-business trade exhibitions can fall within the definition of “entertainment” under the Maharashtra Entertainment Duty Act, 1923.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1177-the-gem-and-jewellery-export-promotion-council-versus-the-state-of-maharashtra-and-others-559184", "priority": 76, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "9150781b3ead", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court To Decide In January Whether To Continue Probe Into Functioning Of Private Universities", "court": "Supreme Court", "case_name": "Ayesha Jain v. Amity University", "ratio": null, "summary": "The Supreme Court on Thursday deferred consideration of the nationwide proceedings concerning regulation of private universities to January 11, 2027. The Court said that it will consider on that date whether to continue examining the larger issue or to close the matter.", "url": "https://www.livelaw.in/top-stories/supreme-court-to-decide-in-january-whether-to-continue-probe-into-functioning-of-private-universities-559127", "priority": 75, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "3c5b1a75b2f3", "source": "scobserver", "category": "supreme-court", "title": "The Summer Docket: Counting the Supreme Court’s output during Partial Court Working Days - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scobserver.in/journal/the-summer-docket-counting-the-supreme-courts-output-during-partial-court-working-days/", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "c5ac38debb95", "source": "livelaw", "category": "high-court", "title": "'Pathetic Reality, Collective Shame': Delhi High Court Condemns Dowry Harassment, Deaths Of Married Women", "court": "Delhi High Court", "case_name": "Chhotey Lal & Jai Dev v. State", "ratio": null, "summary": "The Court noted that when the bride's family is unable to fulfil such demands, the harassment may continue, sometimes resulting in her death, suicide or divorce. In other instances, women continue to endure cruel treatment while suppressing their emotions.", "url": "https://www.livelaw.in/high-court/delhi-high-court/pathetic-reality-collective-shame-delhi-high-court-condemns-dowry-harassment-deaths-of-married-women-559178", "priority": 74, "topics": ["Hindu / Muslim law"], "note": {"Facts": "The appellant husband and his family were convicted for the death of his wife, who set herself on fire in 2001 after alleged dowry harassment for a motorcycle, gas stove, water motor and ₹25,000.", "Issue": "Whether the prosecution proved cruelty or dowry harassment sufficient to sustain a conviction under Section 304B (dowry death) and whether the husband’s conduct amounted to cruelty under Section 498A.", "Held": "The Court held that the prosecution failed to prove dowry-related cruelty required for Section 304B, converting the dowry-death conviction to abetment of suicide under Section 306, while upholding the conviction under Section 498A for cruelty. The father and brother were acquitted.", "Principle": "A conviction under Section 304B IPC demands proof of cruelty linked to dowry demands immediately before death; absent such proof, the charge cannot stand, though persistent matrimonial cruelty can sustain a conviction under Section 498A and, if it leads to suicide, under Section 306.", "Provisions": "Sections 498A, 304B, 306 IPC (as cited in the judgment).", "Exam angle": "Questions may test the application of IPC Sections 498A, 304B and 306 in dowry-related cases, focusing on the evidentiary requirement of a direct link between dowry demand and death and the distinction between cruelty and dowry death."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-20"}, {"id": "c1d71276adb7", "source": "livelaw", "category": "supreme-court", "title": "Civil Judge Exam | Supreme Court Refuses To Extend One-Year Deemed Practice Benefit To 2026 Law Graduates", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "A bench of CJI Surya Kant, Justice Joymalya Bagchi and Justice V Mohana was dealing with a challenge to the Andhra Pradesh High Court order which dismissed a bunch of pleas filed by law graduates who obtained their degrees within 1 year preceding the notification dated 25 September 2026 for recruitment to the post of Civil Judge (Junior Division). These law graduates (of 2026) sought to be deemed as having completed one year of practice even though 1 year had not passed since their graduation.", "url": "https://www.livelaw.in/top-stories/supreme-court-refuses-to-extend-one-year-deemed-practice-benefit-to-2026-law-graduates-bhumika-trust-three-year-practice-rule-559124", "priority": 73, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "bf4b5ef60b96", "source": "livelaw", "category": "supreme-court", "title": "Bharat Now Rich Country But Poor Sanitation Negated Growth In Other Fields : Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court noted that approximately 400 districts were yet to establish Special Cells to assist District Collectors. Only nine out of 28 States had met the target for urban bylaws, while 16 States had not reported the incorporation of rural bylaws and 18 States had not reported four-way segregation of rural solid waste.", "url": "https://www.livelaw.in/supreme-court/bharat-now-rich-country-but-poor-sanitation-negated-growth-in-other-fields-supreme-court-559100", "priority": 71, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "95290f76e0a8", "source": "livelaw", "category": "supreme-court", "title": "BIBOL TOPPO & ORS. VERSUS STATE OF ODISHA & ORS", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1173-bibol-toppo-ors-versus-state-of-odisha-ors-559050", "priority": 70, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "4dbd6bc8d04e", "source": "livelaw", "category": "supreme-court", "title": "Uttar Pradesh Avas Evam Vikas Parishad & Anr. v M/s Gaursons India Pvt. Ltd. & Ors", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1174-uttar-pradesh-avas-evam-vikas-parishad-anr-v-ms-gaursons-india-pvt-ltd-ors-559105", "priority": 70, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "ac3666aa374a", "source": "livelaw", "category": "high-court", "title": "Prisoner Can't Be Repeatedly Penalised For One Parole Violation Committed Long Ago: Delhi High Court", "court": "Delhi High Court", "case_name": "Azim Khan v. State GNCT of Delhi", "ratio": "A prisoner cannot be repeatedly penalised for a parole violation committed several years ago, particularly when he has subsequently been released on parole and furlou
