etworks of trust in an uncertain world but cannot replace the legitimacy of multilateral forums.", "url": "https://www.thehindu.com/opinion/op-ed/after-shenzhen-how-india-can-forge-a-fourth-pole/article71725820.ece/", "priority": 72, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-22"}, {"id": "65f5114f5935", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Rejects Plea Seeking Maintenance Of Police Database On Persons Making Repeated Sexual Offense Complaints", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court today refused to entertain a plea seeking a structured database of complainants who lodge multiple sexual-offence cases. Underlining the need to protect identity of victims/complainants, as well as referring to existing identification mechanisms, the Court dismissed the plea.", "url": "https://www.livelaw.in/top-stories/supreme-court-sexual-offenses-plea-seeking-database-of-persons-making-repeated-complaints-rejected-2-layer-identification-mechanism-in-place-559308", "priority": 100, "topics": ["Hindu / Muslim law"], "note": {"Facts": "A petitioners’ PIL sought a structured police database of complainants filing multiple sexual-offence complaints; the Delhi High Court had directed the police to consider the request, and the petitioners approached the Supreme Court.", "Issue": "Whether a police-maintained database of identities of complainants in sexual-offence cases should be created.", "Held": "The Supreme Court dismissed the plea, refusing to order such a database.", "Principle": "The Court held that existing two-layer identification mechanisms—mandatory medical examination with DNA profiling and recording of the victim’s statement before a Magistrate—already safeguard victim identity, and creating a police database would risk disclosure and is unnecessary.", "Provisions": "not stated.", "Exam angle": "Could be asked under the Criminal Law (Amendment) Act/IPC on sexual offences – focusing on victim-identity protection and the adequacy of existing procedural safeguards versus proposed police databases."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "aeca7412966b", "source": "livelaw", "category": "supreme-court", "title": "'Shocking The Conscience' Not Enough To Modify Arbitral Award: Supreme Court Restores Contractor's Claim Against Kolkata Port Trust", "court": "Supreme Court", "case_name": "M/s Marino Dredgeco Limited v. Board of Trustees of the Port of Kolkata", "ratio": "A court exercising jurisdiction under Section 37 of the Arbitration and Conciliation Act, 1996…", "summary": "The Supreme Court has set aside a Calcutta High Court judgment that reduced an arbitral award in favour of a dredging contractor by 50%, holding that a court exercising jurisdiction under Section.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1184-ms-marino-dredgeco-limited-versus-the-board-of-trustees-of-the-port-of-kolkata-559317", "priority": 100, "topics": ["Contract / Specific Relief"], "note": {"Facts": "The Supreme Court has set aside a Calcutta High Court judgment that reduced an arbitral award in favour of a dredging contractor by 50%, holding that a court exercising jurisdiction under Section.", "Held": "A court exercising jurisdiction under Section 37 of the Arbitration and Conciliation Act, 1996…", "Principle": "A court exercising jurisdiction under Section 37 of the Arbitration and Conciliation Act, 1996…", "Provisions": "Provision: Section 37 of the Arbitration and Conciliation Act, 1996; Held that the High Court's conclusion that the claim for additional work, which exceeded 70% of the original contract value, shocked its conscience was no"}, "syllabus": {"clusters": ["Obligations"], "acts": ["Contract / Specific Relief"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "0e9b40a42c47", "source": "livelaw", "category": "supreme-court", "title": "Section 92 CPC Suit Doesn't Give Every Devotee An Automatic Right To Be Impleaded: Supreme Court", "court": "Supreme Court", "case_name": "Subhasindu Das & Ors v. Bacchu Ranjan Das & Ors", "ratio": null, "summary": "The Supreme Court on Thursday (November 19) held that a suit under Section 92 of the Code of Civil Procedure, 1908 (CPC) is representative in nature, but this does not give every devotee or member.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1181-subhasindu-das-ors-v-bacchu-ranjan-das-ors-etc-559259", "priority": 98, "topics": ["CPC"], "note": {"Facts": "The Supreme Court on Thursday (November 19) held that a suit under Section 92 of the Code of Civil Procedure, 1908 (CPC) is representative in nature, but this does not give every devotee or member.", "Held": "Bench: Justice Vikram Nath, Justice Sandeep Mehta, Justice Aparesh Kumar Singh"}, "syllabus": {"clusters": ["Civil procedure"], "acts": ["CPC"], "landmark": false, "boost": 12}, "date": "2026-11-21"}, {"id": "b95ab3912b15", "source": "livelaw", "category": "supreme-court", "title": "UP Urban Tenancy Act 2021 | Pending Petitions Shouldn't Be Dismissed : Supreme Court To Examine HC Verdict Striking Down Law", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court on Friday issued notice on a special leave petition against the Allahabad High Court's August ruling that struck down key provisions of the Uttar Pradesh Regulation of Urban .", "url": "https://www.livelaw.in/top-stories/up-urban-tenancy-act-2021-pending-petitions-shouldnt-be-dismissed-supreme-court-to-examine-hc-verdict-striking-down-law-559354", "priority": 95, "topics": ["Transfer of Property"], "note": {"Facts": "The Allahabad High Court struck down Sections 8, 9, 10, 38 and 42 of the Uttar Pradesh Regulation of Urban Premises Tenancy Act, 2021, declaring them ultra vires and quashing an eviction order passed under the Act; the Supreme Court has issued notice on a Special Leave Petition and stayed dismissal of pending proceedings under the Act during the SLP.", "Issue": "Whether pending proceedings under the impugned provisions of the UP Regulation of Urban Premises Tenancy Act, 2021 can be dismissed as non-maintainable in view of the High Court’s declaration of those provisions as unconstitutional.", "Held": "The Supreme Court directed that, pending the SLP, proceedings under the relevant provisions of the 2021 Act shall not be dismissed as non-maintainable or abated.", "Principle": "A declaration of unconstitutionality of statutory provisions does not automatically render all pending proceedings under those provisions non-maintainable; they may continue until the higher court’s final decision on the validity of the provisions.", "Provisions": "Sections 8, 9, 10, 38, 42 (U.P. Act No 16 of 2021); Section 21(2) (U.P. Act); Article 254(2) of the Constitution; Transfer of Property Act 1882; Provincial Small Causes Courts Act 1887; 1972 Uttar Pradesh Urban Buildings (Regulation of Letting, Rent and Eviction) Act.", "Exam angle": "UP Regulation of Urban Premises Tenancy Act 2021 – test on repugnancy under Article 254(2) with the Transfer of Property Act 1882 and the Provincial Small Causes Courts Act 1887; focus on validity of State legislation without Presidential assent and the effect of a High Court’s striking-down on pending proceedings."}, "syllabus": {"clusters": ["Property"], "acts": ["Transfer of Property"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "44fceb7fd805", "source": "livelaw", "category": "supreme-court", "title": "In Case Of Child Born To Unwed Parents, Mother Has Better Prima Facie Claim Of Custody : Supreme Court", "court": "Supreme Court", "case_name": "Helena Anna Maria Lersch v. State of Goa & Anr", "ratio": null, "summary": "The Court clarified that the determination was confined to the mother's prima facie claim for interim custody and would not affect the Family Court's independent adjudication of the pending guardianship proceedings.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1179-helena-anna-maria-lersch-v-state-of-goa-anr-559225", "priority": 94, "topics": ["Hindu / Muslim law"], "note": {"Facts": "The Court clarified that the determination was confined to the mother's prima facie claim for interim custody and would not affect the Family Court's independent adjudication of the pending guardianship proceedings.", "Held": "Bench: Justice Nongmeikapam Kotiswar Singh, Justice N.V. Anjaria", "Provisions": "Noted that Section 6(b) of the Hindu Minority and Guardianship Act, 1956, specifically accords primacy to the mother over the father in respect of the natu"}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "f2d7c07fc7fb", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Awards Rs 10 Lakh Each To Two School Clerks For Wrongful Dismissal, Notes Poor Drafting Defeated Their Claim In HC", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court recently directed a private school to pay Rs 10 Lakh each to two clerks as compensation for the wrongful termination of their services, noting that their case had failed in the High Court because of poor drafting of the writ petitions.", "url": "https://www.livelaw.in/top-stories/supreme-court-awards-two-terminated-school-clerks-559289", "priority": 92, "topics": ["Constitution"], "note": {"Facts": "Two clerks of a private school were terminated after an inquiry (under the Maharashtra Employees of Private Schools (Conditions of Service) Rules, 1981) in which they did not participate and were not furnished the inquiry reports. The School Tribunal stayed the termination but later dismissed their appeals, and the High Court dismissed their writ petitions under Article 226, holding they were not on the same footing as the headmaster.", "Issue": "Whether the Supreme Court can award compensation for wrongful termination despite the appellants’ poorly drafted writ petitions and the High Court’s dismissal.", "Held": "The Supreme Court exercised its power under Article 142 and directed the school to pay Rs 10 lakh each to the two clerks as lump-sum compensation for wrongful termination.", "Principle": "A party must plead all material averments in a writ petition; a court is not bound to entertain matters not pleaded. However, an order wholly contrary to an express judicial order is a nullity, and the Supreme Court may intervene under Article 142 to grant appropriate relief.", "Provisions": "Article 226, Article 142 of the Constitution; *Ram Saran Varshney v. State of U.P.* (cited). No specific statutory sections or rules are stated beyond the reference to the Maharashtra Employees of Private Schools (Conditions of Service) Rules, 1981.", "Exam angle": "Service-law question under the Maharashtra Employees of Private Schools Rules and constitutional remedies – could be asked on the scope of Article 226 vs. Article 142, or on the requirement of proper pleading in writ petitions."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "3ba816f79978", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Dismisses Karnataka Govt Plea To Restore Ban On Bike Taxis, Says Better To Regulate", "court": "Supreme Court", "case_name": null, "ratio": "Bike taxis cannot operate in the state unless the State government issues relevant guidelines and rules under the Motor Vehicles Act", "summary": "The Supreme Court has upheld the Karnataka High Court's January 23 order setting aside ban on bike taxis in the state. By the impugned order, the division bench of the HC had allowed a batch of appeals preferred by aggregators OLA, Uber, Rapido and others challenging the Bike Taxi ban in the State.", "url": "https://www.livelaw.in/top-stories/supreme-court-dismisses-karnataka-govt-plea-to-restore-ban-on-bike-taxis-in-karnataka-559292", "priority": 84, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": true, "boost": -2}, "date": "2026-11-21"}, {"id": "f3b3ddf9655d", "source": "livelaw", "category": "high-court", "title": "Rajasthan High Court Grants Interim Protection From Arrest To Asaram In FIR Over Delay In Surrendering After Parole", "court": "Rajasthan High Court", "case_name": "Asharam v. State of Rajasthan & Ors", "ratio": null, "summary": "Rajasthan High Court judgment in Asharam v. State of Rajasthan & Ors.", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-stays-asharam-arrest-fir-over-delayed-surrender-parole-expiry-559366", "priority": 82, "topics": ["BNSS / CrPC", "Rajasthan laws"], "note": {"Facts": "An FIR was lodged against Asaram for failing to surrender to prison within the stipulated time after his parole expired.", "Issue": "Whether the court should grant interim protection from arrest to Asaram pending the resolution of the quashing petition.", "Held": "The Rajasthan High Court, on a petition for quashing, granted interim protection from arrest to Asaram.", "Principle": "The court may order interim protection from arrest when a petition is pending and the prosecution requires time to obtain necessary alignment.", "Provisions": "not stated", "Exam angle": "Criminal Procedure Code – interim bail/protection; could be asked on the criteria for granting interim protection from arrest in pending criminal matters."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Rajasthan laws"], "landmark": false, "boost": 13}, "date": "2026-11-21"}, {"id": "7c9ab3bc6bd9", "source": "sccblog", "category": "high-court", "title": "Mere use of company’s name on counterfeit goods does not constitute copyright infringement; Bombay HC quashes FIR in JSW Steel case", "court": null, "case_name": null, "ratio": null, "summary": "Bombay High Court: While examining whether the sale of counterfeit tin sheets bearing the name of JSW Steel Ltd. amounts to copyright infringement under Sections 51 and 63 of the Copyright Act, 1957 , the Single Judge Bench of M. W.", "url": "https://www.scconline.com/blog/post/2026/11/20/company-name-on-counterfeit-goods-copyright-infringement-bombay-hc/", "priority": 80, "topics": ["BNSS / CrPC"], "note": {"Facts": "Counterfeit tin sheets bearing the name “JSW Steel Ltd.” were sold, and an FIR was filed alleging copyright infringement.", "Issue": "Whether the mere use of a company’s name on counterfeit goods amounts to infringement under Sections 51 and 63 of the Copyright Act, 1957.", "Held": "The Bombay High Court quashed the FIR, holding that such use does not constitute copyright infringement.", "Principle": "Use of a company’s name on counterfeit goods, without allegation of copying a copyright-protected artistic work or logo, falls outside the scope of copyright infringement and is instead a matter for trademark law.", "Provisions": "Sections 51, 63 of the Copyright Act, 1957; Section 104 of the Trade Marks Act, 1999; Section 528 of the Bharatiya Nagarik Suraksha Sanhita, 2023.", "Exam angle": "Test on the Copyright Act – distinction between copyright infringement and trademark infringement; could be asked to frame the issue or to list the ingredients for establishing infringement under Sections 51/63."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-21"}, {"id": "3c68e8df21e1", "source": "livelaw", "category": "supreme-court", "title": "Arbitrator Cannot Award Beyond Monetary Limit Of Dispute Referred To Arbitration: Supreme Court", "court": "Supreme Court", "case_name": "NEYCER (INDIA) LTD. v. GMB CERAMICS LTD", "ratio": null, "summary": "Adjudicating a matter under the Arbitration Act, 1940, a bench of Justice Dipankar Datta and Justice Satish Chandra Sharma held that an umpire cannot enlarge the scope of the reference by relying on subsequent correspondence or a party's reservation of rights to claim additional damages.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1183-neycer-india-ltd-vs-gmb-ceramics-ltd-559315", "priority": 79, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-21"}, {"id": "3852ab6c76e8", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Strikes Down UP Laws Excluding Work-Charged Employees' Pre-Regularisation Service From Pension", "court": "Supreme Court", "case_name": "Prem Singh v. State of Uttar Pradesh", "ratio": "Once an employee is regularised in public service under a duly formulated scheme…", "summary": "The Court noted that the laws were enacted to override its 2019 verdict.", "url": "https://www.livelaw.in/supreme-court/supreme-court-strikes-down-up-laws-excluding-work-charged-employees-pre-regularisation-service-from-pension-559244", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-21"}, {"id": "a63b8959bab4", "source": "livelaw", "category": "high-court", "title": "Marriage Between Hindu And Christian Can't Be Validated By Registration Under Hindu Marriage Act: Madras High Court", "court": "Madras High Court", "case_name": null, "ratio": "The marriage between a Hindu and a Non-Hindu cannot be solemnised under the Hindu Marriage Act and such a marriage cannot be validated by mere…", "summary": "The bench of Justice CV Karthikeyan and Justice S Raveekumar thus declared a marriage between a Christian man and a Hindu woman void, holding that the marriage could not.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-hindu-and-christian-not-solemnise-hindu-marriage-act-registration-not-validate-559365", "priority": 77, "topics": ["Hindu / Muslim law"], "note": {"Facts": "A Christian man and a Hindu woman were married and later sought validation of their marriage by registration under the Hindu Marriage Act.", "Issue": "Whether a marriage between a Hindu and a non-Hindu can be solemnised or validated under the Hindu Marriage Act merely by registration.", "Held": "The Madras High Court declared the marriage void, holding that such a marriage cannot be solemnised under the Hindu Marriage Act and cannot be validated by registration.", "Principle": "A marriage between a Hindu and a non-Hindu is not permissible under the Hindu Marriage Act and registration does not cure the invalidity.", "Provisions": "not stated.", "Exam angle": "Hindu Marriage Act – question on the requirement of both parties being Hindus (or belonging to religions specified in the Act) and the impossibility of validating an inter-religious marriage through registration."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "90919ca91b28", "source": "sccblog", "category": "high-court", "title": "Delhi High Court: Aadhaar Card Not Conclusive Proof of Date of Birth; ESIC Records Prevail in Superannuation Dispute", "court": null, "case_name": null, "ratio": null, "summary": "Delhi High Court: While considering a writ petition challenging the Labour Court’s award holding the termination of a workwoman’s services illegal for non-compliance with Section 25-F , Industrial Disputes Act, 1947 (ID Act), a Single Judge Bench of Manoj Kumar Ohri, J. , dismissed the petition, holding that the management had failed to establish that.", "url": "https://www.scconline.com/blog/post/2026/11/20/delhi-hc-aadhaar-date-of-birth-esic-records-superannuation/", "priority": 76, "topics": ["Constitution"], "note": {"Facts": "A workwoman claimed illegal termination; management argued she had attained superannuation (age 58) on 20 May 2017, relying on her Aadhaar card (DOB 20 May 1959). The Labour Court, using ESIC records (DOB 20 May 1960) furnished by management, held termination illegal for non-compliance with Section 25-F, ID Act.", "Issue": "Whether an Aadhaar card alone can be treated as conclusive proof of date of birth for the purpose of establishing superannuation and the legality of termination under Section 25-F, ID Act.", "Held": "The Delhi High Court dismissed the writ petition, holding that the Aadhaar card is not conclusive proof of date of birth; ESIC records, being earlier and supplied by management, were rightly preferred, and the termination without complying with Section 25-F was illegal.", "Principle": "An Aadhaar card, being based on self-declaration or supporting documents, is not conclusive evidence of date of birth; the party bearing the burden of proof must produce reliable documentary evidence, and a plausible finding based on such evidence cannot be disturbed by a writ court.", "Provisions": "Section 25-F, ID Act; Section 25-G, ID Act; Articles 226 & 227, Constitution of India; UIDAI Office Memorandum (20 Dec 2018); *Saroj v. Iffco-Tokio General Insurance Co.*, 2024 SCC OnLine SC 3038.", "Exam angle": "Industrial Disputes Act – test of superannuation age and compliance with Section 25-F; evidentiary rule that Aadhaar is not conclusive proof of DOB – could be asked as “What evidence is required to establish age for superannuation under ID Act?” or “How does the court treat Aadhaar as proof of DOB?”"}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "531a9d67d0a8", "source": "livelaw", "category": "supreme-court", "title": "Pan-India Case On Unauthorised Construction Shifted From Justice Amanullah's Bench", "court": "Supreme Court", "case_name": "Loganathan v. State of Tamil Nadu & Ors", "ratio": null, "summary": "The Supreme Court case concerning unauthorised constructions and commercial use of residential properties across the country has been shifted from a bench headed by Justice Ahsanuddin Amanullah.", "url": "https://www.livelaw.in/top-stories/pan-india-case-on-unauthorised-construction-shifted-from-justice-amanullahs-bench-559361", "priority": 76, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-21"}, {"id": "d0f46494e95f", "source": "livelaw", "category": "high-court", "title": "Person's Religion Can't Be Determined From Name Or Govt Records Like Aadhar, Voter ID: Madras High Court", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The Madras High Court recently remarked that a person's religion cannot be determined from his name or government records like Aadhaar, Ration card or Voter ID. The bench of Justice CV Karthikeyan and Justice N Raveendran made the remark while hearing a man's plea to nullify a marriage registered between him and a woman under the Hindu Marriage Act.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-religious-identity-not-determined-by-name-aadhar-voter-id-559378", "priority": 76, "topics": ["Hindu / Muslim law"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-21"}, {"id": "31aa8305f3b1", "source": "scobserver", "category": "supreme-court", "title": "What happens when a question sits in the Supreme Court for decades—only to be closed without an answer? - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scobserver.in/journal/what-happens-when-a-question-sits-in-the-supreme-court-for-decades-only-to-be-closed-without-an-answer/", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "l  one another in an increasingly unpredictable world.", "url": "https://www.thehindu.com/opinion/editorial/three-to-tango-on-trump-xi-putin-trilateral-summit/article71725845.ece/", "priority": 78, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-21"}, {"id": "31cfbe58b94a", "source": "thehindu", "category": "editorial", "title": "Going public on AI: On Anthropic IPO", "court": null, "case_name": null, "ratio": null, "summary": "The Initial Public Offering (IPO) of Anthropic, PBC is a mile marker in the arms race to develop superintelligent systems driven by generative AI.", "url": "https://www.thehindu.com/opinion/editorial/going-public-on-ai-on-anthropic-ipo/article71725849.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-21"}, {"id": "1c593645fcd6", "source": "thehindu", "category": "editorial", "title": "Talks without peace: On Russia, Ukraine, U.S. talks", "court": null, "case_name": null, "ratio": null, "summary": "Europe must join talks toward a political settlement on Ukraine, as Abu Dhabi discussions fail to bridge Russia and Ukraine gaps.", "url": "https://www.thehindu.com/opinion/editorial/talks-without-peace-on-russia-ukraine-us-talks/article71721546.ece/", "priority": 72, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-21"}, {"id": "0ce777406c5c", "source": "livelaw", "category": "supreme-court", "title": "Manager's Access To Airbnb Room Cannot Absolve Occupant: Supreme Court Cancels Bail Of Accused In Narcotics Case", "court": "Supreme Court", "case_name": "State of Goa v. Agniv Sengupta", "ratio": null, "summary": "The Supreme Court recently set aside a Bombay High Court order granting bail to an accused in a narcotics case registered in Goa, holding that the High Court was wrong to infer that the accused had.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1175-state-of-goa-v-agniv-sengupta-559142", "priority": 100, "topics": ["BNSS / CrPC", "Transfer of Property", "NDPS / SC-ST / PC / others"], "note": {"Facts": "The Supreme Court recently set aside a Bombay High Court order granting bail to an accused in a narcotics case registered in Goa, holding that the High Court was wrong to infer that the accused had.", "Held": "Bench: Justice JB Pardiwala, Justice K Vinod Chandran"}, "syllabus": {"clusters": ["Evidence and crime", "Property", "Special criminal Acts"], "acts": ["BNSS / CrPC", "Transfer of Property", "NDPS / SC-ST / PC / others"], "landmark": false, "boost": 14}, "date": "2026-11-20"}, {"id": "994e437b734a", "source": "livelaw", "category": "supreme-court", "title": "Recovery Of Victim's Ornaments Alone Cannot Prove Murder: Supreme Court Acquits Man", "court": "Supreme Court", "case_name": "Bheemanagouda @ Bheemajja v. State by Harapanahalli Police", "ratio": "The prosecution had failed to establish a complete and unbroken chain of circumstantial evidence as the recovery of victim's ornaments alone cannot prove murder.", "summary": "Bench: Justice Prashant Kumar Mishra, Justice Vipul M Pancholi", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1176-bheemanagouda-bheemajja-v-state-by-harapanahalli-police-559146", "priority": 100, "topics": ["BSA / Evidence", "BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Bench: Justice Prashant Kumar Mishra, Justice Vipul M Pancholi", "Held": "The prosecution had failed to establish a complete and unbroken chain of circumstantial evidence as the recovery of victim's ornaments alone cannot prove murder.", "Principle": "The prosecution had failed to establish a complete and unbroken chain of circumstantial evidence as the recovery of victim's ornaments alone cannot prove murder.", "Provisions": "Observed so while hearing an appeal filed against the Karnataka High Court's judgment which had upheld appellant's (accused) conviction under Section 302 Indi"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BSA / Evidence", "BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-20"}, {"id": "13cb703690db", "source": "livelaw", "category": "supreme-court", "title": "Lender Does Not Hold Mortgage Security In Trust For Borrower: Supreme Court Quashes FIR Over Alleged Use Of Land As Cross-Collateral", "court": "Supreme Court", "case_name": "Edelweiss Asset Reconstruction Company Limited v. State of NCT of Delhi & Ors", "ratio": null, "summary": "The Court observed that a lender taking a mortgage to secure repayment of its own loan holds the security for itself and not in the capacity of a banker entrusted with property belonging to a customer. Consequently, the offence of criminal breach of trust by a banker under Section 409 of the Indian Penal Code (IPC) cannot be invoked merely because a lender holds a mortgage over property offered as security for a loan.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1178-edelweiss-asset-reconstruction-company-limited-v-state-of-nct-of-delhi-ors-559186", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC", "Transfer of Property"], "note": {"Facts": "The Court observed that a lender taking a mortgage to secure repayment of its own loan holds the security for itself and not in the capacity of a banker entrusted with property belonging to a customer. Consequently, the offence of criminal breach of trust by a banker under Section 409 of the Indian Penal Code (IPC) cannot be invoked merely because a lender holds a mortgage over property offered as security for a loan.", "Held": "Bench: Justice Vikram Nath, Justice Sandeep Mehta"}, "syllabus": {"clusters": ["Evidence and crime", "Property"], "acts": ["BNS / IPC", "BNSS / CrPC", "Transfer of Property"], "landmark": false, "boost": 13}, "date": "2026-11-20"}, {"id": "cb9f7eea7b7c", "source": "sccblog", "category": "supreme-court", "title": "Appreciating the scope and dimensions of “surcharge” in taxation laws: Implications of Supreme Court’s larger Bench exposition on “surcharge” and “cess”", "court": null, "case_name": null, "ratio": null, "summary": "Introduction Tax on tax is economically frowned upon as it results into cascading effect. Whether such economic distortion can render the levy legally invalid is a different matter altogether. Giving short thrift to the debate, about five decades back the Supreme Court observed that “bad economics may be good law and vice versa ”, thereby.", "url": "https://www.scconline.com/blog/post/2026/11/19/supreme-court-larger-bench-surcharge-cess-taxation-laws/", "priority": 96, "topics": ["Constitution"], "note": {"Facts": "Arjun Flour Mills challenged a State levy that computed a surcharge on the sales-tax payable by a dealer, arguing it was in substance a tax on the dealer’s income and beyond State competence. The State contended it was merely a “surcharge” – an enhancement of the sales-tax rate.", "Issue": "Whether a levy that is computed as a percentage of the sales-tax payable is a valid surcharge (i.e., a sales-tax) or an unconstitutional tax on income/fiscal burden of the dealer.", "Held": "The Supreme Court held that the levy is a surcharge – an enhancement of the principal sales-tax – and therefore a valid sales-tax, not a tax on income. Consequently, while the surcharge is constitutionally valid, the Court barred States from levying it post-GST transition because the underlying sales-tax statutes have ceased to exist.", "Principle": "A surcharge, even if computed on the amount of another tax, retains the character of the principal levy; the method of computation does not alter the subject-matter of the tax.", "Provisions": "- Arjun Flour Mills v. State of Odisha (larger Bench) – cited. - State of Telangana v. Tirumala Construction – GST transition provision, Sec. 19, Constitution (101st Amendment) Act, 2016. - No specific statutory sections were quoted for the surcharge itself; the decision refers to the constitutional entry on “tax on sale or purchase of goods”.", "Exam angle": "Constitutional Law – State List (List II) power to tax sale or purchase of goods.* The question can be framed as: “Explain the scope of ‘surcharge’ under State taxation power and its limitation post-GST (Sec. 19, 101st Amendment).” This tests understanding of legislative competence, the distinction between surcharge and cess, and the effect of the GST transition on State levies."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": true, "boost": 16}, "date": "2026-11-20"}, {"id": "724da1b63ee5", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Quashes Mining Land Acquisition In Tribal Area, Holds Gram Sabha Consent Mandatory", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court held that Section 41(3) of the RFCTLARR Act was mandatory for acquisitions in scheduled areas.", "url": "https://www.livelaw.in/supreme-court/supreme-court-quashes-mining-land-acquisition-in-tribal-area-holds-gram-sabha-consent-mandatory-559049", "priority": 89, "topics": ["Transfer of Property"], "note": {"Facts": "The government sought to acquire land in scheduled village areas of Sundergarhi district, Odisha, for a Dalmia Cement plant, but the gram panchayats had rejected the proposal and no consent was recorded on Form M as required.", "Issue": "Whether prior consent of the gram panchayat/gram sabha under Section 41(3) of the Right to Fair Compensation and Transparency in Land Acquisition, Rehabilitation and Resettlement Act, 2013 is mandatory for land acquisition in scheduled areas, and whether its absence vitiates the acquisition.", "Held": "The Supreme Court set aside the acquisition proceedings, holding that the consent requirement under Section 41(3) is mandatory, not directory, and its non-compliance renders the acquisition void.", "Principle": "For land acquisition in scheduled areas, the statutory requirement of obtaining gram sabha consent under Section 41(3) of the 2013 Act is mandatory; failure to secure it cannot be cured later and invalidates the acquisition.", "Provisions": "Section 41(3), 2013 Act; Section 2(2)(b), 2013 Act (80% family consent for private company); Rule 41, Odisha Rules (Form M); Mines and Minerals (Development and Regulation) Act, 1957 (mining lease).", "Exam angle": "Test on the Right to Fair Compensation and Transparency in Land Acquisition Act, 2013 – focus on mandatory consent under Section 41(3) and its applicability to private-company projects in scheduled areas."}, "syllabus": {"clusters": ["Property"], "acts": ["Transfer of Property"], "landmark": false, "boost": 8}, "date": "2026-11-20"}, {"id": "2b4085639e49", "source": "livelaw", "category": "supreme-court", "title": "'Go And Tell The Chief Justice To Mind His Own Business': When A Judge Allowed Sons To Appear Before Him", "court": "Supreme Court", "case_name": "Purushottam Bhujade v. Sudhir Shikshan Sanstha & Ors", "ratio": null, "summary": "The Supreme Court traced the evolving law of bias and recalled that kinship was not regarded as a ground for bias at one point in time.", "url": "https://www.livelaw.in/top-stories/supreme-court-recalls-justice-badaurddin-tyabji-sons-appearing-law-of-bias-559056", "priority": 87, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "14b8740fc9a9", "source": "livelaw", "category": "supreme-court", "title": "Directions For Removal Of Highway Encroachments Can't Be Used To Demolish Structures Without Due Process : Supreme Court Clarifies Order", "court": "Supreme Court", "case_name": "RE: PHALODI ACCIDENT v. NATIONAL HIGHWAYS AUTHORITY OF INDIA & ORS", "ratio": "Its April directions to remove encroachments along National Highways cannot be used to demolish disputed structures without following due process of law", "summary": "The Supreme Court on Wednesday (November 18) clarified that its April directions to remove encroachments along National Highways cannot be used to demolish disputed structures without following due.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1171-in-re-phalodi-accident-versus-national-highways-authority-of-india-ors-559024", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "6001fe21a963", "source": "sccblog", "category": "high-court", "title": "Top Legal Developments [9-15 Nov 2026]: Digital Arrest Scams, GST, AI Deepfakes and More", "court": null, "case_name": null, "ratio": null, "summary": "This week witnessed significant judicial developments, with the Supreme Court calling for mandatory compensation to victims of cyber frauds where financial institutions fail to exercise due diligence, and clarifying when balance sheet entries can extend the limitation period. The High Courts delivered key rulings on GST input tax credit, AI-generated deepfakes, personality rights, social media.", "url": "https://www.scconline.com/blog/post/2026/11/19/weekly-legal-developments-india-9-15-november-2026/", "priority": 76, "topics": ["Limitation / Registration"], "note": {"Facts": "A three-Judge Bench of the Supreme Court examined digital arrest scams and other cyber frauds where victims lost money because their banks failed to exercise due diligence.", "Issue": "Whether financial institutions are required to compensate victims when cyber fraud occurs due to their lack of due diligence.", "Held": "The Court directed that banks must indemnify victims and pay compensation not less than the amount lost, and must adopt preventive safeguards such as suspending suspicious transactions, notifying police and physically verifying transactions.", "Principle": "A financial institution that fails to exercise due diligence and thereby enables a cyber fraud must compensate the victim for the full loss.", "Provisions": "not stated.", "Exam angle": "Likely framed under the Banking Regulation Act / RBI regulatory framework, testing the duty of banks to exercise due diligence and the remedy of mandatory compensation for cyber-fraud victims."}, "syllabus": {"clusters": ["Property"], "acts": ["Limitation / Registration"], "landmark": false, "boost": 8}, "date": "2026-11-20"}, {"id": "91bf476cb36b", "source": "livelaw", "category": "supreme-court", "title": "Maharashtra Entertainment Duty Act | Business-To-Business Trade Exhibitions Liable To Duty If Entry Is Paid : Supreme Court", "court": "Supreme Court", "case_name": "GEM AND JEWELLERY EXPORT PROMOTION COUNCIL v. STATE OF MAHARASHTRA AND OTHERS", "ratio": null, "summary": "The Supreme Court has held that business-to-business trade exhibitions can fall within the definition of “entertainment” under the Maharashtra Entertainment Duty Act, 1923.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1177-the-gem-and-jewellery-export-promotion-council-versus-the-state-of-maharashtra-and-others-559184", "priority": 76, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "9150781b3ead", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court To Decide In January Whether To Continue Probe Into Functioning Of Private Universities", "court": "Supreme Court", "case_name": "Ayesha Jain v. Amity University", "ratio": null, "summary": "The Supreme Court on Thursday deferred consideration of the nationwide proceedings concerning regulation of private universities to January 11, 2027. The Court said that it will consider on that date whether to continue examining the larger issue or to close the matter.", "url": "https://www.livelaw.in/top-stories/supreme-court-to-decide-in-january-whether-to-continue-probe-into-functioning-of-private-universities-559127", "priority": 75, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "3c5b1a75b2f3", "source": "scobserver", "category": "supreme-court", "title": "The Summer Docket: Counting the Supreme Court’s output during Partial Court Working Days - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scobserver.in/journal/the-summer-docket-counting-the-supreme-courts-output-during-partial-court-working-days/", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "c5ac38debb95", "source": "livelaw", "category": "high-court", "title": "'Pathetic Reality, Collective Shame': Delhi High Court Condemns Dowry Harassment, Deaths Of Married Women", "court": "Delhi High Court", "case_name": "Chhotey Lal & Jai Dev v. State", "ratio": null, "summary": "The Court noted that when the bride's family is unable to fulfil such demands, the harassment may continue, sometimes resulting in her death, suicide or divorce. In other instances, women continue to endure cruel treatment while suppressing their emotions.", "url": "https://www.livelaw.in/high-court/delhi-high-court/pathetic-reality-collective-shame-delhi-high-court-condemns-dowry-harassment-deaths-of-married-women-559178", "priority": 74, "topics": ["Hindu / Muslim law"], "note": {"Facts": "The appellant husband and his family were convicted for the death of his wife, who set herself on fire in 2001 after alleged dowry harassment for a motorcycle, gas stove, water motor and ₹25,000.", "Issue": "Whether the prosecution proved cruelty or dowry harassment sufficient to sustain a conviction under Section 304B (dowry death) and whether the husband’s conduct amounted to cruelty under Section 498A.", "Held": "The Court held that the prosecution failed to prove dowry-related cruelty required for Section 304B, converting the dowry-death conviction to abetment of suicide under Section 306, while upholding the conviction under Section 498A for cruelty. The father and brother were acquitted.", "Principle": "A conviction under Section 304B IPC demands proof of cruelty linked to dowry demands immediately before death; absent such proof, the charge cannot stand, though persistent matrimonial cruelty can sustain a conviction under Section 498A and, if it leads to suicide, under Section 306.", "Provisions": "Sections 498A, 304B, 306 IPC (as cited in the judgment).", "Exam angle": "Questions may test the application of IPC Sections 498A, 304B and 306 in dowry-related cases, focusing on the evidentiary requirement of a direct link between dowry demand and death and the distinction between cruelty and dowry death."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-20"}, {"id": "c1d71276adb7", "source": "livelaw", "category": "supreme-court", "title": "Civil Judge Exam | Supreme Court Refuses To Extend One-Year Deemed Practice Benefit To 2026 Law Graduates", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "A bench of CJI Surya Kant, Justice Joymalya Bagchi and Justice V Mohana was dealing with a challenge to the Andhra Pradesh High Court order which dismissed a bunch of pleas filed by law graduates who obtained their degrees within 1 year preceding the notification dated 25 September 2026 for recruitment to the post of Civil Judge (Junior Division). These law graduates (of 2026) sought to be deemed as having completed one year of practice even though 1 year had not passed since their graduation.", "url": "https://www.livelaw.in/top-stories/supreme-court-refuses-to-extend-one-year-deemed-practice-benefit-to-2026-law-graduates-bhumika-trust-three-year-practice-rule-559124", "priority": 73, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "bf4b5ef60b96", "source": "livelaw", "category": "supreme-court", "title": "Bharat Now , "case_name": "Azim Khan v. State GNCT of Delhi", "ratio": "A prisoner cannot be repeatedly penalised for a parole violation committed several years ago, particularly when he has subsequently been released on parole and furlough", "summary": "The Delhi High Court has observed that a prisoner cannot be repeatedly penalised for a parole violation committed several years ago, particularly when he has subsequently been released on parole.", "url": "https://www.livelaw.in/high-court/delhi-high-court/prisoner-cant-be-repeatedly-penalised-for-one-parole-violation-committed-long-ago-delhi-high-court-559179", "priority": 62, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "0012fd6a1453", "source": "livelaw", "category": "high-court", "title": "High Court Holds It Has Jurisdiction To Hear Plea Against CARA For NOC Even Though Adoption Took Place Outside Delhi", "court": "Delhi High Court", "case_name": "Harpreet Kaur & Anr. v. Union of India & Ors", "ratio": null, "summary": "The Court observed that although the adoption deed was executed in Amritsar, Punjab, the principal relief was sought against CARA, which is situated in the national capital.", "url": "https://www.livelaw.in/high-court/delhi-high-court/high-court-holds-it-has-jurisdiction-to-hear-plea-against-cara-for-noc-even-though-adoption-took-place-outside-delhi-559180", "priority": 58, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-20"}, {"id": "a3667d6d1050", "source": "telegram-pdf", "category": "national", "title": "River sharing can'tignore bilateralties: India on Indus", "court": null, "case_name": null, "ratio": null, "summary": "RespondingtoShehbazremarks,Yadav refers toTreaty pause,flagsarchaic mechanisms,broaderenvironment Amitabh Sinha New Delhi, November 18 IN A clear reference to India's decisionto put in abeyance the Indus Waters "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "e48ca9077a3b", "source": "thehindu", "category": "international", "title": "Third Ukrainian strike in 4 days halts rail traffic on Russia's Kerch Bridge to Crimea", "court": null, "case_name": null, "ratio": null, "summary": "The attack came hours before the start of talks in Berlin between U.S. envoys Jared Kushner and Steve Witkoff and Ukrainian President Volodymyr Zelenskyy alongside more than 40 European leaders who are supporting Ukraine's war effort.", "url": "https://www.thehindu.com/news/international/third-ukrainian-strike-in-4-days-halts-rail-traffic-on-russias-kerch-bridge-to-crimea/article71721511.ece/", "priority": 71, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "5a21d867e330", "source": "thehindu", "category": "international", "title": "Yunus's ancestral home set ablaze as violence grips Bangladesh", "court": null, "case_name": null, "ratio": null, "summary": "Newspaper reports said rival activists, presumably belonging to Prime Minister Tarique Rahman's Bangladesh Nationalist Party (BNP), overnight attacked or set ablaze the residences of two Awami League leaders in Dhaka.", "url": "https://www.thehindu.com/news/international/yunuss-ancestral-home-set-ablaze-as-violence-grips-bangladesh/article71719029.ece/", "priority": 69, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "7c14f46c3ee1", "source": "thehindu", "category": "editorial", "title": "A regulatory fix for India’s campuses", "court": null, "case_name": null, "ratio": null, "summary": "The Environment Ministry must act without delay and issue a statutory notification, consistent with the court’s judgment, for eligible educational campuses.", "url": "https://www.thehindu.com/opinion/op-ed/a-regulatory-fix-for-indias-campuses/article71716165.ece/", "priority": 81, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "e89769ecc156", "source": "thehindu", "category": "editorial", "title": "Incomplete remedies: On Special Summary Revision of electoral rolls", "court": null, "case_name": null, "ratio": null, "summary": "ECI’s SSR relief skims issues from SIR flaws, restoring some electors but leaving structural problems and limited coverage unresolved.", "url": "https://www.thehindu.com/opinion/editorial/incomplete-remedies-on-special-summary-revision-of-electoral-rolls/article71721539.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "f1c9e89e8fde", "source": "thehindu", "category": "editorial", "title": "The changing dynamic of nationalism in India", "court": null, "case_name": null, "ratio": null, "summary": "Examines civic vs. ethnic nationalism in India, contrasting inclusive freedom-struggle ideals with today’s exclusionary, patriarchal Hindutva and its capitalist ties.", "url": "https://www.thehindu.com/opinion/lead/the-changing-dynamic-of-nationalism-in-india/article71721507.ece/", "priority": 74, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "b548582ff326", "source": "thehindu", "category": "editorial", "title": "Testing times: On India’s two-Test series against New Zealand", "court": null, "case_name": null, "ratio": null, "summary": "Account subscription benefits alongside Premium Stories, Editorials, Opinions and more. Unlock these with Subscription.", "url": "https://www.thehindu.com/opinion/editorial/testing-times-on-indias-two-test-series-against-new-zealand/article71717329.ece/", "priority": 72, "topics": ["General"], "note": null, "syllabus": null, "date": "2026-11-20"}, {"id": "555fd90c062e", "source": "livelaw", "category": "supreme-court", "title": "Stay Of Conviction Can't Be Sought Only To Contest Elections : Supreme Court", "court": "Supreme Court", "case_name": "STATE OF U.P v. MOHAMMAD AZAM KHAN AND ORS", "ratio": "Courts cannot permit statutory powers to be leveraged to suit political calendars.", "summary": "The Supreme Court has cautioned that a stay of conviction cannot be sought merely to pursue electoral ambitions or contest upcoming elections, observing that courts cannot permit statutory powers to be leveraged to suit political calendars. At the same time, the Court held that judicial discretion to stay a conviction must be cautiously exercised by balancing the irreversible damage to an individual's personal reputation and dignity against the sanctity of a judicial finding of guilt.", "url": "https://www.livelaw.in/supreme-court/stay-of-conviction-cant-be-sought-only-to-contest-elections-supreme-court-558898", "priority": 100, "topics": ["BNSS / CrPC"], "note": {"Facts": "The Supreme Court entertained appeals by Mohammad Abdullah Azam Khan and Dr Tazeen Fatma, seeking a stay of their convictions in a case alleging use of conflicting birth certificates, and a State of U.P. appeal challenging a High Court stay.", "Issue": "Whether a stay of criminal conviction may be granted solely to enable the petitioner to contest elections or pursue electoral ambitions.", "Held": "The Court allowed the stays of conviction pending revision but categorically held that a stay cannot be granted merely on the ground of political or electoral expediency.", "Principle": "A stay of conviction must be exercised with judicial discretion, balancing the irreversible damage to personal dignity (Article 21) against the sanctity of a conviction, and cannot be used as a tool to suit political calendars.", "Provisions": "Section 389(1), Criminal Procedure Code; Article 21 of the Constitution; reference to *Afjal Ansari v. State of U.P.* (2023).", "Exam angle": "Criminal Procedure Code – application of Section 389(1) in the context of electoral politics; could be asked as an issue-framing question on the limits of seeking stay of conviction under the Representation of the People Act or on the interplay between Article 21 and criminal convictions."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "4d1e81f6d4ba", "source": "livelaw", "category": "high-court", "title": "Whether Magistrate's Order Directing FIR Registration Is Revisable? J&K High Court Refers Legal Question To Larger Bench", "court": "Jammu & Kashmir and Ladakh High Court", "case_name": null, "ratio": null, "summary": "The Jammu & Kashmir and Ladakh High Court has referred to a larger Bench the question whether an order passed by a Magistrate under Section 156(3) CrPC, directing registration of an FIR and police investigation, is an interlocutory order barred from revision or an intermediate order amenable to revisional jurisdiction.", "url": "https://www.livelaw.in/high-court/jammu-kashmir/whether-magistrates-order-directing-fir-registration-is-revisable-jk-high-court-refers-legal-question-to-larger-bench-558974", "priority": 100, "topics": ["BNSS / CrPC", "Constitution"], "note": {"Facts": "Two petitions challenged orders of Judicial Magistrates directing registration of FIRs under Section 156(3) CrPC; the petitioners argued that such orders are interlocutory and not subject to criminal revision, while the respondents contended they are intermediate orders amenable to revision.", "Issue": "Whether an order passed by a Magistrate under Section 156(3) CrPC directing FIR registration and investigation is an interlocutory order barred by Sections 397(2) CrPC and 438(2) BNSS, or an intermediate order subject to criminal revision.", "Held": "The Jammu & Kashmir and Ladakh High Court did not decide the issue but referred six specific questions to a larger Bench for authoritative determination.", "Principle": "The nature of an order (interlocutory vs. intermediate) must be examined by its jurisdiction, issue decided, effect and legal consequences; mere non-determination of guilt does not automatically render it interlocutory, and an order may acquire revisional jurisdiction if it decides a substantial legal right or jurisdictional question.", "Provisions": "State of Haryana*, *Madhu Limaye v. State of Maharashtra*, *Girish Kumar Suneja v. CBI*, *Father Thomas v. State of U.P.* (Allahabad HC), *Arun P. Gidh v. Chandraprakash Singh* (Bombay HC), *Manohar Nath Sher v. State of J&K*, *Satpal Sharma v. Pawan Singh Rathore*, *Anurag Bhatnagar & Anr. v. State (NCT of Delhi)*, *Priyanka Srivastava v. State of Uttar Pradesh*, *Anil Kumar v. M.K. Aiyappa*.", "Exam angle": "Criminal Procedure Code – test the revisional jurisdiction under Section 397 CrPC vis-à-vis orders under Section 156(3) CrPC; focus on distinguishing interlocutory and intermediate orders and the impact of Supreme Court precedents (Amar Nath, Madhu Limaye, Suneja)."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Constitution"], "landmark": true, "boost": 21}, "date": "2026-11-19"}, {"id": "f443be8758a0", "source": "livelaw", "category": "supreme-court", "title": "Constructive Res Judicata | Claim Based On Subsequent Cause Of Action Not Barred By Judgment On Prior Cause Of Action : Supreme Court", "court": "Supreme Court", "case_name": "Ashok Kumar v. Central Bank of India & Ors", "ratio": "The principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings…", "summary": "The Supreme Court on Wednesday (November 18) held that the principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1171-ashok-kumar-v-central-bank-of-india-ors-558998", "priority": 100, "topics": ["CPC"], "note": {"Facts": "The Supreme Court on Wednesday (November 18) held that the principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings.", "Held": "The principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings…", "Principle": "The principle of constructive res judicata cannot bar a subsequent claim merely because a relief was not sought in earlier proceedings…", "Provisions": "Held that the principle of constructive res judicata would apply only if the cause of action for claiming interest on delayed payment of salary had existe; Noted that the claim for interest required adjudication of separate factual issues, including entitlement to interest, the period of delay attributable to"}, "syllabus": {"clusters": ["Civil procedure"], "acts": ["CPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "dec9cb89ece5", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Dismisses PIL Seeking Ban On Animal Sacrifices For Religious Rituals", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court today dismissed a public interest litigation seeking a ban on killing of animals in the name of religion. A bench of Justice Vikram Nath, Justice R Mahadevan, and Justice Aparesh.", "url": "https://www.livelaw.in/top-stories/supreme-court-dismisses-pil-seeking-ban-on-animal-sacrifices-for-religious-rituals-558980", "priority": 96, "topics": ["BNS / IPC"], "note": {"Facts": "A public interest litigation was filed by Advocate Shruti Bist seeking a direction to the Ministry of Animal Husbandry to amend Section 28 of the Prevention of Cruelty to Animals Act, 1960, to prohibit killing animals in the name of religion.", "Issue": "Whether the saving clause in Section 28, which exempts animal killing required by any religion, can be struck down or amended to ban animal sacrifice.", "Held": "The Supreme Court, a bench of Justices Vikram Nath, R Mahadevan and Aparesh Singh, dismissed the PIL and did not order any amendment to Section 28.", "Principle": "A statutory saving clause that expressly protects religiously mandated animal killing cannot be overridden by a PIL; the Court will not interfere with a clear legislative provision on religious practice.", "Provisions": "Section 28 of the Prevention of Cruelty to Animals Act, 1960; no other statutes, articles or cases are cited in the source.", "Exam angle": "Questions may test the Prevention of Cruelty to Animals Act, focusing on the interpretation of Section 28’s savings clause and its interaction with constitutional guarantees of religious freedom."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "e5212d5c2327", "source": "livelaw", "category": "supreme-court", "title": "Asset Reconstruction Company Can Step Into Bank's Shoes In Cheque Bounce Case, But Must Prove It Is 'Holder In Due Course': Supreme Court", "court": "Supreme Court", "case_name": "Kishore Avarsekar & Ors. v. Assets Care and Reconstruction Enterprises Ltd & Ors", "ratio": null, "summary": "The Supreme Court held that an Asset Reconstruction Company (ARC) that acquires a bank's financial asset under Section 5 of the Securitisation and Reconstruction of Financial Assets and Enforcement.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1166-kishore-avarsekar-ors-v-assets-care-and-reconstruction-enterprises-ltd-ors-558884", "priority": 94, "topics": ["NI Act s.138"], "note": {"Facts": "The Supreme Court held that an Asset Reconstruction Company (ARC) that acquires a bank's financial asset under Section 5 of the Securitisation and Reconstruction of Financial Assets and Enforcement.", "Held": "Bench: Justice Dipankar Datta, Justice Sheel Nagu", "Provisions": "Provision: Section 138 of the NI Act"}, "syllabus": {"clusters": ["Special criminal Acts"], "acts": ["NI Act s.138"], "landmark": false, "boost": 8}, "date": "2026-11-19"}, {"id": "98dec3e90153", "source": "livelaw", "category": "supreme-court", "title": "Arbitral Tribunal Final Arbiter Of Facts; Section 37 Court Cannot Make Independent Assessment Of Merits : Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court has reiterated that appellate courts cannot substitute their own interpretation of contractual terms for that of an Arbitral Tribunal if the interpretation adopted by the Tribunal is a possible and plausible one.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1170-rajasthan-rajya-vidyut-utpadan-nigam-ltdv-parsa-kente-collieries-limited-558969", "priority": 92, "topics": ["Constitution"], "note": {"Facts": "The Supreme Court has reiterated that appellate courts cannot substitute their own interpretation of contractual terms for that of an Arbitral Tribunal if the interpretation adopted by the Tribunal is a possible and plausible one.", "Held": "Bench: Justice Satish Chandra Sharma, Justice Nongmeikapam Kotiswar Singh, Justice Sudhir Kumar Katriar", "Provisions": "Provision: Section 37 of the Arbitration and Conciliation Act, 1996; Observed that the Arbitral Tribunal is the final arbiter of facts, and that the construction of contractual terms primarily falls within its domain"}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-19"}, {"id": "56100f4fc02f", "source": "livelaw", "category": "high-court", "title": "Telangana High Court Quashes Preventive Detention Of 6 Accused In CPI Leader's Murder, Finds No Evidence Of Habitual Offending", "court": "Telangana High Court", "case_name": "Nagaraju v. State of Telangana and Others", "ratio": null, "summary": "The Telangana High Court has recently quashed the detention orders of six individuals over the murder of Communist Party of India leader Kethawat Chandu Rathod, consequently classified as 'Goondas' under the Telangana Prevention of Dangerous Activities Act, 1986. The Division Bench comprising of Justice Moushumi Bhattacharya and Justice Renuka Yara said that a single crime.", "url": "https://www.livelaw.in/high-court/telangana-high-court/telangana-high-court-quashes-preventive-detention-six-persons-accused-cpi-leader-chandu-rathod-murder-559021", "priority": 85, "topics": ["BNS / IPC"], "note": {"Facts": "Six persons were detained as “Goondas” under the Telangana Prevention of Dangerous Activities Act, 1986 for the murder of CPI leader Kethawat Chandu Rathod.", "Issue": "Whether a single criminal act (the murder) suffices to classify the accused as habitual offenders (“Goondas”) under the Act.", "Held": "The Telangana High Court quashed the preventive detention orders, holding that a single crime does not meet the statutory requirement of habitual offending.", "Principle": "Classification as a “Goonda” under the Telangana Prevention of Dangerous Activities Act, 1986 requires proof of a pattern of repeated offences; a solitary offence is insufficient.", "Provisions": "Telangana Prevention of Dangerous Activities Act, 1986 (specific sections not stated in the source).", "Exam angle": "Questions may test the ingredients of “Goonda” under the Telangana Prevention of Dangerous Activities Act, 1986 – e.g., “What is the statutory test for deeming a person a ‘Goonda’ and how does the requirement of habitual offending affect preventive detention?”"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "dbbcb120107c", "source": "livelaw", "category": "high-court", "title": "Hindu Marriage Can't Be Dissolved Through Community Separation Deed Unless Custom Is Established: Rajasthan High Court", "court": "Rajasthan High Court", "case_name": null, "ratio": "A Hindu marriage cannot be treated as dissolved merely on the basis of a community separation deed unless the customary practice permitting such dissolution is…", "summary": "The ruling: A Hindu marriage cannot be treated as dissolved merely on the basis of a community separation deed unless the customary practice permitting such dissolution is….", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-hindu-marriage-dissolved-through-community-separation-deed-559018", "priority": 83, "topics": ["CPC", "Hindu / Muslim law", "Rajasthan laws"], "note": {"Facts": "The appellant sought recognition of a marriage dissolution based solely on a community separation deed, which the Family Court had refused to acknowledge.", "Issue": "Whether a Hindu marriage can be deemed dissolved merely on the basis of a community separation deed absent proof of a customary practice allowing such dissolution.", "Held": "The Rajasthan High Court dismissed the appeal, holding that a Hindu marriage cannot be dissolved through a community separation deed unless the existence of a custom permitting such dissolution is duly established.", "Principle": "A Hindu marriage is not dissolved by a community separation deed unless the custom that authorises such dissolution is proven.", "Provisions": "not stated.", "Exam angle": "Hindu Marriage Act – test of custom as a ground for dissolution; could be asked to frame the issue of “custom” as an ingredient for nullity or dissolution of marriage."}, "syllabus": {"clusters": ["Civil procedure", "Personal, local and constitutional"], "acts": ["CPC", "Hindu / Muslim law", "Rajasthan laws"], "landmark": false, "boost": 13}, "date": "2026-11-19"}, {"id": "eaf503588074", "source": "sccblog", "category": "high-court", "title": "“Legislature cannot nullify a judgment by enacting law without removing the basis”: Andhra Pradesh High Court strikes down Section 147-A, Income-tax Act, 1961 as unconstitutional", "court": null, "case_name": null, "ratio": null, "summary": "Andhra Pradesh High Court: The petitions were filed challenging the constitutional validity of Section 147-A, Income-tax Act, 1961 (IT Act), inserted by the Finance Act, 2026 , with retrospective effect from 1 April 2021, as being ultra vires and violative of the basic structure of the Constitution , including the principles of Rule of Law.", "url": "https://www.scconline.com/blog/post/2026/11/18/ap-high-court-strikes-down-section-147a-income-tax-act/", "priority": 81, "topics": ["Constitution", "NDPS / SC-ST / PC / others", "Interpretation of statutes"], "note": {"Facts": "Petitioners challenged the constitutional validity of the newly inserted Section 147-A of the Income-Tax Act, 1961 (effective 1 April 2026 but retrospectively deemed from 1 April 2021), alleging it was ultra-vires and violated the basic structure, Rule of Law and separation of powers, and also contested reassessment proceedings initiated by Jurisdictional Assessing Officers (JAOs) under Sections 148-A and 148 as being non-faceless and therefore without jurisdiction.", "Issue": "Whether a legislature can nullify a judicial pronouncement by enacting a retrospective provision (Section 147-A) without removing the basis of the earlier judgment, and whether the JAOs have jurisdiction to issue notices and conduct reassessment under the faceless assessment scheme.", "Held": "The Andhra Pradesh High Court struck down Section 147-A as unconstitutional and set aside the impugned reassessment proceedings, holding that the provision sought to override judicial findings without eliminating the defect identified by the courts and could not be inserted after the IT Act had been repealed.", "Principle": "A validating or retrospective enactment cannot stand if it does not remove the defect identified by the judiciary; the legislature cannot defeat a judgment by merely inserting a new provision without addressing the underlying basis of the decision.", "Provisions": "Sections 147-A, 148-A, 148, 151-A, 144-B of the Income-Tax Act, 1961; Finance Acts 2021, 2022, 2026; Notification No. 18/2022, 15/2022, 61/2022; cases Snehdham Trust v. CIT (2025) SCC OnLine Guj 5771, Prithvi Cotton Mills Ltd. v. Broach Borough Municipality (1969) 2 SCC 283.", "Exam angle": "Income-Tax Act – validity of retrospective/validating legislation under the Constitution (basic structure, Rule of Law). Could be asked as: *“Explain the limitation on Parliament’s power to enact retrospective provisions that seek to override judicial decisions, citing the Andhra Pradesh High Court’s decision on Section 147-A.”"}, "syllabus": {"clusters": ["Personal, local and constitutional", "Special criminal Acts", "Interpretation"], "acts": ["Constitution", "NDPS / SC-ST / PC / others", "Interpretation of statutes"], "landmark": false, "boost": 10}, "date": "2026-11-19"}, {"id": "91e1f6c60903", "source": "sccblog", "category": "high-court", "title": "Offering money, catching hold of a woman’s hand and asking her to accompany him to the jungle outrages her modesty: Himachal Pradesh High Court", "court": null, "case_name": null, "ratio": null, "summary": "Himachal Pradesh HC : The present criminal revision petition, challenging a decision by the Additional Session Judge, dealt with a conviction of an accused under Section 354 , Penal Code, 1860 (IPC) arising from an incident where he allegedly caught hold of the informant’s arm, offered her money, and asked her to accompany him to.", "url": "https://www.scconline.com/blog/post/2026/11/18/upheld-conviction-for-outraging-womens-modesty-hp-hc/", "priority": 80, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The informant was returning from the jungle when the accused offered her ₹100, caught hold of her arm/hand and asked her to accompany him to the jungle; she raised an alarm, witnesses arrived, and the accused fled.", "Issue": "Whether the accused’s conduct of offering money, seizing the woman’s hand and urging her to follow him amounts to “outraging the modesty” of a woman punishable under Section 354 IPC.", "Held": "The High Court dismissed the revision, affirming the conviction and sentence under Section 354 IPC, holding that the accused’s acts indeed outraged the informant’s modesty.", "Principle": "Any act that shocks the sense of decency of a woman and assaults her modesty, such as offering money and forcibly taking hold of her hand to lead her elsewhere, falls within Section 354 IPC; a hostile witness’s testimony is not to be discarded if corroborated by other evidence.", "Provisions": "Section 354, Indian Penal Code; Section 313, Criminal Procedure Code; cited cases – *Kuntegowda v. Thurubaiah* (2026 SCC OnLine SC 1485), *State of Maharashtra v. Jagmohan Singh Kuldip Singh Anand* (2004 7 SCC 659), *State of Kerala v. Puttumana Illath Jathavedan Namboodiri* (1999 2 SCC 452), *Dadu v. State of M.P.* (2025 SCC OnLine SC 2733), *Selvamani v. State of T.N.* (2024 SCC OnLine SC 837), *Krishnan v. State of T.N.* (2003 7 SCC 56), *Rupan Deol Bajaj v. Kanwar Pal Singh Gill* (1995 6 SCC 194), *Tarkeshwar Sahu v. State of Bihar* (2006 8 SCC 560), *State of Punjab v. Major Singh* (1966 SCC OnLine SC 51).", "Exam angle": "IPC 354 – elements of outraging a woman’s modesty; evidentiary rule on hostile witnesses (corroboration required). Could be asked as: “Explain the test for ‘outraging modesty’ under Section 354 IPC and discuss the treatment of hostile witness testimony.”"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-19"}, {"id": "4d5d0a08b04f", "source": "livelaw", "category": "supreme-court", "title": "Automatic Vesting Under Kerala Private Forests Act Applies Only If Land Falls Within Definition Of 'Private Forest': Supreme Court", "court": "Supreme Court", "case_name": "State of Kerala & Anr. v. P Krishna Pillai & Ors", "ratio": "The Forest Tribunal's finding, which was affirmed by the High Court…", "summary": "The Supreme Court has clarified that although the vesting of private forests in the Kerala Government under Section 3(1) of the Kerala Private Forests (Vesting and Assignment) Act, 1971.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1168-state-of-kerala-anr-v-p-krishna-pilla lse, "boost": -10}, "date": "2026-11-19"}, {"id": "a90d96120044", "source": "scobserver", "category": "supreme-court", "title": "Whose rights take precedence? SC to consider traders’ challenge to Delhi protests - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scobserver.in/journal/whose-rights-take-precedence-sc-to-consider-traders-challenge-to-delhi-protests/", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-19"}, {"id": "c748573f61dc", "source": "livelaw", "category": "supreme-court", "title": "Thiruparankundram Row | Thousands Of Survey Pillars Will Become Religious If HC Order Not Stayed, TN Govt Tells Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The State's plea seeks a stay of the Madras High Court's January 2026 division bench judgment , which upheld a December 2025 single-judge order directing the Arulmigu Subramaniaswamy Temple management to light the Karthigai Deepam at the disputed stone pillar (located about 50 metres from the Sikandar Badusha Dargah as per the High Court). The High Court had rejected the State's apprehensions of public-order disturbance as an “imaginary ghost” and held that the pillar stood on temple land.", "url": "https://www.livelaw.in/top-stories/thiruparankundram-row-thousands-of-survey-pillars-will-become-religious-if-hc-order-not-stayed-tn-govt-tells-supreme-court-558933", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-19"}, {"id": "b21a7eb2e4f0", "source": "livelaw", "category": "supreme-court", "title": "By Deleting 13 Crore Voters In SIR, ECI Hijacked Sovereignty To Favour A Political Party : Justice Gopala Gowda", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "\"SIR is not to delete the voters, to enable the political parties to bundle Form 7s to delete persons,\" he said.", "url": "https://www.livelaw.in/top-stories/by-deleting-13-crore-voters-in-sir-eci-hijacked-sovereignty-to-favour-a-political-party-justice-gopala-gowda-558972", "priority": 72, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-19"}, {"id": "97296990ea52", "source": "livelaw", "category": "supreme-court", "title": "Shiv Sena Dispute | Dissent Not Defection; Skipping Party Meeting Doesn't Mean Giving Up Membership : Eknath Shinde to Supreme Court", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "In the Shiv Sena dispute , Senior Advocate Dhruv Mehta , for Eknath Shinde, argued before the Supreme Court yesterday that there can't be a disqualification for not attending a meeting of a legislative party, as it cannot be regarded as voluntarily giving up of membership of a political party in terms of the Tenth Schedule.", "url": "https://www.livelaw.in/top-stories/shiv-sena-dispute-dissent-not-defection-skipping-party-meeting-doesnt-mean-giving-up-membership-eknath-shinde-to-supreme-court-558840", "priority": 71, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-19"}, {"id": "c0a4a986bf2b", "source": "livelaw", "category": "supreme-court", "title": "CJI Surya Kant Meets UN Special Rapporteur On Rights Of Persons With Disabilities, Says Supreme Court Will Set Up Committee On Disability Rights", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court will set up a Permanent Committee on the Rights of Persons with Disabilities, Chief Justice of India Justice Surya Kant announced on Wednesday. The CJI also directed the Supreme.", "url": "https://www.livelaw.in/top-stories/cji-surya-kant-meets-un-special-rapporteur-on-rights-of-persons-with-disabilities-says-supreme-court-will-set-up-committee-on-
