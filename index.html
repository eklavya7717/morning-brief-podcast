<script>
const DATA=[{"id": "5d597a1830e5", "source": "livelaw", "category": "supreme-court", "title": "Hindu Succession | Grandson Has No Birthright In Property Devolved On Father In Partition Of Grandfather's Estate : Supreme Court", "court": "Supreme Court", "case_name": "J Rajesh (Minor) Thr His Mother and Natural Guardian J Gomathi v. M Kumaran (Dead) Thr LRs & Ors", "ratio": "A son who inherits his father's property under Section 8 takes it absolutely, and that his own son has no right by birth in it.", "summary": "The Supreme Court held that once the grandfather's property devolved on his Class I heirs under Section 8 of the Hindu Succession Act, 1956, and was partitioned among them, the share allotted to the father became his exclusive property in his individual capacity, and that the grandson has no right by birth in such property.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1148-j-rajesh-minor-thr-his-mother-and-natural-guardian-j-gomathi-v-m-kumaran-dead-thr-lrs-ors-557963", "priority": 100, "topics": ["Civil procedure (CPC)", "Property & land", "Family & succession"], "date": "2026-11-10"}, {"id": "3bc337a154a7", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Directs UP Gov To Identify Undertrials Granted Bail But Haven't Been Released From Jail In 75 Districts", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court has stated that the exercise would cover all undertrial prisoners irrespective of whether they have engaged a private lawyer or have sought assistance of the District Legal Services Authority(DLSA). Further, it must be carried out with the help of the concerned DLSA.", "url": "https://www.livelaw.in/top-stories/supreme-court-directs-up-gov-to-identify-undertrials-granted-bail-but-havent-been-released-from-jail-in-75-districts-557933", "priority": 87, "topics": ["Criminal procedure (BNSS)", "Property & land"], "date": "2026-11-10"}, {"id": "6dde0887ec25", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Directs WhatsApp And Other Intermediaries To Inform Measures To Prevent Digital Arrest Scam & Cybercrimes", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "A bench comprising the Chief Justice of India Surya Kant, Justice Joymalya Bagchi, and Justice V Mohana issued the direction while hearing the suo motu case (In Re: Victims of Digital Arrest Related to Forged Documents) , and matters connected with it.", "url": "https://www.livelaw.in/top-stories/supreme-court-directs-whatsapp-apprise-court-measures-prevent-digital-arrest-scam-cybercrimes-557976", "priority": 86, "topics": ["General"], "date": "2026-11-10"}, {"id": "e90998b70a20", "source": "scobserver", "category": "supreme-court", "title": "Hum Do, Hamare Do? - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "Home > Analysis > Hum Do, Hamare Do? The top court was asked about a birth certificate and has now reopened its 2003 ruling on the two-child rule “Hum Do, Hamare Do” (We two, Our two), the family-planning slogan once made the size of an Indian family a matter of national concern. Two decades after.", "url": "https://www.scobserver.in/journal/hum-do-hamare-do-two-child-policy-supreme-court/", "priority": 82, "topics": ["General"], "date": "2026-11-10"}, {"id": "a87d078be724", "source": "sccblog", "category": "supreme-court", "title": "Supreme Court asks P&H HC to decide PIL petitioner’s locus before examining merits of religious conversion allegations", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: While considering a Special Leave Petition challenging the interim order dated 27 August 2026 passed by the Punjab and Haryana High Court in a Public Interest Litigation (PIL) concerning allegations relating to religious conversions and other activities, the Division Bench of Pamidighantam Sri Narasimha and Alok Aradhe, JJ. , declined to interfere with.", "url": "https://www. 26; eligible residents to get 1 BHK housing units", "court": null, "case_name": null, "ratio": null, "summary": "On 4 November 2026, the Government of NCT of Delhi has notified the Delhi Slum and Jhuggi Jhopri Relocation and Rehabilitation Policy, 2026, following its approval by the Delhi Urban Shelter Improvement Board (DUSIB) under Section 10(1) of the Delhi Urban Shelter Improvement Board (DUSIB) Act, 2010. The policy provides a structured mechanism for relocation.", "url": "https://www.scconline.com/blog/post/2026/11/10/delhi-slum-jhuggi-jhopri-relocation-rehabilitation-policy-2026/", "priority": 76, "topics": ["General"], "date": "2026-11-10"}, {"id": "23189d98cc2d", "source": "barandbench", "category": "high-court", "title": "With or without authority? The email controversy at Bombay High Court [Watch Video]", "court": null, "case_name": null, "ratio": null, "summary": "The Bombay High Court on October 29 quashed an administrative directive that froze trustee appointments to the Shree Saptashrungi Niwasini Devi Trust in Nashik, Maharashtra A division bench comprising Justices GS Kulkarni and Neela Gokhale ruled that District Judge Anju Shende, former Special Officer to then-Chief Justice Shree Chandrashekhar, acted with gross impropriety by issuing.", "url": "https://www.barandbench.com/news/with-or-without-authority-the-email-controversy-at-bombay-high-court-watch-video", "priority": 73, "topics": ["Criminal procedure (BNSS)"], "date": "2026-11-10"}, {"id": "72113361df9b", "source": "livelaw", "category": "high-court", "title": "'Compounding Of Companies Act Offence Extinguishes Foundation Of Criminal Prosecution': Patna High Court", "court": "Patna High Court", "case_name": "Subodh Kumar Goel v. State of Bihar and Anr", "ratio": "Once an offence under the Companies Act has been compounded by the competent statutory authority…", "summary": "The Patna HC has held that once an offence under the Companies Act has been compounded by the competent statutory authority, criminal prosecution founded on the same contravention cannot continue.", "url": "https://www.livelaw.in/high-court/patna-high-court/patna-high-court-compounding-companies-act-offence-extinguishes-foundation-criminal-prosecution-557921", "priority": 72, "topics": ["General"], "date": "2026-11-10"}, {"id": "0559fb22850d", "source": "livelaw", "category": "high-court", "title": "PAN Card And Voter ID Alone Cannot Prove Indian Citizenship Without Supporting Records : Gauhati High Court", "court": "Gauhati High Court", "case_name": "Kulchan Begum v. Union of India & Ors", "ratio": "PAN cards and Electoral Photo Identity Cards (EPICs) issued on the basis of self declarations without formal verification cannot by themselves establish Indian citizenship unless…", "summary": "The Gauhati High Court has held that PAN cards and Electoral Photo Identity Cards (EPICs) issued on the basis of self declarations without formal verification cannot by themselves establish Indian.", "url": "https://www.livelaw.in/high-court/gauhati-high-court/gauhati-high-court-pan-card-voter-id-cannot-prove-indian-citizenship-supporting-records-558039", "priority": 72, "topics": ["General"], "date": "2026-11-10"}, {"id": "f9e09d88caa6", "source": "livelaw", "category": "high-court", "title": "Noise Pollution From Mushrooming Construction Sites In Mumbai A Serious Issue Needing Urgent Redressal: Bombay High Court", "court": "Bombay High Court", "case_name": "Ashok Pathare v. State of Maharashtra & Ors", "ratio": "It cannot overlook the fact that pollution in Mumbai is a serious issue", "summary": "The Court noted that it cannot overlook the fact that pollution in Mumbai is a serious issue. It observed that strict noise pollution norms prescribing permissible decibel limits must be followed by all stakeholders.", "url": "https://www.livelaw.in/high-court/bombay-high-court/noise-pollution-construction-sites-mumbai-serious-issue-558011", "priority": 71, "topics": ["Environment"], "date": "2026-11-10"}, {"id": "2fc7c2132d3f", "source": "livelaw", "category": "high-court", "title": "'Mental Illness Cannot Be Ground For Divorce, Refusal To Undergo Treatment Not Automatically Cruelty': Jharkhand High Court", "court": "Jharkhand High Court", "case_name": "Anjali Devi v. Shashi Kumar Pandey and Anr", "ratio": "Mental illness cannot, by itself, be a ground for stigmatising a spouse or dissolving a marriage…", "summary": "The Jharkhand HC has held that mental illness cannot, by itself, be a ground for stigmatising a spouse or dissolving a marriage, and that refusal or inability to undergo medical treatment cannot.", "url": "https://www.livelaw.in/high-court/jharkhand-high-court/jharkhand-high-court-mental-illness-refusal-undergo-treatment-automatically-cruelty-558001", "priority": 71, "topics": ["Family & succession"], "date": "2026-11-10"}, {"id": "f51d34dc2769", "source": "sccblog", "category": "high-court", "title": "Can the police block a Facebook page through an SP’s intimation to Meta? P&H HC clarifies the authority prescribed under IT Rules, 2021", "court": null, "case_name": null, "ratio": null, "summary": "Punjab and Haryana High Court: In a writ petition challenging an intimation issued under Section 79(3) ( b ), Information Technology Act, 2000 (IT Act) to Meta Platforms Inc., pursuant to which the petitioner company’s verified Facebook page had been blocked in India since 21 August 2026, a Single Judge Bench of Tribhuvan Dahiya, J.,.", "url": "https://www.scconline.com/blog/post/2026/11/10/punjab-haryana-hc-facebook-page-blocking-superintendent-of-police-rule-3-1-d-it-rules-2021-dig-rank-copy-of-intimation-to-user/", "priority": 70, "topics": ["Constitutional law"], "date": "2026-11-10"}, {"id": "c4b79d574e1b", "source": "livelaw", "category": "high-court", "title": "Agricultural Entry In Revenue Records Alone Doesn't Exempt Land From SARFAESI Proceedings: Allahabad High Court", "court": "Allahabad High Court", "case_name": "Smt. Rama Chaurasia v. Debut Re
