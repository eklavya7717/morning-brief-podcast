const DATA=[{"id": "d53b931ff78e", "source": "livelaw", "category": "supreme-court", "title": "Legislator's Conviction Can't Be Stayed Only To Avoid Disqualification : Supreme Court", "court": "Supreme Court", "case_name": "STATE OF KARNATAKA v. VINAY RAJASHEKHARAPPA KULKARNI AND ANR", "ratio": "That a legislator's impending disqualification following conviction cannot, by itself, be a ground for staying the conviction…", "summary": "The Supreme Court has held that that a legislator's impending disqualification following conviction cannot, by itself, be a ground for staying the conviction, observing that such an interpretation would effectively allow every convicted legislator to continue in office and contest subsequent elections by obtaining a stay of conviction.", "url": "https://www.livelaw.in/top-stories/legislators-conviction-cant-be-stayed-only-to-avoid-disqualification-supreme-court-560195", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Karnataka MLA Vinay Kulkarni was convicted on 15 April 2026 for his role in the 2016 murder of BJP leader Yogesh Goudar. The Karnataka High Court stayed his conviction and sentence, fearing disqualification under Section 8(3) of the Representation of the People Act, 1951, and suspended sentences of eight convicts.", "Issue": "Whether the prospect of statutory disqualification of a legislator under Section 8(3) RPA 1951 can, by itself, justify a stay of conviction and suspension of sentence.", "Held": "The Supreme Court set aside the High Court’s orders, holding that the mere possibility of disqualification is not a sufficient ground to stay a conviction; a stay requires a palpable, fatal error in the judgment and an “eminently winnable” case.", "Principle": "A conviction may be stayed only in rare, exceptional cases where the appellant demonstrates a palpable, fatal error on the face of the record that strikes at the foundation of the judgment; the prospect of disqualification under Section 8(3) upreme-court", "title": "Motor Accident Claims | 'Act Only' Policy Won't Cover Gratuitous Passenger Of Private Vehicle : Supreme Court", "court": "Supreme Court", "case_name": "Sukumarbai & Ors v. United Insurance Company Ltd. & Anr", "ratio": null, "summary": "The Supreme Court on Wednesday (November 25) held that compulsory insurance under Section 147 of the Motor Vehicles Act, 1988 (MV Act) does not automatically cover gratuitous occupants of private vehicles or pillion riders under an 'Act Only Policy'. It also held that the absence of statutory or contractual liability is not an absolute bar to the Court directing an insurer to pay and recover under Article 142, but only in exceptional cases that meet four requirements as laid down in the ruling.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1212-sukumarbai-ors-v-united-insurance-company-ltd-anr-560149", "priority": 97, "topics": ["Constitution"], "note": {"Facts": "The Supreme Court on Wednesday (November 25) held that compulsory insurance under Section 147 of the Motor Vehicles Act, 1988 (MV Act) does not automatically cover gratuitous occupants of private vehicles or pillion riders under an 'Act Only Policy'. It also held that the absence of statutory or contractual liability is not an absolute bar to the Court directing an insurer to pay and recover under Article 142, but only in exceptional cases that meet four requirements as laid down in the ruling.", "Held": "Bench: Justice Vikram Nath, Justice Sandeep Mehta, Justice Aparesh Kumar Singh", "Provisions": "Noted that Section 147(1)(b)(i) specifically includes the owner of the goods or his authorised representative carried in the vehicle, while Section 147(1)("}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "b48e79802ba2", "source": "livelaw", "category": "supreme-court", "title": "Landlord's Bona Fide Need Not Be Defeated By Subsequent Events Merely Because Of Long Pendency Of Eviction Case : Supreme Court", "court": "Supreme Court", "case_name": "M/s PM Shah and Co. v. Asmit Vijay Vedak & Ors", "ratio": "A tenant cannot rely on changes brought about by the prolonged pendency of eviction proceedings to defeat a landlord's otherwise established claim of bona fide…", "summary": "The Supreme Court has held that a tenant cannot rely on changes brought about by the prolonged pendency of eviction proceedings to defeat a landlord's otherwise established claim of bona fide.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1207-ms-pm-shah-and-co-v-asmit-vijay-vedak-ors-560095", "priority": 96, "topics": ["Sale of Goods / Partnership"], "note": {"Facts": "The Supreme Court has held that a tenant cannot rely on changes brought about by the prolonged pendency of eviction proceedings to defeat a landlord's otherwise established claim of bona fide.", "Held": "A tenant cannot rely on changes brought about by the prolonged pendency of eviction proceedings to defeat a landlord's otherwise established claim of bona fide…", "Principle": "A tenant cannot rely on changes brought about by the prolonged pendency of eviction proceedings to defeat a landlord's otherwise established claim of bona fide…"}, "syllabus": {"clusters": ["Obligations"], "acts": ["Sale of Goods / Partnership"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "b7e3f54dd911", "source": "livelaw", "category": "supreme-court", "title": "Balance Sheet Entries Acknowledging Debt Extend Limitation For Insolvency Proceedings : Supreme Court", "court": "Supreme Court", "case_name": "UV Asset Reconstruction Company Ltd. v. Gautam Sinha & Ors", "ratio": "Such entries must be examined in the context of the balance sheet as a whole, including the notes and surrounding circumstances", "summary": "The Supreme Court has reiterated that a corporate debtor's balance sheet entries acknowledging debt constitute a valid acknowledgement of liability under Section 18 of the Limitation Act.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1209-uv-asset-reconstruction-company-ltd-v-gautam-sinha-ors-560115", "priority": 96, "topics": ["Limitation / Registration"], "note": {"Facts": "The Supreme Court has reiterated that a corporate debtor's balance sheet entries acknowledging debt constitute a valid acknowledgement of liability under Section 18 of the Limitation Act.", "Held": "Such entries must be examined in the context of the balance sheet as a whole, including the notes and surrounding circumstances", "Principle": "Such entries must be examined in the context of the balance sheet as a whole, including the notes and surrounding circumstances", "Provisions": "Provision: Section 18 of the Limitation Act, 1963"}, "syllabus": {"clusters": ["Property"], "acts": ["Limitation / Registration"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "19e7d5307537", "source": "livelaw", "category": "supreme-court", "title": "NCR Homeloan Subvention Scam : Supreme Court Directs Banks To Grant Prosecution Sanction Against Officers", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "A bench of CJI Surya Kant, Justice Joymalya Bagchi and Justice V Mohana was dealing with a batch of pleas concerning subvention schemes in India, where it earlier suspected an \"unholy nexus\" between builders and banks resulting in distress for homebuyers.", "url": "https://www.livelaw.in/top-stories/ncr-homeloan-subvention-scam-supreme-court-directs-banks-to-grant-prosecution-sanction-against-officers-560142", "priority": 96, "topics": ["BNSS / CrPC"], "note": {"Facts": "Homebuyers in Delhi-NCR invested in tripartite subvention schemes where builders promised to pay EMIs until possession; developers defaulted, banks and NBFCs pursued buyers for EMIs and disbursed loans directly to builders, breaching RBI guidelines.", "Issue": "Whether banks and NBFCs must grant unconditional sanction for prosecution of their officers in the corruption cases arising from the subvention scam.", "Held": "The Supreme Court directed the concerned banks and NBFCs (HDFC Bank, ICICI Bank, Sammaan Capital, PNB Housing Finance) to issue unconditional prosecution sanctions within one week, failing which their CMDs and Chairpersons must appear and show cause.", "Principle": "Courts may compel financial institutions to grant unconditional sanction for prosecution of their officers when FIRs are registered pursuant to judicial orders, to prevent coercive recovery actions against homebuyers.", "Provisions": "Not stated (the source does not cite specific statutes or sections).", "Exam angle": "Likely framed under the Banking Regulation Act / RBI guidelines and criminal procedure – focus on the requirement of sanction for prosecution of bank officers and the court’s power to direct unconditional sanction in cases of judicially-ordered FIRs."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-27"}, {"id": "e4c07a8bbafb", "source": "livelaw", "category": "supreme-court", "title": "Those Who Drew Innocent People To Naxalism Must Be Held Accountable : President Droupadi Murmu", "court": "Supreme Court", "case_name": null, "ratio": "Legal aid must go beyond formal assistance and ensure that poor litigants receive quality legal representation", "summary": "The President also spoke about access to justice, emphasising that timely justice is a critical challenge and efforts to improve justice delivery must address both pendency and the ability of disadvantaged people to access courts. She said that legal aid must go beyond formal assistance and ensure that poor litigants receive quality legal representation.", "url": "https://www.livelaw.in/top-stories/those-who-drew-innocent-people-to-naxalism-must-be-held-accountable-president-droupadi-murmu-560210", "priority": 96, "topics": ["Constitution"], "note": {"Facts": "President Droupadi Murmu, speaking at a Constitution Day event organised by the Supreme Court, observed that some surrendered Naxalites appeared innocent and questioned whether they were drawn into Naxalism by others.", "Issue": "Whether persons who recruit or induce innocent individuals into the Naxalite movement can be held legally accountable.", "Held": "The President urged that accountability should extend to those who “drew innocent people into the movement,” implying that liability is not limited to the surrendered participants.", "Principle": "Those who induce or facilitate the recruitment of innocent persons into an unlawful insurgent movement may be held responsible under the law, not merely the individuals who later surrender.", "Provisions": "not stated.", "Exam angle": "Could be framed under the Unlawful Activities (Prevention) Act or related anti-terrorism statutes, focusing on the element of recruitment/inducement as an ingredient of liability."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "8b13e4d63c07", "source": "scobserver", "category": "supreme-court", "title": "How reasonable is ‘reasonable’? - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "Home > Analysis > How reasonable is ‘reasonable’? This Constitution Day, we revisit the making of Article 19 and the constitutional limits on the State’s power to restrict protests. “Life would be meaningless”, wrote Hansa Mehta in May 1945, if the individual did not enjoy, among other freedoms, the right to speak, associate and convene.", "url": "https://www.scobserver.in/journal/how-reasonable-is-reasonable/", "priority": 95, "topics": ["Constitution"], "note": {"Facts": "The Supreme Court examined State restrictions on public protests, including the use of Section 144, CPC 1973, and the denial of bail to alleged conspirators under the Unlawful Activities (Prevention) Act, 1967, in the context of repeated demonstrations such as the 2011 Baba Ramdev agitation and the 2020 Delhi riots.", "Held": "The Court held that any restriction on the freedom of speech, expression or peaceful assembly must pass the test of proportionality; mere blanket prohibitions or repetitive orders amount to an abuse of power and are unconstitutional.", "Principle": "Restrictions on fundamental freedoms under Article 19 must be *reasonable* and *proportionate* to the intended public-order objective; otherwise they violate the Constitution.", "Provisions": "State of Bihar* (1962), *Ramlila Maidan* (2012), *Anuradha Bhasin v. Union of India* (2020), *Mazdoor Kisan Shakti Sangathan v. Union of India* (2018).", "Exam angle": "Questions may test the *Reasonableness Test* under Article 19(1) – ask candidates to list the ingredients of proportionality (legitimate aim, rational nexus, balance of convenience) and to apply them to statutory restrictions such as Section 144 or UAPA-based detentions."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "419ce33da470", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Quashes Bihar Govt's Remission Granted To Ex-MP Anand Mohan In IAS Officer's Murder Case", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Court directed Anand Mohan to surrender within a month, after finding that the 2023 amendment made to the remission policy, whereby the bar on persons sentenced to life for the murder of public servants from seeking remission was removed.", "url": "https://www.livelaw.in/top-stories/supreme-court-quashes-bihar-govts-remission-granted-to-ex-mp-anand-mohan-in-ias-officers-murder-case-560057", "priority": 93, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Former MP Anand Mohan, sentenced to life for the 1994 mob-lynching murder of IAS Officer G Krishnaiah, was released in April 2023 after the Bihar Government amended its remission policy to remove the bar on remission for murder of public servants.", "Issue": "Whether the 2023 amendment to Bihar’s remission policy, allowing persons sentenced to life for murdering a public servant to seek remission, is constitutionally valid.", "Held": "The Supreme Court set aside the remission, declared the amendment unconstitutional, and ordered Anand Mohan to surrender within a month.", "Principle": "An amendment that removes a statutory bar on remission for murder of public servants, without a rational and legitimate public purpose, violates Articles 14 and 21 of the Constitution; the victim must be heard before remission is granted, though the victim’s objection is not a veto.", "Provisions": "Articles 14, 21 of the Constitution; Rule 481(1)(a) of the Bihar Prison Manual, 2012 (as amended); the Bihar remission policy (pre-amendment bar of 20 years for murder of public servants).", "Exam angle": "Constitutional law – test of equality and due-process clauses (Arts 14, 21) in the context of remission statutes; could be asked on the validity of legislative/amendatory actions affecting punishment, or on procedural safeguards (hearing the victim) in remission decisions."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-27"}, {"id": "9cf3df4a9157", "source": "scobserver", "category": "supreme-court", "title": "Becoming a democracy - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "A brief history of how universal adult franchise brought India's marginalised into the electorate In 1950, the Constitution of India came into force, introducing universal adult franchise for the nation and granting everyone above 21 years of age the right to vote and shape democracy. For decades, this right had depended on property, education and.", "url": "https://www.scobserver.in/journal/becoming-a-democracy/", "priority": 92, "topics": ["Constitution"], "note": {"Facts": "The Constitution (1950) introduced universal adult franchise, abolishing property, education and community qualifications; later the 61st Amendment (1988) lowered the voting age to 18, and the Special Intensive Revision (SIR) of electoral rolls (2025) has prompted petitions on disenfranchisement.", "Issue": "Whether the constitutional guarantee of universal adult franchise (Article 326) bars any form of disenfranchisement arising from the SIR of electoral rolls.", "Held": "Not stated in the source (no judicial decision reported).", "Principle": "Universal adult franchise is a constitutional right that must be exercised without restrictive qualifications, ensuring equal political participation for all adults.", "Provisions": "Article 326 of the Constitution (as introduced by Draft Article 289B); 61st Amendment (reduction of voting age to 18); SIR (Special Intensive Revision) – no specific case law cited.", "Exam angle": "Questions may test the scope of Article 326 and the 61st Amendment, asking how the Supreme Court might evaluate challenges to electoral roll revisions under the principle of universal adult franchise."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "bd7d9ad8e673", "source": "scobserver", "category": "supreme-court", "title": "Voices on Constitution Day - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scobserver.in/journal/voices-on-constitution-day/", "priority": 92, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "efa8128e76a0", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Must Not Remain A Court Of Privileged Few : CJI llabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Rajasthan laws"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "d27a729104e2", "source": "sccblog", "category": "supreme-court", "title": "Constitution Day 2026: CJI emphasises individual-centric constitutional governance, institutional restraint and shared responsibility of bench and bar", "court": null, "case_name": null, "ratio": null, "summary": "On Constitution Day, 26 November 2026, addressing the members of the Supreme Court Bar Association, the Chief Justice of India reflected on the enduring relevance of the Constitution , the responsibility of constitutional institutions towards citizens, and the shared role of the Bench and the Bar in translating constitutional promises into lived realities. The CJI.", "url": "https://www.scconline.com/blog/post/2026/11/26/constitution-day-2026-cji-address-bench-bar-constitutional-governance/", "priority": 88, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "7ca8244c996c", "source": "sccblog", "category": "supreme-court", "title": "Law Day and the Rule of Law: When Commercial Justice Meets Constitutional Principles", "court": null, "case_name": null, "ratio": null, "summary": "Introduction Law Day is observed on 26 November to mark the adoption of the Constitution in 1949. Commercial law is seldom a part of the discussion on the day. Yet for a supplier waiting for payment, a contractor whose bills are withheld or a company holding an award it cannot enforce, the Rule of Law.", "url": "https://www.scconline.com/blog/post/2026/11/26/rule-of-law-in-commercial-disputes/", "priority": 88, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-27"}, {"id": "dd0aa350970e", "source": "sccblog", "category": "high-court", "title": "Can a driver be prosecuted under Essential Commodities Act and IPC merely for driving a vehicle allegedly used to transport diverted PDS grains? Patna HC answers", "court": null, "case_name": null, "ratio": null, "summary": "Patna High Court: In an application filed under Section 482 , Criminal Procedure Code, 1973 (CrPC) the petitioner sought to quash the order dated 29 July 2016 passed by the Sub-Divisional Judicial Magistrate (SDJM), Sheikhpura rejecting his discharge application in a case concerning the alleged diversion of Public Distribution System (PDS) foodgrains to a rice.", "url": "https://www.scconline.com/blog/post/2026/11/27/patna-hc-tractor-driver-pds-grains-section-7-ec-act-sections-409-420-120b-ipc-proceedings-quashed-no-entrustment-conspiracy/", "priority": 85, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": null, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-27"}, {"id": "9d5b9a91226d", "source": "livelaw", "category": "supreme-court", "title": "Employee Can't Claim Right To Absorption Against Unsanctioned Post Just Because Of Eligibility: Supreme Court", "court": "Supreme Court", "case_name": "BRIJ KUMAR MISHRA v. NILAMBER PITAMBAR UNIVERSITY & ORS", "ratio": "“eligibility is merely a qualifying condition and cannot create a right where no post exists", "summary": "The Supreme Court has held that a teacher's acquisition of the prescribed academic qualifications does not, by itself, entitle him to absorption in a university or college against an unsanctioned.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1210-brij-kumar-mishra-versus-nilamber-pitambar-university-ors-560119", "priority": 78, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-27"}, {"id": "e5a621962785", "source": "telegram-pdf", "category": "na gory": "supreme-court", "title": "Will's Registration In Presence Of Two Witnesses Prima Facie Proves Execution, Expert Opinion Cannot Override It: Supreme Court", "court": "Supreme Court", "case_name": "Babita Chopra v. State (GNCT of Delhi) & Anr", "ratio": "Substantive evidence must prevail over expert opinion when determining the genuineness of a document…", "summary": "Observing that substantive evidence must prevail over expert opinion when determining the genuineness of a document, the Supreme Court has quashed a forgery case against a woman accused of forging.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1200-babita-chopra-versus-state-gnct-of-delhi-anr-559959", "priority": 100, "topics": ["BNS / IPC"], "note": {"Facts": "Observing that substantive evidence must prevail over expert opinion when determining the genuineness of a document, the Supreme Court has quashed a forgery case against a woman accused of forging.", "Held": "Substantive evidence must prevail over expert opinion when determining the genuineness of a document…", "Principle": "Substantive evidence must prevail over expert opinion when determining the genuineness of a document…"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC"], "landmark": false, "boost": 12}, "date": "2026-11-26"}, {"id": "90cdd78757b2", "source": "livelaw", "category": "supreme-court", "title": "Prosecution Case Fails When Medical Evidence Is Completely Opposite Eyewitness Account : Supreme Court Acquits In 1986 Murder Case", "court": "Supreme Court", "case_name": "PRABHU SINGH v. STATE OF UTTAR PRADESH", "ratio": "Where the medical evidence is completely inconsistent with the eyewitness account and there is no plausible explanation for the contradiction…", "summary": "The Supreme Court on Wednesday (November 25) has acquitted a man who was convicted of murder, holding that where the medical evidence is completely inconsistent with the eyewitness account and there is no plausible explanation for the contradiction, the prosecution cannot rely solely on ocular testimony to secure a conviction.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1203-prabhu-singh-versus-state-of-uttar-pradesh-560012", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "The Supreme Court on Wednesday (November 25) has acquitted a man who was convicted of murder, holding that where the medical evidence is completely inconsistent with the eyewitness account and there is no plausible explanation for the contradiction, the prosecution cannot rely solely on ocular testimony to secure a conviction.", "Held": "Where the medical evidence is completely inconsistent with the eyewitness account and there is no plausible explanation for the contradiction…", "Principle": "Where the medical evidence is completely inconsistent with the eyewitness account and there is no plausible explanation for the contradiction…"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-26"}, {"id": "8acf2ac0b0d9", "source": "livelaw", "category": "supreme-court", "title": "Children Are Not Mere Chattels, Nor Toys For Parents: Supreme Court In Custody Battle", "court": "Supreme Court", "case_name": "J Sakthi Devi @ Chriti v. Joseph Charles", "ratio": "The welfare of a child must take precedence over the legal rights of parents in custody disputes.", "summary": "Supreme Court judgment in J Sakthi Devi @ Chriti v. Joseph Charles. The ruling: The welfare of a child must take precedence over the legal rights of parents in custody disputes.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1199-j-sakthi-devi-chriti-v-joseph-charles-559957", "priority": 96, "topics": ["Hindu / Muslim law"], "note": {"Facts": "Supreme Court judgment in J Sakthi Devi @ Chriti v. Joseph Charles. The ruling: The welfare of a child must take precedence over the legal rights of parents in custody disputes.", "Held": "The welfare of a child must take precedence over the legal rights of parents in custody disputes.", "Principle": "The welfare of a child must take precedence over the legal rights of parents in custody disputes."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Hindu / Muslim law"], "landmark": false, "boost": 8}, "date": "2026-11-26"}, {"id": "bb01b5423eed", "source": "livelaw", "category": "supreme-court", "title": "Supreme Court Revives Conviction & Life Sentence Of Ex-Congress MLA Vinay Kulkarni In 2016 Yogesh Goudar Murder Case", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "The Supreme Court today set aside the Karnataka High Court order staying conviction and suspending life sentence of former Congress MLA Vinay Kulkarni for the murder of BJP Zilla Panchayat member.", "url": "https://www.livelaw.in/top-stories/supreme-court-revives-conviction-and-life-sentence-of-ex-congress-mla-vinay-kulkarni-in-2016-yogesh-goudar-murder-case-559867", "priority": 95, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "Former Congress MLA Vinay Kulkarni was convicted by a Special Court for the 2016 murder of BJP Zilla Panchayat member Yogesh Goudar; the Karnataka High Court stayed the conviction and suspended his life sentence pending appeal.", "Issue": "Whether the High Court’s stay of conviction and suspension of life sentence for Kulkarni (and other convicts) is valid.", "Held": "The Supreme Court set aside the Karnataka High Court order, restoring Kulkarni’s conviction and life sentence, and also set aside the suspension of sentences of the other convicts.", "Principle": "A stay of conviction and suspension of sentence by a High Court is impermissible where the appellate court has not yet disposed of the criminal appeal, and the Supreme Court may restore the original conviction and sentence.", "Provisions": "Sections 143, 147, 148, 120-B, 302, 201 read with 149 of the IPC; Sections 25 read with 3, 5, 8 and 29 of the Arms Act, 1959; Special Court conviction; Karnataka High Court order; Supreme Court judgment.", "Exam angle": "Criminal Procedure Code – power of appellate courts to stay convictions and sentences; examine the conditions for granting a stay of conviction/sentence and the hierarchy of appeals (e.g., SLP, High Court, Supreme Court)."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-26"}, {"id": "3890882eb4a4", "source": "livelaw", "category": "supreme-court", "title": "'Cash For Jobs' Case: Supreme Court Directs Trial Court To Defer Proceedings Against Ex-TN Minister Senthil Balaji", "court": "Supreme Court", "case_name": "Tamil Nadu Minister v. Senthil Balaji", "ratio": null, "summary": "A bench comprising Chief Justice of India Surya Kant, Justice Joymalya Bagchi and Justice V Mohana passed the direction after Senior Advocate Kapil Sibal, appearing for Balaji, informed the Court that the case was listed before the trial court for framing of charges. The State however denied that the matter was listed before the trial court for framing of charge.", "url": "https://www.livelaw.in/top-stories/cash-for-jobs-case-supreme-court-directs-trial-court-to-defer-proceedings-against-ex-tn-minister-senthil-balaji-559942", "priority": 95, "topics": ["BNSS / CrPC"], "note": {"Facts": "Former Tamil Nadu Minister V Senthil Balaji is facing a corruption “cash-for-jobs” case; the trial court was scheduled to frame charges, but parties disputed the listing and sought adjournment.", "Issue": "Whether the Supreme Court should order the trial court to defer the proceedings pending further hearing.", "Held": "The Supreme Court directed the trial court to adjourn the matter to a date in the week commencing 14 December 2026.", "Principle": "The Court may defer trial-court proceedings when the issue before it is limited to bail and when premature charge-framing would prejudice the accused, emphasizing that serious allegations must not lead to condemnation without hearing.", "Provisions": "not stated.", "Exam angle": "Criminal Procedure Code (adjournment, framing of charges, bail) – could be asked on the scope of Supreme Court’s power to direct trial courts to defer proceedings or on the procedural safeguards against premature charge-framing."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-26"}, {"id": "83994d108893", "source": "livelaw", "category": "legislation", "title": "Sale Deed For UP Property Registered Outside State After 1994 Amendment To Registration Act Is Void: Allahabad High Court", "court": "Allahabad High Court", "case_name": "Dharmendra Kumar and another v. State Bank of India Central Office", "ratio": null, "summary": "Allahabad High Court judgment in Dharmendra Kumar and another v. State Bank of India Central Office.", "url": "https://www.livelaw.in/high-court/allahabad-high-court/allahabad-high-court-deed-up-land-registered-mumbai-1994state-amendment-void-559849", "priority": 91, "topics": ["Transfer of Property", "Limitation / Registration"], "note": {"Facts": "A sale deed concerning immovable property in Uttar Pradesh was registered by the Sub-Registrar at Mumbai after the 1994 amendment to the Registration Act.", "Issue": "Whether a registration of a Uttar Pradesh immovable-property document by a registrar outside the state is valid after the 1994 amendment.", "Held": "The registration is void because the Sub-Registrar at Mumbai lacks jurisdiction to register the document.", "Principle": "When the Registration (U.P. Amendment) Act, 1994 omits Section 30(2) and Section 67 of the Registration Act, 1908 for Uttar Pradesh, only a registrar within Uttar Pradesh can register documents relating to immovable property situated in that state; any registration outside the state is void.", "Provisions": "Registration (U.P. Amendment) Act, 1994; Section 30(2) and Section 67 of the Registration Act, 1908 (omitted for Uttar Pradesh).", "Exam angle": "Registration Act – jurisdiction of sub-registrars; could be asked to frame the issue of “jurisdiction of registration of immovable property” or to list the essential ingredients for valid registration under the amended Act."}, "syllabus": {"clusters": ["Property"], "acts": ["Transfer of Property", "Limitation / Registration"], "landmark": false, "boost": 8}, "date": "2026-11-26"}, {"id": "58ce063ffde7", "source": "livelaw", "category": "supreme-court", "title": "Knanaya Christians Move Supreme Court Against Kerala HC Verdict Invalidating Excommunication For Marrying Outside Community", "court": "Supreme Court", "case_name": null, "ratio": "The balancing of denominational rights under Article 26(b) with other fundamental rights, particularly Article 21…", "summary": "A bench of Justice BV Nagarathna, Justice R Mahadevan and Justice Sanjeev Sachdeva listed the SLP on January 5 th , 2027 along with other SLPs against the HC judgment.", "url": "https://www.livelaw.in/top-stories/knanaya-christians-move-supreme-court-against-kerala-hc-verdict-invalidating-excommunication-for-marrying-outside-community-559987", "priority": 91, "topics": ["Constitution"], "note": {"Facts": "A suit filed in 2015 by Knanaya Catholics sought a declaration that a member would not lose Archeparchy membership for marrying outside the community; the trial court granted relief in 2021, which was upheld on appeal, but the Kerala High Court (HC) on 23 Mar 2026 held that endogamy is not an established custom or essential religious practice and ordered the Church to readmit excluded members, invoking fundamental rights against a non-State actor.", "Issue": "Whether the Knanaya community’s practice of endogamy qualifies as an essential religious practice/custom protected under Articles 26(b) and 29(1) of the Constitution, and whether the HC may subject such religious-denominational practices to Part III scrutiny and enforce mandatory injunctions against the Church.", "Held": "The Supreme Court has listed the Special Leave Petitions for hearing after the nine-judge Constitution Bench decides the Sabarimala reference; no substantive decision on the merits has been rendered yet.", "Principle": "The protection of a distinct religious denomination’s internal customs (including endogamy) under Article 26(b) and cultural rights under Article 29(1) must be balanced against fundamental rights, and the validity of the “essential religious practice” test and horizontal enforcement of fundamental rights against religious bodies remain to be determined by the Court.", "Provisions": "Constitution Arts 25, 26, 29 (including 26(b) & 29(1)); Indian Christian Marriage Act 1872; Cochin Christian Civil Marriage Act 1920; Code of Canons of the Eastern Churches Canons 6(2) & 1509; Specific Relief Act (referred); Sabarimala reference (Arts 25 & 26 interplay); Dawoodi Bohra excommunication reference (Art 26(b) vs Art 21).", "Exam angle": "Constitutional Law – test the scope of Articles 26 (b) (denominational autonomy) versus Articles 25/29 and Part III rights; possible question on “essential religious practice” test, horizontal enforcement of fundamental rights, or the applicability of specific relief provisions to religious injunctions."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-26"}, {"id": "552edda74f8b", "source": "sccblog", "category": "supreme-court", "title": "Shardul Amarchand Mangaldas & Co. hosts high-level debate on the right to privacy and the limits of State surveillance", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scconline.com/blog/post/2026/11/25/shardul-amarchand-mangaldas-debate-right-to-privacy-state-surveillance/", "priority": 84, "topics": ["Constitution"], "note": {"Facts": "Shardul Amarchand Mangaldas & Co organised a debate on 22 Nov 2026 on whether the right to privacy precludes state-enabled technological surveillance, featuring former chief justices, senior advocates and a jurist.", "Issue": "Does the constitutional right to privacy bar the State from using technology-enabled surveillance for security, crime prevention or public order?", "Held": "No judicial decision was rendered; the event was a scholarly debate, not a court judgment.", "Principle": "The debate highlighted the tension between privacy and state security, but no binding rule of law was articulated.", "Provisions": "not stated."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-26"}, {"id": "a92bdd61a4a9", "source": "sccblog", "category": "high-court", "title": "Whether compelling disclosure of device passwords violate Article 20(3)? Supreme Court leaves issue to Delhi High Court", "court": null, "case_name": null, "ratio": null, "summary": "Supreme Court: While considering a challenge to the Delhi High Court’s certain directions, including one on handing over electronic devices along with their passwords, a Division Bench of Ujjal Bhuyan and Atul S. Chandurkar, JJ., opined that since the matter is pending before the High Court, the High Court should decide whether compelling disclosure of.", "url": "https://www.scconline.com/blog/post/2026/11/25/sc-asks-del-hc-compelled-disclosure-of-device-passwords-article-20-3-self-incrimination/", "priority": 81, "topics": ["BNSS / CrPC", "Constitution"], "note": {"Facts": "The petitioner had an anticipatory bail application pending before the Delhi High Court and was under interim protection from arrest; the High Court directed him to hand over his laptop and mobile phone with passwords to the investigating officer.", "Issue": "Whether a court can compel an accused to disclose passwords of electronic devices, amounting to self-incrimination prohibited by Article 20(3) of the Constitution.", "Held": "The Supreme Court held that, since the matter is pending before the Delhi High Court, the High Court should decide the question of compelled password disclosure under Article 20(3). It also continued the petitioner’s interim protection from arrest until disposal of the anticipatory bail application.", "Principle": "When a legal issue concerning self-incrimination and compelled disclosure of passwords arises in a pending bail matter, the higher court may defer the decision to the lower court hearing the case, allowing it to determine whether such compulsion violates Article 20(3).", "Provisions": "Article 20(3) of the Constitution of India; Delhi High Court directions (paragraph 7); Supreme Court order disposing the SLP.", "Exam angle": "Article 20(3) – could be asked to frame the issue of whether compelled password disclosure is testimonial communication; examine the ingredients of self-incrimination and the role of higher courts in remanding such questions to lower courts."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Constitution"], "landmark": false, "boost": 13}, "date": "2026-11-26"}, {"id": "a8f321eda45e", "source": "livelaw", "category": "high-court", "title": "Allahabad High Court Upholds 25-Year Sentence Of Man Convicted For Rape Of 5-Year-Old Girl", "court": "Allahabad High Court", "case_name": null, "ratio": null, "summary": "Confirming the conviction under Section 376(2) IPC read with Section 6 of the POCSO Act , a bench of Justice Abdul Shahid said the prosecution proved its case beyond reasonable doubt through ocular and medical evidence.", "url": "https://www.livelaw.in/high-court/allahabad-high-court/allahabad-hc-upholds-25-year-sentence-rape-five-year-old-girl-560006", "priority": 77, "topics": ["BNS / IPC", "BNSS / CrPC", "Probation / JJ / POCSO / DV"], "note": {"Facts": "The appellant was convicted for raping a 5-year-old girl in October 2013; the trial court sentenced him to 25 years’ rigorous imprisonment under Sec. 376(2) IPC read with Sec. 6 POCSO Act, based on the child’s testimony, corroborative family testimony and ocular-medical evidence.", "Issue": "Whether the conviction and 25-year sentence under Sec. 376(2) IPC read with Sec. 6 POCSO Act should be upheld.", "Held": "The Allahabad High Court affirmed the conviction and the 25-year term, dismissing the appeal.", "Principle": "When the prosecution proves rape of a child beyond reasonable doubt through consistent victim testimony, corroborative natural witnesses and medical evidence, the conviction and sentence under Sec. 376(2) IPC read with Sec. 6 POCSO Act stand.", "Provisions": "Sec. 376(2) Indian Penal Code; Sec. 6 Protection of Children from Sexual Offences (POCSO) Act; no other statutes or cases cited.", "Exam angle": "POCSO Act – issues on admissibility of child testimony, corroboration, and sentencing under Sec. 6; could be asked to frame the ingredients of a conviction under Sec. 376(2) IPC/ Sec. 6 POCSO and the evidentiary standards required."}, "syllabus": {"clusters": ["Evidence and crime", "Special criminal Acts"], "acts": ["BNS / IPC", "BNSS / CrPC", "Probation / JJ / POCSO / DV"], "landmark": false, "boost": 13}, "date": "2026-11-26"}, {"id": "93b8db468b66", "source": "sccblog", "category": "high-court", "title": "SC Collegium recommends appointment of Chief Justices for High Courts of Jharkhand, Karnataka and Tripura", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scconline.com/blog/post/2026/11/25/sc-collegium-recommendations-chief-justice-3-high-courts/", "priority": 76, "topics": ["Constitution"], "note": null, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-26"}, {"id": "5069d86b2678", "source": "scobserver", "category": "supreme-court", "title": "Supreme Court or ‘a sort of peripatetic court’? - Supreme Court Observer", "court": d": "d87cd9976281", "source": "livelaw", "category": "supreme-court", "title": "Delay In Trial No Ground For Bail When Accused Has Criminal Antecedents, Previous Conviction: Supreme Court", "court": "Supreme Court", "case_name": "CHANDER PAL v. RAHUL @ VIKRAM & ANR", "ratio": null, "summary": "A mere delay in trial cannot be a ground to enlarge an accused on bail on the strength of his right to a speedy trial while overlooking his antecedents and previous conviction, observed the Supreme Court, while setting aside the bail granted to an accused who had been granted bail in a murder case on the strength of his right to a speedy trial, overlooking his antecedents and previous conviction in an attempt to murder case involving the same deceased person.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1191-chander-pal-versus-rahul-vikram-anr-559710", "priority": 100, "topics": ["BNS / IPC", "BNSS / CrPC"], "note": {"Facts": "A mere delay in trial cannot be a ground to enlarge an accused on bail on the strength of his right to a speedy trial while overlooking his antecedents and previous conviction, observed the Supreme Court, while setting aside the bail granted to an accused who had been granted bail in a murder case on the strength of his right to a speedy trial, overlooking his antecedents and previous conviction in an attempt to murder case involving the same deceased person.", "Held": "Bench: Justice Prashant Kumar Mishra, Justice Shree Chandrashekhar"}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNS / IPC", "BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-25"}, {"id": "310f3f4510d1", "source": "livelaw", "category": "high-court", "title": "Can Govt Job Be Denied To Selected Candidate Solely Due To Pending Criminal Case? Rajasthan High Court Refers To Larger Bench", "court": "Rajasthan High Court", "case_name": "Rajneesh Kumar v. State of Rajasthan & Ors", "ratio": null, "summary": "The Rajasthan High Court has referred to a larger bench the question of whether appointment to public service can be denied to an otherwise meritorious and selected candidate solely on the ground of pendency of a criminal case against them, in the absence of any conviction. Taking note of the divergent views expressed by the Supreme Court as well as different Division Benches of the High.", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-refers-larger-bench-mere-pendency-criminal-case-559837", "priority": 100, "topics": ["BNSS / CrPC", "Rajasthan laws", "Constitution"], "note": {"Facts": "A meritorious candidate selected for a government post faces denial of appointment solely because a criminal case against him is pending, with no conviction.", "Issue": "Whether a pending criminal case, absent a conviction, can be a ground to refuse appointment to public service.", "Held": "The Rajasthan High Court has referred the question to a larger bench for consideration.", "Principle": "The legality of denying appointment on the basis of pendency of a criminal case, without a conviction, is unsettled and requires authoritative clarification.", "Provisions": "not stated", "Exam angle": "Service recruitment/appointment under the Constitution/Administrative Law – could be framed as whether the absence of a conviction bars appointment, focusing on the statutory or constitutional criteria for eligibility."}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNSS / CrPC", "Rajasthan laws", "Constitution"], "landmark": true, "boost": 21}, "date": "2026-11-25"}, {"id": "aa32a3a93756", "source": "livelaw", "category": "legislation", "title": "JJ Act Amendment Mandating Trial By Children's Courts Has Retrospective Effect: Delhi High Court", "court": "Delhi High Court", "case_name": null, "ratio": null, "summary": "The Delhi High Court has held that the 2021 amendment to Section 86(4) of the Juvenile Justice (Care and Protection of Children) Act, 2015, which mandates that offences under the Act be tried by a Children's Court, will have retrospective effect and will also apply to trials pending before Judicial Magistrates of First Class. A Division Bench comprising Justice Navin Chawla and Justice.", "url": "https://www.livelaw.in/high-court/delhi-high-court/jj-act-amendment-mandating-trial-by-childrens-courts-has-retrospective-effect-delhi-high-court-559723", "priority": 90, "topics": ["Probation / JJ / POCSO / DV", "Interpretation of statutes"], "note": {"Facts": "The Delhi High Court examined the 2021 amendment to Section 86(4) of the Juvenile Justice (Care and Protection of Children) Act, 2015, which requires that offences under the Act be tried by a Children’s Court, and considered its applicability to cases already pending before Judicial Magistrates of First Class.", "Issue": "Whether the 2021 amendment to Section 86(4) of the JJ Act has retrospective effect and can be applied to trials already underway before Judicial Magistrates of First Class.", "Held": "The Court held that the amendment is retrospective and will apply to pending trials before Judicial Magistrates of First Class.", "Principle": "An amendment to a procedural provision of the Juvenile Justice Act, specifically mandating trial by Children’s Courts, operates retrospectively and governs cases already in progress.", "Provisions": "Section 86(4) of the Juvenile Justice (Care and Protection of Children) Act, 2015 (as amended in 2021); not stated any other statutes or cases.", "Exam angle": "Juvenile Justice Act, 2015 – amendment to Section 86(4); could be asked on the retrospective operation of statutory amendments and the requirement that offences under the Act be tried by Children’s Courts."}, "syllabus": {"clusters": ["Special criminal Acts", "Interpretation"], "acts": ["Probation / JJ / POCSO / DV", "Interpretation of statutes"], "landmark": false, "boost": 9}, "date": "2026-11-25"}, {"id": "052ae4c9003b", "source": "livelaw", "category": "supreme-court", "title": "Motor Accident Claims | Compensation Can't Be Increased Compositely Without Examining Each Individual Head : Supreme Court", "court": "Supreme Court", "case_name": "Mohammad Sabir v. Ramesh Prasad & Ors", "ratio": null, "summary": "A bench of Justice Ujjal Bhuyan and Justice Atul S Chandurkar made the observation while modifying the Madhya Pradesh High Court's judgment, which had enhanced the compensation awarded by the Motor Accident Claims Tribunal (MACT) by a lump sum of Rs 2 lakh without examining the individual heads of compensation.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1197-mohammad-sabir-v-ramesh-prasad-ors-559776", "priority": 88, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-25"}, {"id": "7b98572c7f1f", "source": "livelaw", "category": "high-court", "title": "Person Named In Suicide Note Can't Be Charged With Abetment Solely On Allegations Of Harassment: Rajasthan High Court", "court": "Rajasthan High Court", "case_name": "Gopal Kansara & Ors. v. State of Rajasthan & Ors", "ratio": "Mere allegations of harassment against a person named in a suicide note cannot sustain a charge of abetment of suicide unless the allegations disclose the…", "summary": "The Rajasthan High Court has held that mere allegations of harassment against a person named in a suicide note cannot sustain a charge of abetment of suicide unless the allegations disclose the essential ingredients of the offence, including intentional instigation. The bench of Justice Farjand Ali observed that allegations of harassment arising out of a property dispute.", "url": "https://www.livelaw.in/high-court/rajasthan-high-court/rajasthan-high-court-threats-property-dispute-abetment-of-suicide-559838", "priority": 85, "topics": ["BNS / IPC", "Rajasthan laws"], "note": {"Facts": "The deceased’s suicide note named a person and alleged harassment arising from a property dispute and threats.", "Issue": "Whether mere allegations of harassment in a suicide note suffice to constitute abetment of suicide.", "Held": "The court held that such allegations do not sustain a charge of abetment of suicide unless they disclose the essential ingredients of the offence, including intentional instigation.", "Principle": "A charge of abetment of suicide requires proof of intentional instigation; mere allegations of harassment without such proof are insufficient.", "Provisions": "not stated"}, "syllabus": {"clusters": ["Evidence and crime", "Personal, local and constitutional"], "acts": ["BNS / IPC", "Rajasthan laws"], "landmark": false, "boost": 13}, "date": "2026-11-25"}, {"id": "5be8387b13bd", "source": "livelaw", "category": "high-court", "title": "TN Govt Moves Madras High Court Against Former Minister K Ponmudi's Acquittal In Alleged Red Sand Mining Case", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "Justice V Lakshminarayanan has issued notice to Ponmudi and other accused in an application filed by the State seeking to condone a delay of 166 days in filing the appeal.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-ponmudi-acquittal-red-sand-mining-case-appeal-filed-559835", "priority": 80, "topics": ["BNSS / CrPC"], "note": {"Facts": "The Tamil Nadu State filed an application before the Madras High Court seeking to condone a 166-day delay in filing an appeal against the Sessions Court’s order acquitting former DMK minister K Ponmudi and others in an alleged red-sand-mining case. Justice V Lakshminarayanan issued notice to Ponmudi and the other accused.", "Issue": "Whether the High Court should entertain the State’s request to condone the 166-day delay in filing the appeal against the acquittal.", "Held": "The Court issued notice to the respondents, indicating that the application for condoning the delay will be heard.", "Principle": "A High Court may entertain an application for condonation of delay in filing an appeal and must issue notice to the opposite party before deciding the matter.", "Provisions": "not stated."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-25"}, {"id": "a3408d768272", "source": "livelaw", "category": "supreme-court", "title": "No Voter Or Candidate Has Vested Right Of Reservation In A Particular Constituency; Govt's Discretion Over Rotation : Supreme Court", "court": "Supreme Court", "case_name": "SAU. RUPALI INDRABHUSHAN SONDE @ KU. RUPALI SHARADRAO BADHIYE v. STATE OF MAHARASHTRA", "ratio": null, "summary": "Supreme Court judgment in SAU. RUPALI INDRABHUSHAN SONDE @ KU. RUPALI SHARADRAO BADHIYE v. STATE OF MAHARASHTRA.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1195-sau-rupali-indrabhushan-sonde-ku-rupali-sharadrao-badhiye-v-the-state-of-maharashtra-559750", "priority": 79, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-25"}, {"id": "18148a75d767", "source": "livelaw", "category": "high-court", "title": "FIR Lodged Against TVK MLA For Sending Obscene Messages To District Collector: Tamil Nadu Police Informs Madras High Court", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The court was hearing a plea by a woman advocate seeking directions to the DGP and the Superintendent of Police to register an FIR against and conduct a fair, impartial, and expeditious investigation in the matter.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-tvk-mla-obscene-messages-kallakurichi-collector-559727", "priority": 78, "topics": ["BNSS / CrPC"], "note": {"Facts": "An FIR was registered against TVK MLA Arul Vignesh for allegedly sending obscene WhatsApp messages to the Kallakurichi District Collector and allegedly trespassing at her official residence.", "Issue": "Whether the police and the State must register an FIR, conduct an impartial investigation, and constitute a POSH-Act Internal Complaints Committee when a woman officer’s dignity is allegedly affronted by an elected representative.", "Held": "The Madras High Court directed the police to file a final report by 22 December, to constitute an Internal Complaints Committee under the POSH Act, and to ensure proactive removal of the obscene posts; it emphasized that senior police officials must oversee the investigation.", "Principle": "When an allegation of sexual harassment or obscene communication involves a woman officer, the State must ensure a prompt FIR, an impartial investigation, and compliance with the POSH Act’s requirement of an Internal Complaints Committee, irrespective of the accused’s status.", "Provisions": "POSH Act (reference to Internal Complaints Committee); not stated – no specific sections or case law cited in the source.", "Exam angle": "Questions may be framed on the applicability of the POSH Act to public officials and the duty of police under criminal procedure to register FIRs and conduct unbiased investigations when women’s dignity is at stake."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-25"}, {"id": "c56f3d6a3984", "source": "livelaw", "category": "high-court", "title": "Thiruparankundram Deepam Row: Madras High Court Agrees To Urgently Hear Pleas Against Prohibitory Orders In Madurai", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The Madras High Court has agreed to urgently hear a batch of pleas challenging the prohibitory orders imposed in Madurai under Section 163 BNSS, in connection with the lighting of Karthigai Deepam in Thiruparankundram.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-thiruparankundram-urgent-plea-prohibitory-order-madurai-559748", "priority": 78, "topics": ["BNSS / CrPC"], "note": {"Facts": "The Madurai District Collector issued prohibitory orders under Section 163 BNSS to bar public assembly for the lighting of Karthigai Deepam at Thiruparankundram; devotees and officials filed pleas seeking permission to assemble and conduct the ritual.", "Issue": "Whether the prohibitory orders under Section 163 BNSS can be set aside to allow the lighting of the lamp and limited public presence.", "Held": "The Madras High Court agreed to hear the batch of pleas urgently and summoned the Collector and Police Commissioner, indicating a willingness to examine the validity of the prohibitory orders.", "Principle": "A court may entertain urgent petitions challenging prohibitory orders under Section 163 BNSS when they affect religious rites, balancing public order with constitutional freedom of religion.", "Provisions": "Section 163 BNSS; Supreme Court judgment (Justice Aravind Kumar & Justice Vipul M Pancholi) staying the Madras High Court’s earlier order; Madras High Court’s earlier judgment permitting lighting (now stayed)."}, "syllabus": {"clusters": ["Evidence and crime"], "acts": ["BNSS / CrPC"], "landmark": false, "boost": 12}, "date": "2026-11-25"}, {"id": "13d4e936fd19", "source": "livelaw", "category": "supreme-court", "title": "Cauvery River Dispute : Supreme Court Dismisses Tamil Nadu's Applications Seeking Additional Water Release By Karnataka", "court": "Supreme Court", "case_name": "STATE OF TAMIL NADU v. STATE OF KARNATAKA AND ORS", "ratio": null, "summary": "Supreme Court judgment in STATE OF TAMIL NADU v. STATE OF KARNATAKA AND ORS.", "url": "https://www.livelaw.in/sc-judgments/2026-livelaw-sc-1192-state-of-tamil-nadu-versus-state-of-karnataka-and-ors-559714", "priority": 76, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-25"}, {"id": "7a5f54d8e1cb", "source": "livelaw", "category": "high-court", "title": "Thiruparankundram Karthigai Deepam | Implement SC Order, Review Pendency No Ground For Non-Compliance : Madras High Court To Authorities", "court": "Madras High Court", "case_name": null, "ratio": "The prohibitory order issued by Madurai Collector in the area cannot come in the way of exercise of fundamental rights of the devotees", "summary": "The Madras High Court on Tuesday (November 24) directed Madurai Collector and other authorities to comply with Supreme Court's order permitting lighting of the lamp for Karthigai Deepam celebrations at Thiruparankundram today.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-thiruparankundram-deepam-row-lighting-lamp-559801", "priority": 76, "topics": ["Constitution"], "note": {"Facts": "The Madurai District Collector issued a prohibitory order under Section 163 BNSS to prevent unauthorised persons from climbing the hill at Thiruparankundram during Karthi gai Deepam. Petitioners claimed the order obstructed the Supreme Court’s November 20 order permitting the lighting of the lamp and infringed devotees’ right to worship.", "Issue": "Whether the Collector’s prohibitory order can be enforced despite the Supreme Court’s direction allowing the lamp-lighting ceremony and whether pending review of the Supreme Court order is a ground for non-compliance.", "Held": "The Madras High Court directed the Collector and all other authorities to comply with the Supreme Court order; the prohibitory order cannot override the Supreme Court’s direction, and pending review is not a ground for non-compliance. Unlawfully detained persons must be released.", "Principle": "A prohibitory order issued by a civil authority must yield to a Supreme Court order; under Article 144, all authorities in India are bound to act in aid of the Supreme Court, and such orders cannot curtail fundamental rights under Article 25.", "Exam angle": "Questions may test the interplay between Article 144 (obligation of authorities to obey Supreme Court orders) and Article 25 (freedom of religion), or ask to identify the statutory provision (Section 163 BNSS) that cannot be invoked to defeat a Supreme Court direction."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-25"}, {"id": "da884a787bce", "source": "livelaw", "category": "high-court", "title": "Madras High Court Gags Media From Publishing Details of Sexual Harassment Case Against Kallakurichi MLA", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The Madras High Court, on Tuesday (November 24), has issued a gag order restraining the media from publishing information relating to the sexual harassment case involving Kallakurichi MLA Arul.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-kallakurichi-mla-media-gag-order-restrain-publishing-details-559830", "priority": 76, "topics": ["Constitution"], "note": {"Facts": "The Madras High Court restrained media from publishing any details of a sexual-harassment case involving Kallakurichi MLA Arul Vignesh, after widespread publicity and an FIR was filed for obscene messages sent to a woman officer.", "Issue": "Whether the press and social-media platforms may be enjoined from disclosing the contents of the complaint and inquiry under the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013.", "Held": "The court issued an interim injunction prohibiting publication of any matter covered by Section 16 of the PoSH Act and directed removal of related posts, with police monitoring for violations.", "Principle": "Publication of the contents of a sexual-harassment complaint or inquiry proceedings is prohibited under Section 16 of the PoSH Act, and the court may enforce this by restraining the media and ordering removal of offending material.", "Provisions": "Section 16 of the Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013; no other statutes or cases cited.", "Exam angle": "PoSH Act – focus on Section 16’s prohibition on publishing complaint details; could be asked on the scope of media injunctions and the court’s power to enforce confidentiality in sexual-harassment proceedings."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-25"}, {"id": "f132b1e0c0a6", "source": "scobserver", "category": "supreme-court", "title": "Supreme Court to be led by 4 CJIs in 2027 - Supreme Court Observer", "court": null, "case_name": null, "ratio": null, "summary": "", "url": "https://www.scobserver.in/journal/supreme-court-to-be-led-by-4-cjis-in-2027/", "priority": 74, "topics": ["General"], "note": null, "syllabus": {"clusters": [], "acts": [], "landmark": false, "boost": -10}, "date": "2026-11-25"}, {"id": "b519399b0d1e", "source": "livelaw", "category": "high-court", "title": "Thiruparankundram Deepam Row: Madras High Court Asks State To Reconsider Prohibitory Orders In Madurai, Cites Devotees' Article 25 Rights", "court": "Madras High Court", "case_name": null, "ratio": null, "summary": "The Madras High Court (Madurai Bench) on Tuesday (November 24) asked the Tamil Nadu government to reconsider the prohibitory orders imposed in Madurai in connection with the Karthigai Deepam celebrations at Thiruparankundram, observing that the restrictions could impede devotees' right to practise and profess religion under Article 25 of the Constitution of India.", "url": "https://www.livelaw.in/high-court/madras-high-court/madras-high-court-thiruparankundram-deepam-row-559767", "priority": 74, "topics": ["Constitution"], "note": {"Facts": "The Madurai Collector issued prohibitory orders under Section 163 BNSS restricting assemblies for the Karthigai Deepam lighting at Thiruparankundram, despite a Supreme Court order permitting a one-time lighting on 24 Nov.", "Issue": "Whether the State’s prohibitory orders can stand when they impede devotees’ right to practise religion under Article 25 of the Constitution.", "Held": "The Madras High Court directed the State to reconsider the prohibitory orders, emphasizing they must not obstruct the exercise of Article 25 rights and must implement the Supreme Court’s directive.", "Principle": "A State may not enforce prohibitory orders that curtail the fundamental right to freedom of religion (Art 25) where a higher court has authorised the religious activity; the higher court’s order must be implemented.", "Provisions": "Article 25 Constitution of India; Section 163 BNSS (Tamil Nadu) – as cited in the pleadings; Supreme Court order permitting one-time lighting of the lamp.", "Exam angle": "Questions may arise under the Constitution (Article 25) on the limits of state-imposed restrictions on religious practice, testing the interplay between statutory prohibitions (Section 163 BNSS) and Supreme Court directives."}, "syllabus": {"clusters": ["Personal, local and constitutional"], "acts": ["Constitution"], "landmark": false, "boost": 8}, "date": "2026-11-25"}, {"id": "b6c5ac9f6fcc", "source": "livelaw", "category": "supreme-court", "title": "Indian Student In Russia Joins Russian Army; Supreme Court Seeks Centre's Response On Father's Plea For His Return", "court": "Supreme Court", "case_name": null, "ratio": null, "summary": "A bench of CJI Surya Kant, Justice Joymalya Bagchi and Justice V Mohana passed the order in the petitioner-father's plea, asking Solicitor General Tushar Mehta to intervene in the matter obtain instructions. The bench considered that only limited intervention by the Indian authorities was possible, as the petitioner's son had seemingly relinquished his Indian citizenship and acquired Russian citizenship. The SG however informed the bench that the Russian authorities had informed the Indian Embassy that the petitioner's son had taken Russian citizenship, and hence the scope for Indian intervention was limited.", "url": "https://www.livelaw.in/top-stories/supreme-court-indian
